  <rect x="18.15" y="6.2" width="0.6" height="0.6" fill="#000000" stroke="none"/>
  <rect x="22.15" y="6.2" width="0.6" height="0.6" fill="#000000" stroke="none"/>
  <rect x="3.15" y="11" width="0.6" height="0.6" fill="#000000" stroke="none"/>
  <rect x="7.15" y="11" width="0.6" height="0.6" fill="#000000" stroke="none"/>
  <rect x="18.15" y="11" width="0.6" height="0.6" fill="#000000" stroke="none"/>
  <rect x="22.15" y="11" width="0.6" height="0.6" fill="#000000" stroke="none"/>

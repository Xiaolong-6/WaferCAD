<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 18">
  <metadata>WaferCAD paper-reconstructed mask v2; M3D cell; HfO2 contact/via openings aligned with gate and tier-1 power-via landings; 1 viewBox unit = 1 um; black fill = operation region.</metadata>
  <rect x="12" y="5" width="4" height="1" fill="#000000" stroke="none"/>
  <rect x="12" y="12" width="4" height="1" fill="#000000" stroke="none"/>
  <rect x="3.15" y="6.2" width="0.6" height="0.6" fill="#000000" stroke="none"/>

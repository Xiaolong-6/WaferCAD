    <script>
      window.addEventListener('error', () => {
        document.body.dataset.errors = String(Number(document.body.dataset.errors) + 1);
      });
      const frame = document.getElementById('frame');
      function update() {
        frame.style.width = document.getElementById('width').value + 'px';
        const body = frame.contentDocument && frame.contentDocument.body;
        if (!body) return;
        body.dataset.empty = String(document.getElementById('empty').checked);
        body.dataset.failed = String(document.getElementById('failure').checked);
        body.dataset.placement = document.getElementById('placement').value;
        document.body.dataset.ready = 'true';
      }
      frame.addEventListener('load', update);
      ['width', 'empty', 'failure', 'placement'].forEach((id) =>
        document.getElementById(id).addEventListener('change', update),
      );
    </script>

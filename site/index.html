<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>WaferCAD</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><strong>WaferCAD</strong></div>
      <nav class="top-actions" aria-label="Project">
        <button id="newProjectBtn" class="toolbar-btn" title="Start a new empty project">
          New
        </button>
        <label class="button toolbar-btn" title="Open a WaferCAD project"
          >Open<input id="openProjectInput" type="file" accept=".json,.wafercad" hidden
        /></label>
        <button id="saveProjectBtn" class="toolbar-btn" title="Save this project">Save</button>
        <span class="toolbar-separator"></span>
        <button id="undoBtn" class="toolbar-btn" title="Undo the last structure change" disabled>
          Undo
        </button>
        <button id="redoBtn" class="toolbar-btn" title="Redo the last undone change" disabled>
          Redo
        </button>
      </nav>
    </header>

    <div class="app-shell">
      <main class="workspace">
        <section class="view-panel" id="mainPanel">
          <div class="view-head">
            <div><strong>Main</strong><span id="mainFaceLabel">front surface</span></div>
            <div class="view-tools">
              <div class="zoom-tools" title="Main view zoom">
                <button
                  id="mainZoomOut"
                  class="mini-btn"
                  title="Zoom out Main"
                  aria-label="Zoom out Main"
                >
                  −
                </button>
                <button
                  id="mainZoomIn"
                  class="mini-btn"
                  title="Zoom in Main"
                  aria-label="Zoom in Main"
                >
                  +
                </button>
                <button id="mainZoomFit" class="mini-btn" title="Fit Main view">Fit</button>
              </div>
              <div id="mainCoords" class="readout"></div>
              <button
                id="resetSectionBtn"
                class="mini-btn"
                title="Reset A–B to the default horizontal section"
              >
                Reset A–B
              </button>
            </div>
          </div>
          <canvas id="mainCanvas"></canvas>
        </section>

        <section class="view-panel" id="maskPanel">
          <div class="view-head mask-view-head">
            <div><strong>Mask</strong><span id="maskCellLabel">—</span></div>
            <div class="view-tools">
              <div class="focus-tools" title="Limit 3D rendering only">
                <button
                  class="roi-tool mini-btn"
                  data-tool="rect"
                  title="Draw a rectangular 3D focus region"
                >
                  Rect
                </button>
                <button
                  class="roi-tool mini-btn"
                  data-tool="circle"
                  title="Draw a circular 3D focus region"
                >
                  Circle
                </button>
                <button id="clearRoiBtn" class="mini-btn" title="Clear the 3D focus region">
                  Clear
                </button>
              </div>
              <div class="zoom-tools" title="Mask view zoom">
                <button
                  id="maskZoomOut"
                  class="mini-btn"
                  title="Zoom out Mask"
                  aria-label="Zoom out Mask"
                >
                  −
                </button>
                <button
                  id="maskZoomIn"
                  class="mini-btn"
                  title="Zoom in Mask"
                  aria-label="Zoom in Mask"
                >
                  +
                </button>
                <button id="maskZoomFit" class="mini-btn" title="Fit Mask view">Fit</button>
              </div>
              <div id="maskCoords" class="readout"></div>
            </div>
          </div>
          <canvas id="maskCanvas"></canvas>
          <div class="view-foot"><span id="maskSelectionSummary"></span></div>
        </section>

        <section class="view-panel" id="threePanel">
          <div class="view-head">
            <div><strong>3D</strong><span id="threeStats"></span></div>
            <button id="fit3dBtn" class="mini-btn" title="Fit the 3D model">Fit</button>
          </div>
          <div id="threeHost"></div>
        </section>

        <section class="tool-panel" id="toolPanel" aria-label="Workspace tools">
          <div class="tool-tabs" role="tablist" aria-label="Workspace tools">
            <button
              id="baseTab"
              class="tool-tab active"
              type="button"
              role="tab"
              aria-controls="baseTools"
              aria-selected="true"
              data-tool-tab="base"
            >
              Base
            </button>
            <button
              id="maskTab"
              class="tool-tab"
              type="button"
              role="tab"
              aria-controls="maskTools"
              aria-selected="false"
              tabindex="-1"
              data-tool-tab="mask"
            >
              Mask
            </button>
            <button
              id="operationTab"
              class="tool-tab"
              type="button"
              role="tab"
              aria-controls="operationTools"
              aria-selected="false"
              tabindex="-1"
              data-tool-tab="operation"
            >
              Operation
            </button>
            <button
              id="snapshotsTab"
              class="tool-tab"
              type="button"
              role="tab"
              aria-controls="snapshotsTools"
              aria-selected="false"
              tabindex="-1"
              data-tool-tab="snapshots"
            >
              Snapshots <span id="snapshotCount" class="badge">0</span>
            </button>
            <button
              id="settingsTab"
              class="tool-tab"
              type="button"
              role="tab"
              aria-controls="settingsTools"
              aria-selected="false"
              tabindex="-1"
              data-tool-tab="settings"
            >
              Settings
            </button>
          </div>

          <div class="tool-tab-content">
            <section
              id="baseTools"
              class="tool-tab-panel control-section"
              role="tabpanel"
              aria-labelledby="baseTab"
              data-tab-panel="base"
            >
              <div class="tool-context">
                <span id="baseSummary" class="muted">100000 × 100000 µm · Z 12 rel.</span>
              </div>
              <div class="control-body">
                <div class="segmented" id="substrateShape">
                  <button data-shape="rect" title="Use a rectangular base">Rectangle</button>
                  <button data-shape="circle" class="active" title="Use a circular base">
                    Circle
                  </button>
                </div>
                <div class="three-fields">
                  <label
                    ><span>W <b id="baseWidthUnit">µm</b></span
                    ><input id="baseWidth" type="number" value="100000" min="0" step="any"
                  /></label>
                  <label
                    ><span>H <b id="baseHeightUnit">µm</b></span
                    ><input
                      id="baseHeight"
                      type="number"
                      value="100000"
                      min="0"
                      step="any"
                      disabled
                  /></label>
                  <label
                    ><span>Z rel.</span
                    ><input id="baseThickness" type="number" value="12" min="0.2" step="0.2"
                  /></label>
                </div>
                <div class="button-row base-actions">
                  <button id="applyBaseBtn">Apply base</button>
                  <button id="revertBaseBtn" class="quiet" disabled>Revert</button>
                </div>
              </div>
            </section>

            <section
              id="maskTools"
              class="tool-tab-panel control-section"
              role="tabpanel"
              aria-labelledby="maskTab"
              data-tab-panel="mask"
              hidden
            >
              <div class="tool-context">
                <span id="maskSummary" class="muted">No mask</span>
              </div>
              <div class="control-body">
                <div class="button-row">
                  <label
                    class="button primary compact-btn import-btn"
                    title="Import a GDSII or OASIS layout"
                    >Import layout<input
                      id="gdsInput"
                      type="file"
                      accept=".gds,.gdsii,.oas,.oasis"
                      hidden
                  /></label>
                  <button id="demoMaskBtn" class="compact-btn" title="Load the built-in demo mask">
                    Demo
                  </button>
                </div>
                <div class="mask-browser">
                  <section class="mask-browser-pane">
                    <div class="pane-title">Cells</div>
                    <div id="cellTree" class="cell-tree"></div>
                  </section>
                  <section class="mask-browser-pane">
                    <div class="pane-title">Layers</div>
                    <div id="maskLayerList" class="layer-list"></div>
                  </section>
                </div>
                <details class="subgroup">
                  <summary>Advanced · alignment</summary>
                  <div class="four-fields">
                    <label
                      ><span>X <b id="maskOffsetXUnit">µm</b></span
                      ><input id="maskOffsetX" type="number" value="0" step="any"
                    /></label>
                    <label
                      ><span>Y <b id="maskOffsetYUnit">µm</b></span
                      ><input id="maskOffsetY" type="number" value="0" step="any"
                    /></label>
                    <label
                      ><span>S</span><input id="maskScale" type="number" value="1" step="0.05"
                    /></label>
                    <label
                      ><span>R°</span><input id="maskRotation" type="number" value="0" step="1"
                    /></label>
                  </div>
                </details>
              </div>
            </section>

            <section
              id="operationTools"
              class="tool-tab-panel control-section operation-section"
              role="tabpanel"
              aria-labelledby="operationTab"
              data-tab-panel="operation"
              hidden
            >
              <div class="tool-context">
                <span>Active face</span><span id="activeFacePill" class="face-pill">Front</span>
              </div>
              <div class="segmented" id="faceSelect">
                <button data-face="front" class="active">Front</button>
                <button data-face="back">Back</button>
              </div>
              <label class="field-row"
                ><span>Action</span
                ><select id="operationType">
                  <option value="add">Add new layer</option>
                  <option value="grow">Grow current layer</option>
                  <option value="etch">Etch / subtract</option>
                </select></label
              >
              <label id="layerNameRow" class="field-row"
                ><span>Name</span><input id="layerName" value="Layer 1"
              /></label>
              <label id="targetLayerRow" class="field-row hidden"
                ><span>Layer</span
                ><select id="targetLayer"></select
              ></label>
              <label class="field-row"
                ><span>Area</span
                ><select id="operationArea">
                  <option value="mask">Selected mask</option>
                  <option value="invert">Invert mask</option>
                  <option value="full">Whole face</option>
                </select></label
              >
              <label id="growthModeRow" class="field-row"
                ><span>Growth</span
                ><select id="growthMode">
                  <option value="direct">Direct</option>
                  <option value="conformal">Conformal</option>
                </select></label
              >
              <label class="field-row"
                ><span>Z Δ</span
                ><input id="operationThickness" type="number" value="3" min="0.1" step="0.1"
              /></label>
              <button id="applyOperationBtn" class="primary wide apply-btn">Apply</button>
              <p id="operationNote" class="hint compact-hint">
                Direct footprint · Conformal includes sidewalls.
              </p>
            </section>

            <section
              id="snapshotsTools"
              class="tool-tab-panel control-section"
              role="tabpanel"
              aria-labelledby="snapshotsTab"
              data-tab-panel="snapshots"
              hidden
            >
              <div class="control-body snapshot-panel">
                <button
                  id="saveSnapshotBtn"
                  class="wide compact-btn"
                  title="Save the current workspace state"
                >
                  Save snapshot
                </button>
                <div id="snapshotList" class="snapshot-list"></div>
              </div>
            </section>

            <section
              id="settingsTools"
              class="tool-tab-panel control-section"
              role="tabpanel"
              aria-labelledby="settingsTab"
              data-tab-panel="settings"
              hidden
            >
              <div class="tool-context"><span>Display</span></div>
              <div class="control-body">
                <label
                  class="field-row"
                  title="Display unit only; geometry remains stored internally in µm"
                >
                  <span>XY unit</span>
                  <select id="xyUnitSelect" aria-label="XY display unit">
                    <option value="nm">nm</option>
                    <option value="um" selected>µm</option>
                    <option value="mm">mm</option>
                  </select>
                </label>
              </div>
            </section>
          </div>
        </section>

        <section class="view-panel" id="sectionPanel">
          <div class="view-head">
            <div><strong>Section A–B</strong><span id="sectionMeta"></span></div>
            <span id="sectionRange" class="readout"></span>
          </div>
          <div class="section-body">
            <canvas id="sectionCanvas"></canvas>
            <aside id="layerLegend" class="layer-legend" aria-label="Structure layers"></aside>
          </div>
        </section>
      </main>
    </div>

    <footer class="statusbar">
      <span id="statusText">Ready.</span>
      <span class="status-links">
        <a
          href="https://github.com/Xiaolong-6/WaferCAD"
          target="_blank"
          rel="noreferrer"
          title="Open the WaferCAD repository on GitHub"
          >GitHub</a
        >
        <span aria-hidden="true">·</span>
        <a id="buildCommit" title="Open the deployed commit on GitHub">commit local</a>
      </span>
    </footer>
    <script>
      (async () => {
        let version = String(Date.now());
        try {
          const response = await fetch('./build-info.json', { cache: 'no-store' });
          if (response.ok) {
            const info = await response.json();
            if (info.commit) version = String(info.commit);
          }
        } catch {}

        const suffix = `?v=${encodeURIComponent(version)}`;
        const stylesheet = document.createElement('link');
        stylesheet.rel = 'stylesheet';
        stylesheet.href = `./style.css${suffix}`;
        document.head.append(stylesheet);

        await new Promise((resolve, reject) => {
          const vendor = document.createElement('script');
          vendor.src = `./vendor/polygon-clipping.umd.js${suffix}`;
          vendor.onload = resolve;
          vendor.onerror = () => reject(new Error('Failed to load polygon-clipping.'));
          document.head.append(vendor);
        });

        const app = document.createElement('script');
        app.type = 'module';
        app.src = `./app.js${suffix}`;
        document.body.append(app);
      })().catch((error) => {
        const host = document.getElementById('statusText');
        if (host) host.textContent = `Startup failed: ${error.message}`;
        console.error(error);
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>WaferCAD</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><strong>WaferCAD</strong></div>
      <nav class="top-actions" aria-label="Project">
        <button id="newProjectBtn" class="toolbar-btn">New</button>
        <label class="button toolbar-btn"
          >Open<input id="openProjectInput" type="file" accept=".json,.wafercad" hidden
        /></label>
        <button id="saveProjectBtn" class="toolbar-btn">Save</button>
        <span class="toolbar-separator"></span>
        <label class="unit-control" title="Display unit only. Geometry is stored internally in µm."
          ><span>XY</span
          ><select id="xyUnitSelect" aria-label="XY display unit">
            <option value="nm">nm</option>
            <option value="um" selected>µm</option>
            <option value="mm">mm</option>
          </select></label
        >
        <span class="toolbar-separator"></span>
        <button id="undoBtn" class="toolbar-btn" disabled>Undo</button>
        <button id="redoBtn" class="toolbar-btn" disabled>Redo</button>
      </nav>
    </header>

    <div class="app-shell">
      <main class="workspace">
        <section class="view-panel" id="mainPanel">
          <div class="view-head">
            <div><strong>Main</strong><span id="mainFaceLabel">front surface</span></div>
            <div class="view-tools">
              <div class="zoom-tools" title="Main view zoom">
                <button id="mainZoomOut" class="mini-btn">−</button>
                <button id="mainZoomIn" class="mini-btn">+</button>
                <button id="mainZoomFit" class="mini-btn">Fit</button>
              </div>
              <button
                id="sectionEditBtn"
                class="mini-btn"
                type="button"
                aria-pressed="false"
                title="Enable A–B endpoint dragging"
              >
                A–B
              </button>
              <div id="mainCoords" class="readout"></div>
              <button id="resetSectionBtn" class="mini-btn">Reset A–B</button>
            </div>
          </div>
          <canvas id="mainCanvas"></canvas>
          <div class="section-coords-panel" aria-label="A–B coordinates">
            <div class="section-coords-head">
              <strong>A–B</strong><span id="sectionCoordUnit">µm</span>
            </div>
            <div class="section-coords-grid">
              <span></span><span>X</span><span>Y</span>
              <strong>A</strong>
              <input id="sectionAx" type="number" step="any" aria-label="A X coordinate" />
              <input id="sectionAy" type="number" step="any" aria-label="A Y coordinate" />
              <strong>B</strong>
              <input id="sectionBx" type="number" step="any" aria-label="B X coordinate" />
              <input id="sectionBy" type="number" step="any" aria-label="B Y coordinate" />
            </div>
          </div>
        </section>

        <section class="view-panel" id="maskPanel">
          <div class="view-head mask-view-head">
            <div><strong>Mask</strong><span id="maskCellLabel">—</span></div>
            <div class="view-tools">
              <details id="focusEditor" class="focus-editor">
                <summary class="mini-btn" title="Edit the 3D focus region">Focus</summary>
                <div class="focus-popover">
                  <div class="focus-popover-actions">
                    <button class="roi-tool mini-btn" data-tool="rect" type="button">Rect</button>
                    <button class="roi-tool mini-btn" data-tool="circle" type="button">
                      Circle
                    </button>
                    <button id="clearRoiBtn" class="mini-btn" type="button">Clear</button>
                  </div>
                  <div id="roiEditor" class="roi-editor" hidden>
                    <div class="roi-editor-head">
                      <strong id="roiShapeLabel">Focus</strong><span id="roiUnitLabel">µm</span>
                    </div>
                    <div id="roiRectFields" class="roi-two-fields">
                      <label
                        ><span>Width</span><input id="roiWidth" type="number" min="0" step="any"
                      /></label>
                      <label
                        ><span>Height</span><input id="roiHeight" type="number" min="0" step="any"
                      /></label>
                    </div>
                    <div id="roiCircleFields" hidden>
                      <label class="roi-field"
                        ><span>Radius</span><input id="roiRadius" type="number" min="0" step="any"
                      /></label>
                    </div>
                    <label class="roi-field"
                      ><span>Reference</span
                      ><select id="roiAnchorSelect">
                        <option value="center">Center / origin</option>
                        <option value="top-left">Top-left</option>
                        <option value="bottom-left">Bottom-left</option>
                        <option value="top-right">Top-right</option>
                        <option value="bottom-right">Bottom-right</option>
                      </select></label
                    >
                    <div class="roi-two-fields">
                      <label><span>X</span><input id="roiX" type="number" step="any" /></label>
                      <label><span>Y</span><input id="roiY" type="number" step="any" /></label>
                    </div>
                  </div>
                </div>
              </details>
              <div class="zoom-tools" title="Mask view zoom">
                <button id="maskZoomOut" class="mini-btn">−</button>
                <button id="maskZoomIn" class="mini-btn">+</button>
                <button id="maskZoomFit" class="mini-btn">Fit</button>
              </div>
              <div id="maskCoords" class="readout"></div>
            </div>
          </div>
          <canvas id="maskCanvas"></canvas>
          <div class="view-foot"><span id="maskSelectionSummary"></span></div>
        </section>

        <section class="view-panel" id="threePanel">
          <div class="view-head">
            <div><strong>3D</strong><span id="threeStats"></span></div>
            <div class="three-view-tools">
              <details class="three-opacity-control">
                <summary
                  class="mini-btn three-opacity-button"
                  aria-label="Adjust all layer transparency"
                  title="Adjust all layer transparency"
                >
                  ◐
                </summary>
                <div class="three-opacity-popover">
                  <label for="threeOpacityRange"
                    ><span>Opacity</span><output id="threeOpacityValue">100%</output></label
                  >
                  <input
                    id="threeOpacityRange"
                    type="range"
                    min="0.1"
                    max="1"
                    step="0.05"
                    value="1"
                  />
                </div>
              </details>
              <label class="three-border-toggle" title="Outline visible layer interfaces in black">
                <input id="threeBorders" type="checkbox" />
                <span>Border</span>
              </label>
              <button id="fit3dBtn" class="mini-btn">Fit</button>
            </div>
          </div>
          <div id="threeHost"></div>
        </section>

        <section class="tool-panel" id="toolPanel" aria-label="Workspace tools">
          <div class="tool-tabs" role="tablist" aria-label="Workspace tools">
            <button
              id="baseTab"
              class="tool-tab active"
              type="button"
              role="tab"
              aria-controls="baseTools"
              aria-selected="true"
              data-tool-tab="base"
            >
              Base
            </button>
            <button
              id="maskTab"
              class="tool-tab"
              type="button"
              role="tab"
              aria-controls="maskTools"
              aria-selected="false"
              tabindex="-1"
              data-tool-tab="mask"
            >
              Mask
            </button>
            <button
              id="operationTab"
              class="tool-tab"
              type="button"
              role="tab"
              aria-controls="operationTools"
              aria-selected="false"
              tabindex="-1"
              data-tool-tab="operation"
            >
              Operation
            </button>
            <button
              id="snapshotsTab"
              class="tool-tab"
              type="button"
              role="tab"
              aria-controls="snapshotsTools"
              aria-selected="false"
              tabindex="-1"
              data-tool-tab="snapshots"
            >
              Snapshots <span id="snapshotCount" class="badge">0</span>
            </button>
          </div>

          <div class="tool-tab-content">
            <section
              id="baseTools"
              class="tool-tab-panel control-section"
              role="tabpanel"
              aria-labelledby="baseTab"
              data-tab-panel="base"
            >
              <div class="tool-context">
                <span id="baseSummary" class="muted">100000 × 100000 µm · Z 12 rel.</span>
              </div>
              <div class="control-body">
                <div class="segmented" id="substrateShape">
                  <button data-shape="rect">Rectangle</button>
                  <button data-shape="circle" class="active">Circle</button>
                </div>
                <div class="three-fields">
                  <label
                    ><span>W <b id="baseWidthUnit">µm</b></span
                    ><input id="baseWidth" type="number" value="100000" min="0" step="any"
                  /></label>
                  <label
                    ><span>H <b id="baseHeightUnit">µm</b></span
                    ><input
                      id="baseHeight"
                      type="number"
                      value="100000"
                      min="0"
                      step="any"
                      disabled
                  /></label>
                  <label
                    ><span>Z rel.</span
                    ><input id="baseThickness" type="number" value="12" min="0.2" step="0.2"
                  /></label>
                </div>
                <div class="button-row base-actions">
                  <button id="applyBaseBtn">Apply base</button>
                  <button id="revertBaseBtn" class="quiet" disabled>Revert</button>
                </div>
              </div>
            </section>

            <section
              id="maskTools"
              class="tool-tab-panel control-section"
              role="tabpanel"
              aria-labelledby="maskTab"
              data-tab-panel="mask"
              hidden
            >
              <div class="tool-context">
                <span id="maskSummary" class="muted">No mask</span>
              </div>
              <div class="control-body">
                <div class="button-row">
                  <label class="button primary compact-btn import-btn"
                    >Import layout<input
                      id="gdsInput"
                      type="file"
                      accept=".gds,.gdsii,.oas,.oasis"
                      hidden
                  /></label>
                  <button id="demoMaskBtn" class="compact-btn">Demo</button>
                </div>
                <div class="mask-browser">
                  <section class="mask-browser-pane">
                    <div class="pane-title">Cells</div>
                    <div id="cellTree" class="cell-tree"></div>
                  </section>
                  <section class="mask-browser-pane">
                    <div class="pane-title">Layers</div>
                    <div id="maskLayerList" class="layer-list"></div>
                  </section>
                </div>
                <details class="subgroup">
                  <summary>Advanced · alignment</summary>
                  <div class="four-fields">
                    <label
                      ><span>X <b id="maskOffsetXUnit">µm</b></span
                      ><input id="maskOffsetX" type="number" value="0" step="any"
                    /></label>
                    <label
                      ><span>Y <b id="maskOffsetYUnit">µm</b></span
                      ><input id="maskOffsetY" type="number" value="0" step="any"
                    /></label>
                    <label
                      ><span>S</span><input id="maskScale" type="number" value="1" step="0.05"
                    /></label>
                    <label
                      ><span>R°</span><input id="maskRotation" type="number" value="0" step="1"
                    /></label>
                  </div>
                </details>
              </div>
            </section>

            <section
              id="operationTools"
              class="tool-tab-panel control-section operation-section"
              role="tabpanel"
              aria-labelledby="operationTab"
              data-tab-panel="operation"
              hidden
            >
              <div class="tool-context">
                <span>Active face</span><span id="activeFacePill" class="face-pill">Front</span>
              </div>
              <div class="segmented" id="faceSelect">
                <button data-face="front" class="active">Front</button>
                <button data-face="back">Back</button>
              </div>
              <label class="field-row"
                ><span>Action</span
                ><select id="operationType">
                  <option value="add">Add new layer</option>
                  <option value="grow">Grow current layer</option>
                  <option value="etch">Etch / subtract</option>
                </select></label
              >
              <label id="layerNameRow" class="field-row"
                ><span>Name</span><input id="layerName" value="Layer 1"
              /></label>
              <label id="targetLayerRow" class="field-row hidden"
                ><span>Layer</span
                ><select id="targetLayer"></select
              ></label>
              <label class="field-row"
                ><span>Area</span
                ><select id="operationArea">
                  <option value="mask">Selected mask</option>
                  <option value="invert">Invert mask</option>
                  <option value="full">Whole face</option>
                </select></label
              >
              <label id="growthModeRow" class="field-row"
                ><span>Growth</span
                ><select id="growthMode">
                  <option value="direct">Direct</option>
                  <option value="conformal">Conformal</option>
                </select></label
              >
              <label class="field-row"
                ><span>Z Δ</span
                ><input id="operationThickness" type="number" value="3" min="0.1" step="0.1"
              /></label>
              <button id="applyOperationBtn" class="primary wide apply-btn">Apply</button>
              <p id="operationNote" class="hint compact-hint">
                Direct footprint · Conformal includes sidewalls.
              </p>
            </section>

            <section
              id="snapshotsTools"
              class="tool-tab-panel control-section"
              role="tabpanel"
              aria-labelledby="snapshotsTab"
              data-tab-panel="snapshots"
              hidden
            >
              <div class="control-body snapshot-panel">
                <button id="saveSnapshotBtn" class="wide compact-btn">Save snapshot</button>
                <div id="snapshotList" class="snapshot-list"></div>
              </div>
            </section>
          </div>
        </section>

        <section class="view-panel" id="sectionPanel">
          <div class="view-head">
            <div><strong>Section A–B</strong><span id="sectionMeta"></span></div>
            <span id="sectionRange" class="readout"></span>
          </div>
          <div class="section-body">
            <canvas id="sectionCanvas"></canvas>
            <aside id="layerLegend" class="layer-legend" aria-label="Structure layers"></aside>
          </div>
        </section>
      </main>
    </div>

    <footer class="statusbar">
      <span id="statusText">Ready.</span><span id="buildCommit">commit local</span>
    </footer>
    <script>
      (async () => {
        let version = String(Date.now());
        try {
          const response = await fetch('./build-info.json', { cache: 'no-store' });
          if (response.ok) {
            const info = await response.json();
            if (info.commit) version = String(info.commit);
          }
        } catch {}

        const suffix = `?v=${encodeURIComponent(version)}`;
        const stylesheet = document.createElement('link');
        stylesheet.rel = 'stylesheet';
        stylesheet.href = `./style.css${suffix}`;
        document.head.append(stylesheet);

        await new Promise((resolve, reject) => {
          const vendor = document.createElement('script');
          vendor.src = `./vendor/polygon-clipping.umd.js${suffix}`;
          vendor.onload = resolve;
          vendor.onerror = () => reject(new Error('Failed to load polygon-clipping.'));
          document.head.append(vendor);
        });

        const app = document.createElement('script');
        app.type = 'module';
        app.src = `./app.js${suffix}`;
        document.body.append(app);
      })().catch((error) => {
        const host = document.getElementById('statusText');
        if (host) host.textContent = `Startup failed: ${error.message}`;
        console.error(error);
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>WaferCAD</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><strong>WaferCAD</strong></div>
    <nav class="top-actions" aria-label="Project">
      <button id="newProjectBtn" class="toolbar-btn">New</button>
      <label class="button toolbar-btn">Open<input id="openProjectInput" type="file" accept=".json,.wafercad" hidden></label>
      <button id="saveProjectBtn" class="toolbar-btn">Save</button>
      <span class="toolbar-separator"></span>
      <button id="undoBtn" class="toolbar-btn" disabled>Undo</button>
      <button id="redoBtn" class="toolbar-btn" disabled>Redo</button>
    </nav>
  </header>

  <div class="app-shell">
    <aside class="sidebar">
      <details class="control-section sidebar-group">
        <summary class="section-head"><span>Base</span><span id="baseSummary" class="muted">100 × 80 × 12</span></summary>
        <div class="control-body">
          <div class="segmented" id="substrateShape">
            <button data-shape="rect" class="active">Rectangle</button>
            <button data-shape="circle">Circle</button>
          </div>
          <div class="three-fields">
            <label><span>W</span><input id="baseWidth" type="number" value="100" min="4" step="1"></label>
            <label><span>H</span><input id="baseHeight" type="number" value="80" min="4" step="1"></label>
            <label><span>T</span><input id="baseThickness" type="number" value="12" min="0.2" step="0.2"></label>
          </div>
          <button id="applyBaseBtn" class="wide">Create / reset base</button>
        </div>
      </details>

      <details class="control-section sidebar-group" open>
        <summary class="section-head"><span>Mask</span><span id="maskSummary" class="muted">Demo</span></summary>
        <div class="control-body">
          <div class="button-row">
            <label class="button primary compact-btn import-btn">Import GDS<input id="gdsInput" type="file" accept=".gds,.gdsii" hidden></label>
            <button id="demoMaskBtn" class="compact-btn">Demo</button>
          </div>
          <div class="mask-browser">
            <section class="mask-browser-pane">
              <div class="pane-title">Cells</div>
              <div id="cellTree" class="cell-tree"></div>
            </section>
            <section class="mask-browser-pane">
              <div class="pane-title">Layers</div>
              <div id="maskLayerList" class="layer-list"></div>
            </section>
          </div>
          <details class="subgroup">
            <summary>Advanced · alignment</summary>
            <div class="four-fields">
              <label><span>X</span><input id="maskOffsetX" type="number" value="0" step="1"></label>
              <label><span>Y</span><input id="maskOffsetY" type="number" value="0" step="1"></label>
              <label><span>S</span><input id="maskScale" type="number" value="1" step="0.05"></label>
              <label><span>R°</span><input id="maskRotation" type="number" value="0" step="1"></label>
            </div>
          </details>
        </div>
      </details>

      <section class="control-section operation-section">
        <div class="section-head"><span>Operation</span><span id="activeFacePill" class="face-pill">Front</span></div>
        <div class="segmented" id="faceSelect">
          <button data-face="front" class="active">Front</button>
          <button data-face="back">Back</button>
        </div>
        <label class="field-row"><span>Action</span><select id="operationType">
          <option value="add">Add new layer</option>
          <option value="grow">Grow current layer</option>
          <option value="etch">Etch / subtract</option>
        </select></label>
        <label id="layerNameRow" class="field-row"><span>Name</span><input id="layerName" value="Layer 2"></label>
        <label id="targetLayerRow" class="field-row hidden"><span>Layer</span><select id="targetLayer"></select></label>
        <label class="field-row"><span>Area</span><select id="operationArea">
          <option value="mask">Selected mask</option>
          <option value="full">Whole face</option>
        </select></label>
        <label id="growthModeRow" class="field-row"><span>Growth</span><select id="growthMode">
          <option value="direct">Direct</option>
          <option value="conformal">Conformal</option>
        </select></label>
        <label class="field-row"><span>Thickness</span><input id="operationThickness" type="number" value="3" min="0.1" step="0.1"></label>
        <button id="applyOperationBtn" class="primary wide apply-btn">Apply</button>
        <p id="operationNote" class="hint compact-hint">Direct footprint · Conformal includes sidewalls.</p>
      </section>

      <details class="control-section sidebar-group">
        <summary class="section-head"><span>Structure</span><span id="structureCount" class="muted"></span></summary>
        <div class="control-body"><div id="structureList" class="structure-list"></div></div>
      </details>
    </aside>

    <main class="workspace">
      <section class="view-panel" id="maskPanel">
        <div class="view-head mask-view-head">
          <div><strong>Mask</strong><span id="maskCellLabel">TOP</span></div>
          <div class="view-tools">
            <div class="focus-tools" title="Limit 3D rendering only">
              <button class="roi-tool mini-btn" data-tool="rect">Rect</button>
              <button class="roi-tool mini-btn" data-tool="circle">Circle</button>
              <button class="roi-tool mini-btn" data-tool="polygon">Poly</button>
              <button id="clearRoiBtn" class="mini-btn">Clear</button>
            </div>
            <div id="maskCoords" class="readout"></div>
          </div>
        </div>
        <canvas id="maskCanvas"></canvas>
        <div class="view-foot"><span id="maskSelectionSummary"></span></div>
      </section>

      <section class="view-panel" id="threePanel">
        <div class="view-head"><div><strong>3D</strong><span id="threeStats"></span></div><button id="fit3dBtn" class="mini-btn">Fit</button></div>
        <div id="threeHost"></div>
      </section>

      <section class="view-panel" id="mainPanel">
        <div class="view-head"><div><strong>Main</strong><span id="mainFaceLabel">front surface</span></div><button id="resetSectionBtn" class="mini-btn">Reset A–B</button></div>
        <canvas id="mainCanvas"></canvas>
      </section>

      <section class="view-panel" id="sectionPanel">
        <div class="view-head"><div><strong>Section A–B</strong><span id="sectionMeta"></span></div><span id="sectionRange" class="readout"></span></div>
        <canvas id="sectionCanvas"></canvas>
      </section>
    </main>
  </div>

  <footer class="statusbar"><span id="statusText">Ready.</span><span>browser-only</span></footer>
  <script type="module" src="./app.js"></script>
</body>
</html>

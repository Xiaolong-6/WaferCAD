<!doctype html>
<html lang="zh-CN" data-ui="v2" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WaferCAD UI v2 · M2 mock shell</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="ui-v2/tokens.css" />
    <link rel="stylesheet" href="ui-v2/components.css" />
    <link rel="stylesheet" href="ui-v2/workstation-v2.css" />
    <script src="ui-v2/view-state.js" defer></script>
    <script src="ui-v2/live-preview.js" defer></script>
    <script src="ui-v2/view-icons.js" defer></script>
    <script src="ui-v2/native-components.js" defer></script>
    <script src="ui-v2/view-panel.js" defer></script>
    <script src="ui-v2/section-legend.js" defer></script>
    <script src="ui-v2/workstation-v2.js" defer></script>
    <script src="ui-v2/mock-data.js" defer></script>
    <script src="ui-v2/mock-domain-panels.js" defer></script>
    <script src="ui-v2/history-tree.js" defer></script>
    <script src="ui-v2/mock-views.js" defer></script>
    <script src="ui-v2/mock-workspace.js" defer></script>
    <script src="ui-v2/shell-preview.js" defer></script>
  </head>
  <body data-ready="false" data-page-errors="0">
    <header class="v2-preview-bar">
      <strong>M2 · Mock Shell</strong>
      <label
        >示例
        <select id="v2-example">
          <option value="m3d">M3D · 27 层 / 35 步</option>
          <option value="photodetector">Photodetector · 7 Variants</option>
        </select>
      </label>
      <label><input id="v2-empty" type="checkbox" />空 History</label>
      <button id="v2-failure" type="button" class="wc-button" data-size="sm">
        Recipe 失败场景
      </button>
      <span class="p-aux">只演示 UI；无科学执行 / 工程存储</span>
      <span id="v2-live-status" class="p-aux" role="status">文件模式 · 修改后刷新</span>
    </header>
    <main id="app-root" aria-label="WaferCAD v2 workstation">
      <p class="v2-boot-message" role="status">正在装配 v2 壳层…</p>
    </main>
    <noscript>此静态壳层需要启用 JavaScript。旧版入口仍为 app.html。</noscript>
  </body>
</html>

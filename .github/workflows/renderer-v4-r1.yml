name: Renderer V4 R1-R5 focused

on:
  push:
    branches:
      - perf/renderer-v4-adaptive-tiles-20261010
    paths:
      - site/renderer-v4-adaptive-tiles.js
      - site/renderer-v4-tile-plan.js
      - site/renderer-v4-feature-footprints.js
      - site/renderer-v4-resource-census.js
      - site/renderer-v4-resource-lifetime.js
      - site/renderer-v4-interaction-policy.js
      - site/renderer-v4-flat-geometry-sharing.js
      - site/tests/renderer-v4-adaptive-tiles.test.mjs
      - site/tests/renderer-v4-tile-plan.test.mjs
      - site/tests/renderer-v4-r3-evidence.test.mjs
      - site/tests/renderer-v4-resource-lifetime.test.mjs
      - site/tests/renderer-v4-interaction-policy.test.mjs
      - site/tests/renderer-v4-flat-geometry-sharing.test.mjs
      - site/three-view.js
      - scripts/renderer-v4-r2-browser.mjs
      - scripts/renderer-v4-r3-browser.mjs
      - scripts/renderer-v4-r4-dynamic-browser.mjs
      - scripts/renderer-v4-r5-lifetime-stress.mjs
      - scripts/renderer-v4-r5-dual-variant-browser.mjs
      - scripts/renderer-v4-r6-context-browser.mjs
      - scripts/renderer-v4-r7-abba-browser.mjs
      - scripts/test-helpers/renderer-r7-abba.mjs
      - scripts/tests/renderer-v4-r7-abba.test.mjs
      - docs/RENDERER_V4_ADAPTIVE_TILES_2026-10-10.md
      - docs/README.md
      - .github/workflows/renderer-v4-r1.yml

permissions:
  contents: read

concurrency:
  group: renderer-v4-r1-r3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused V3/V4 tile regressions
        run: node --test site/tests/renderer-v3-tile-bounds.test.mjs site/tests/renderer-v4-adaptive-tiles.test.mjs site/tests/renderer-v4-tile-plan.test.mjs site/tests/renderer-v4-interaction-policy.test.mjs site/tests/renderer-v4-r3-evidence.test.mjs site/tests/renderer-v4-flat-geometry-sharing.test.mjs site/tests/renderer-v4-resource-lifetime.test.mjs site/tests/webgl-frame-probe.test.mjs
      - name: R7 ABBA statistics contract
        run: node --test scripts/tests/renderer-v4-r7-abba.test.mjs
      - name: Targeted lint
        run: npx eslint site/renderer-v4-adaptive-tiles.js site/renderer-v4-tile-plan.js site/renderer-v4-interaction-policy.js site/renderer-v4-feature-footprints.js site/renderer-v4-resource-census.js site/renderer-v4-resource-lifetime.js site/renderer-v4-flat-geometry-sharing.js site/tests/renderer-v4-flat-geometry-sharing.test.mjs site/tests/renderer-v4-resource-lifetime.test.mjs site/tests/renderer-v4-adaptive-tiles.test.mjs site/tests/renderer-v4-interaction-policy.test.mjs site/tests/renderer-v4-r3-evidence.test.mjs site/tests/renderer-v4-tile-plan.test.mjs site/three-view.js scripts/renderer-v4-r2-browser.mjs scripts/renderer-v4-r3-browser.mjs scripts/renderer-v4-r4-dynamic-browser.mjs scripts/renderer-v4-r5-lifetime-stress.mjs scripts/renderer-v4-r5-dual-variant-browser.mjs scripts/renderer-v4-r6-context-browser.mjs scripts/renderer-v4-r7-abba-browser.mjs scripts/test-helpers/renderer-r7-abba.mjs scripts/tests/renderer-v4-r7-abba.test.mjs
      - name: Targeted formatting
        run: npx prettier --check site/renderer-v4-adaptive-tiles.js site/renderer-v4-tile-plan.js site/renderer-v4-interaction-policy.js site/renderer-v4-feature-footprints.js site/renderer-v4-resource-census.js site/renderer-v4-resource-lifetime.js site/renderer-v4-flat-geometry-sharing.js site/tests/renderer-v4-flat-geometry-sharing.test.mjs site/tests/renderer-v4-resource-lifetime.test.mjs site/tests/renderer-v4-adaptive-tiles.test.mjs site/tests/renderer-v4-tile-plan.test.mjs site/tests/renderer-v4-interaction-policy.test.mjs site/tests/renderer-v4-r3-evidence.test.mjs site/three-view.js scripts/renderer-v4-r2-browser.mjs scripts/renderer-v4-r3-browser.mjs scripts/renderer-v4-r4-dynamic-browser.mjs scripts/renderer-v4-r5-lifetime-stress.mjs scripts/renderer-v4-r5-dual-variant-browser.mjs scripts/renderer-v4-r6-context-browser.mjs scripts/renderer-v4-r7-abba-browser.mjs scripts/test-helpers/renderer-r7-abba.mjs scripts/tests/renderer-v4-r7-abba.test.mjs docs/RENDERER_V4_ADAPTIVE_TILES_2026-10-10.md docs/README.md
      - name: R6 Prettier diff if formatting fails
        if: failure()
        run: npx prettier scripts/renderer-v4-r6-context-browser.mjs | diff -u scripts/renderer-v4-r6-context-browser.mjs - || true
      - name: Report exact Markdown formatting diff on failure
        if: failure()
        run: npx prettier docs/RENDERER_V4_ADAPTIVE_TILES_2026-10-10.md | diff -u docs/RENDERER_V4_ADAPTIVE_TILES_2026-10-10.md - || true
      - name: Documentation links and generated guide
        run: npm run docs:check
      - name: Full non-browser Node gate
        run: npm run check:ci

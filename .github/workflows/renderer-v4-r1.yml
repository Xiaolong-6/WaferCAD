name: Renderer V4 R1-R2 focused

on:
  push:
    branches:
      - perf/renderer-v4-adaptive-tiles-20261010
    paths:
      - site/renderer-v4-adaptive-tiles.js
      - site/renderer-v4-tile-plan.js
      - site/renderer-v4-interaction-policy.js
      - site/tests/renderer-v4-adaptive-tiles.test.mjs
      - site/tests/renderer-v4-tile-plan.test.mjs
      - site/tests/renderer-v4-interaction-policy.test.mjs
      - site/three-view.js
      - scripts/renderer-v4-r2-browser.mjs
      - docs/RENDERER_V4_ADAPTIVE_TILES_2026-10-10.md
      - docs/README.md
      - .github/workflows/renderer-v4-r1.yml

permissions:
  contents: read

concurrency:
  group: renderer-v4-r1-r2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused V3/V4 tile regressions
        run: node --test site/tests/renderer-v3-tile-bounds.test.mjs site/tests/renderer-v4-adaptive-tiles.test.mjs site/tests/renderer-v4-tile-plan.test.mjs site/tests/renderer-v4-interaction-policy.test.mjs
      - name: Targeted lint
        run: npx eslint site/renderer-v4-adaptive-tiles.js site/renderer-v4-tile-plan.js site/renderer-v4-interaction-policy.js site/tests/renderer-v4-adaptive-tiles.test.mjs site/tests/renderer-v4-interaction-policy.test.mjs site/tests/renderer-v4-tile-plan.test.mjs site/three-view.js scripts/renderer-v4-r2-browser.mjs
      - name: Targeted formatting (emit R2 handoff correction)
        run: |
          npx prettier --write docs/RENDERER_V4_ADAPTIVE_TILES_2026-10-10.md
          git diff -- docs/RENDERER_V4_ADAPTIVE_TILES_2026-10-10.md
          git diff --exit-code -- docs/RENDERER_V4_ADAPTIVE_TILES_2026-10-10.md
      - name: Documentation links and generated guide
        run: npm run docs:check
      - name: Full non-browser Node gate
        run: npm run check:ci

name: Renderer V4 R1 focused

on:
  push:
    branches:
      - perf/renderer-v4-adaptive-tiles-20261010
    paths:
      - site/renderer-v4-adaptive-tiles.js
      - site/tests/renderer-v4-adaptive-tiles.test.mjs
      - site/three-view.js
      - docs/RENDERER_V4_ADAPTIVE_TILES_2026-10-10.md
      - docs/README.md
      - .github/workflows/renderer-v4-r1.yml

permissions:
  contents: read

concurrency:
  group: renderer-v4-r1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused V3/V4 tile regressions
        run: node --test site/tests/renderer-v3-tile-bounds.test.mjs site/tests/renderer-v4-adaptive-tiles.test.mjs
      - name: Targeted lint
        run: npx eslint site/renderer-v4-adaptive-tiles.js site/tests/renderer-v4-adaptive-tiles.test.mjs site/three-view.js
      - name: Targeted formatting
        run: npx prettier --check site/renderer-v4-adaptive-tiles.js site/tests/renderer-v4-adaptive-tiles.test.mjs site/three-view.js docs/RENDERER_V4_ADAPTIVE_TILES_2026-10-10.md docs/README.md
      - name: Documentation links and generated guide
        run: npm run docs:check

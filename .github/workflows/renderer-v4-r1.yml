name: Renderer V4 R1-R7 focused

on:
  push:
    branches:
      - perf/renderer-v4-adaptive-tiles-20261010
    paths:
      - site/renderer-v4-adaptive-tiles.js
      - site/renderer-v4-tile-plan.js
      - site/renderer-v4-feature-footprints.js
      - site/renderer-v4-resource-census.js
      - site/tests/issue-11-3d-controls.test.mjs
      - site/tests/renderer-workstation-route.test.mjs
      - site/renderer-v4-resource-lifetime.js
      - site/renderer-capture-transaction.js
      - site/tests/renderer-capture-transaction.test.mjs
      - site/renderer-v4-interaction-policy.js
      - site/renderer-v4-flat-geometry-sharing.js
      - site/tests/renderer-v4-adaptive-tiles.test.mjs
      - site/tests/renderer-v4-tile-plan.test.mjs
      - site/tests/renderer-v4-r3-evidence.test.mjs
      - site/tests/renderer-v4-resource-lifetime.test.mjs
      - site/tests/renderer-v4-interaction-policy.test.mjs
      - site/tests/renderer-v4-flat-geometry-sharing.test.mjs
      - site/three-view.js
      # Main UI v2 writer/lease and render-route changes affect this stacked renderer.
      - site/controllers/workspace-persistence-controller.js
      - site/controllers/workspace-session-controller.js
      - site/tests/controllers.test.mjs
      - site/tests/ci-test-plan.test.mjs
      - scripts/ci-test-plan.mjs
      - scripts/v2/three-visibility.mjs
      - .github/workflows/ui-v2-stage-c-m4.yml
      - docs/testing.md
      - scripts/renderer-electrical-fresh-context-ab.mjs
      - scripts/renderer-roi-profile.mjs
      - scripts/test-helpers/webgl-frame-probe.mjs
      - scripts/renderer-v4-r2-browser.mjs
      - scripts/renderer-v4-r3-browser.mjs
      - scripts/renderer-v4-r4-dynamic-browser.mjs
      - scripts/renderer-v4-r5-lifetime-stress.mjs
      - scripts/renderer-v4-r5-dual-variant-browser.mjs
      - scripts/renderer-v4-r6-context-browser.mjs
      - scripts/renderer-v4-r7-abba-browser.mjs
      - scripts/test-helpers/renderer-r7-abba.mjs
      - scripts/tests/renderer-v4-r7-abba.test.mjs
      - scripts/renderer-unified-hardware.mjs
      - scripts/renderer-hardware-http-smoke.mjs
      - scripts/test-helpers/renderer-hardware-evidence.mjs
      - scripts/test-helpers/renderer-workstation-route.mjs
      - scripts/test-helpers/renderer-hardware-site.mjs
      - scripts/test-helpers/renderer-hardware-zip.mjs
      - scripts/tests/renderer-hardware-site-zip.test.mjs
      - scripts/test-helpers/renderer-unified-hardware-plan.mjs
      - scripts/tests/renderer-unified-hardware.test.mjs
      - scripts/test-helpers/renderer-v3-phase-parity.mjs
      - scripts/tests/renderer-v3-phase-parity.test.mjs
      - scripts/test-helpers/renderer-v3-phase-window.mjs
      - scripts/test-helpers/renderer-v3-raster-state.mjs
      - site/tests/renderer-v3-phase-window.test.mjs
      - docs/RENDERER_R8_PHASE_WINDOW_2026-10-12.md
      - docs/RENDERER_V3_V4_UNIFIED_HARDWARE.md
      - docs/RENDERER_V4_ADAPTIVE_TILES_2026-10-10.md
      - docs/README.md
      - .github/workflows/renderer-v4-r1.yml

permissions:
  contents: read

concurrency:
  group: renderer-v4-r1-r3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused V3/V4 tile regressions
        run: node --test site/tests/renderer-v3-tile-bounds.test.mjs site/tests/renderer-v4-adaptive-tiles.test.mjs site/tests/renderer-v4-tile-plan.test.mjs site/tests/renderer-v4-interaction-policy.test.mjs site/tests/renderer-v4-r3-evidence.test.mjs site/tests/renderer-v4-flat-geometry-sharing.test.mjs site/tests/renderer-v4-resource-lifetime.test.mjs site/tests/renderer-capture-transaction.test.mjs site/tests/renderer-workstation-route.test.mjs site/tests/issue-11-3d-controls.test.mjs site/tests/webgl-frame-probe.test.mjs
      - name: V3 bounded phase-evidence regressions
        run: node --test scripts/tests/renderer-v3-phase-parity.test.mjs site/tests/renderer-v3-phase-window.test.mjs
      - name: R7 ABBA statistics contract
        run: node --test scripts/tests/renderer-v4-r7-abba.test.mjs
      - name: Unified V3 V4 hardware planning tests (no GPU required)
        run: |
          node --test scripts/tests/renderer-unified-hardware.test.mjs scripts/tests/renderer-hardware-site-zip.test.mjs
          node scripts/renderer-unified-hardware.mjs --plan-only
          node scripts/renderer-unified-hardware.mjs --plan-only --campaign=r9-preserved-msaa
          npx eslint scripts/renderer-hardware-http-smoke.mjs scripts/renderer-unified-hardware.mjs scripts/test-helpers/renderer-hardware-evidence.mjs scripts/test-helpers/renderer-hardware-site.mjs scripts/test-helpers/renderer-hardware-zip.mjs scripts/test-helpers/renderer-unified-hardware-plan.mjs scripts/test-helpers/renderer-v3-phase-window.mjs scripts/test-helpers/renderer-v3-raster-state.mjs scripts/tests/renderer-unified-hardware.test.mjs scripts/tests/renderer-hardware-site-zip.test.mjs
          npx prettier --check scripts/renderer-hardware-http-smoke.mjs scripts/renderer-unified-hardware.mjs scripts/test-helpers/renderer-hardware-evidence.mjs scripts/test-helpers/renderer-hardware-site.mjs scripts/test-helpers/renderer-hardware-zip.mjs scripts/test-helpers/renderer-unified-hardware-plan.mjs scripts/test-helpers/renderer-v3-raster-state.mjs scripts/test-helpers/renderer-v3-phase-window.mjs scripts/tests/renderer-unified-hardware.test.mjs scripts/tests/renderer-hardware-site-zip.test.mjs docs/RENDERER_V3_V4_UNIFIED_HARDWARE.md
      - name: Targeted lint
        run: npx eslint site/renderer-capture-transaction.js site/tests/renderer-capture-transaction.test.mjs site/renderer-v4-adaptive-tiles.js site/renderer-v4-tile-plan.js site/renderer-v4-interaction-policy.js site/renderer-v4-feature-footprints.js site/renderer-v4-resource-census.js site/renderer-v4-resource-lifetime.js site/renderer-v4-flat-geometry-sharing.js site/tests/renderer-v4-flat-geometry-sharing.test.mjs site/tests/renderer-v4-resource-lifetime.test.mjs site/tests/renderer-v4-adaptive-tiles.test.mjs site/tests/renderer-v4-interaction-policy.test.mjs site/tests/renderer-v4-r3-evidence.test.mjs site/tests/renderer-v4-tile-plan.test.mjs site/three-view.js scripts/renderer-v4-r2-browser.mjs scripts/renderer-v4-r3-browser.mjs scripts/renderer-v4-r4-dynamic-browser.mjs scripts/renderer-v4-r5-lifetime-stress.mjs scripts/renderer-v4-r5-dual-variant-browser.mjs scripts/renderer-electrical-fresh-context-ab.mjs scripts/renderer-roi-profile.mjs scripts/test-helpers/webgl-frame-probe.mjs scripts/renderer-v4-r6-context-browser.mjs scripts/renderer-v4-r7-abba-browser.mjs scripts/test-helpers/renderer-r7-abba.mjs scripts/tests/renderer-v4-r7-abba.test.mjs
      - name: Targeted formatting
        run: npx prettier --check site/renderer-capture-transaction.js site/tests/renderer-capture-transaction.test.mjs site/renderer-v4-adaptive-tiles.js site/renderer-v4-tile-plan.js site/renderer-v4-interaction-policy.js site/renderer-v4-feature-footprints.js site/renderer-v4-resource-census.js site/renderer-v4-resource-lifetime.js site/renderer-v4-flat-geometry-sharing.js site/tests/renderer-v4-flat-geometry-sharing.test.mjs site/tests/renderer-v4-resource-lifetime.test.mjs site/tests/renderer-v4-adaptive-tiles.test.mjs site/tests/renderer-v4-tile-plan.test.mjs site/tests/renderer-v4-interaction-policy.test.mjs site/tests/renderer-v4-r3-evidence.test.mjs site/three-view.js scripts/renderer-v4-r2-browser.mjs scripts/renderer-v4-r3-browser.mjs scripts/renderer-v4-r4-dynamic-browser.mjs scripts/renderer-v4-r5-lifetime-stress.mjs scripts/renderer-v4-r5-dual-variant-browser.mjs scripts/renderer-v4-r6-context-browser.mjs scripts/renderer-v4-r7-abba-browser.mjs scripts/test-helpers/renderer-r7-abba.mjs scripts/tests/renderer-v4-r7-abba.test.mjs docs/RENDERER_V4_ADAPTIVE_TILES_2026-10-10.md docs/README.md
      - name: Unified runner Prettier diff on failure
        if: failure()
        run: |
          for file in scripts/renderer-hardware-http-smoke.mjs scripts/renderer-unified-hardware.mjs scripts/test-helpers/renderer-hardware-evidence.mjs scripts/test-helpers/renderer-hardware-site.mjs scripts/test-helpers/renderer-hardware-zip.mjs scripts/test-helpers/renderer-unified-hardware-plan.mjs scripts/test-helpers/renderer-v3-raster-state.mjs scripts/test-helpers/renderer-v3-phase-window.mjs scripts/test-helpers/webgl-frame-probe.mjs scripts/renderer-electrical-fresh-context-ab.mjs scripts/tests/renderer-unified-hardware.test.mjs site/tests/renderer-v3-phase-window.test.mjs site/tests/webgl-frame-probe.test.mjs scripts/tests/renderer-hardware-site-zip.test.mjs docs/RENDERER_V3_V4_UNIFIED_HARDWARE.md docs/RENDERER_R8_PHASE_WINDOW_2026-10-12.md; do
            npx prettier "$file" | diff -u "$file" - || true
          done
      - name: R6 Prettier diff if formatting fails
        if: failure()
        run: npx prettier scripts/renderer-v4-r6-context-browser.mjs | diff -u scripts/renderer-v4-r6-context-browser.mjs - || true
      - name: Report exact Markdown formatting diff on failure
        if: failure()
        run: npx prettier docs/RENDERER_V4_ADAPTIVE_TILES_2026-10-10.md | diff -u docs/RENDERER_V4_ADAPTIVE_TILES_2026-10-10.md - || true
      - name: Documentation links and generated guide
        run: npm run docs:check
      - name: Full non-browser Node gate
        run: npm run check:ci

  windows-http-preflight:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Chromium
        run: npx playwright install chromium
      - name: Verify Windows app.html HTTP route in Chromium (software-only)
        run: node scripts/renderer-hardware-http-smoke.mjs
      - name: Check portable archive and HTTP error reporting
        run: node --test scripts/tests/renderer-hardware-site-zip.test.mjs

name: Renderer V4 R5 lifetime stress

on:
  push:
    branches:
      - perf/renderer-v4-adaptive-tiles-20261010
    paths:
      - site/three-view.js
      - site/renderer-v4-resource-lifetime.js
      - scripts/renderer-v4-r5-lifetime-stress.mjs
      - .github/workflows/renderer-v4-r5-lifetime.yml

permissions:
  contents: read

concurrency:
  group: renderer-v4-r5-lifetime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Start WaferCAD static server
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-r5-lifetime-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/app.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wafercad-r5-lifetime-http.log
          exit 1
      - name: Toggle variants and reload project with bounded GPU resource census
        run: node scripts/renderer-v4-r5-lifetime-stress.mjs
      - name: Preserve R5 lifetime evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: renderer-v4-r5-lifetime
          path: test-results/renderer-v4-r5-lifetime/
          if-no-files-found: warn
          retention-days: 14

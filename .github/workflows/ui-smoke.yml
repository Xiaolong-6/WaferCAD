name: UI smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/ui-smoke.mjs"
      - ".github/workflows/ui-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/ui-smoke.mjs"
      - ".github/workflows/ui-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install browser test dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start WaferCAD
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wafercad-http.log
          exit 1

      - name: Run browser interaction smoke
        run: node scripts/ui-smoke.mjs

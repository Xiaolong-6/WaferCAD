name: Physical facet scientific contracts

on:
  pull_request:
    paths:
      - 'site/physical-facet-*.js'
      - 'site/model.js'
      - 'site/project-schema.js'
      - 'site/project-io.js'
      - 'site/controllers/workspace-persistence-controller.js'
      - 'site/tests/physical-facet-*.test.mjs'
      - '.github/workflows/physical-facet-science.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-facet-science:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: One-shot exact physical shell formatter
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx prettier --write site/physical-facet-shell-owner.js site/model-view-geometry.js site/tests/physical-facet-persistence.test.mjs site/tests/physical-facet-shell-owner.test.mjs docs/science/PHYSICAL_FACET_MODELING_2026-10-16.md
      - name: Capture exact formatted sources
        uses: actions/upload-artifact@v6
        with:
          name: physical-shell-prettier-source
          path: |
            site/physical-facet-shell-owner.js
            site/model-view-geometry.js
            site/tests/physical-facet-persistence.test.mjs
            site/tests/physical-facet-shell-owner.test.mjs
            docs/science/PHYSICAL_FACET_MODELING_2026-10-16.md
          retention-days: 1
      - name: Verify physical owner, closed mesh and exact Section contracts
        run: >-
          node --test
          site/tests/physical-facet-math.test.mjs
          site/tests/physical-facet-owner.test.mjs
          site/tests/physical-facet-surface.test.mjs
          site/tests/physical-facet-coating.test.mjs
          site/tests/physical-facet-coating-section.test.mjs
          site/tests/physical-facet-shell-owner.test.mjs
          site/tests/physical-facet-persistence.test.mjs
          site/tests/physical-facet-recovery.test.mjs

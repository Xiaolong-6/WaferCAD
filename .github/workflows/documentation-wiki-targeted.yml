name: Documentation and Wiki targeted checks

# Quality owns the local documentation checks for every PR.
# Keep a manual evidence diagnostic without another automatic npm/test job.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout documentation sources
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify documentation via full local Quality evidence
        run: node scripts/local-verification.mjs verify full

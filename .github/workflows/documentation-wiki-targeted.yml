name: Documentation and Wiki targeted checks

# Lightweight PR verification of maintained documentation and manual examples.
# Publishing remains exclusively owned by product-manual-wiki.yml on Main.
on:
  pull_request:
    paths:
      # Repository entrypoints and provenance also affect documentation accuracy.
      - 'README.md'
      - 'AGENTS.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'examples/projects/README.md'
      - 'docs/**'
      - 'site/bundled-examples.js'
      - 'site/process-guide.js'
      - 'site/process-guide-svg.js'
      - 'scripts/build-process-guide.mjs'
      - 'scripts/build-wiki-diagrams.mjs'
      - 'scripts/check-documentation.mjs'
      - 'scripts/check-wiki-change-coverage.mjs'
      - '.github/workflows/documentation-wiki-targeted.yml'
      - '.github/workflows/product-manual-wiki.yml'

permissions:
  contents: read

concurrency:
  group: docs-wiki-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  manual-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout documentation sources
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Wiki, Process guide and documentation contracts
        run: node --test site/tests/process-guide.test.mjs site/tests/wiki-manual.test.mjs site/tests/documentation.test.mjs

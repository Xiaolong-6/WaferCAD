name: Docking single-shot Prettier

on:
  push:
    branches:
      - feat/desktop-view-docking-20261015
    paths:
      - '.github/workflows/docking-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dev dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format only the two failing sources
        run: npx --no-install prettier --write site/ui-v2/view-docking-controller.js scripts/v2/check-desktop-docking.mjs
      - name: Commit format and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/docking-format-once.yml
          git add site/ui-v2/view-docking-controller.js scripts/v2/check-desktop-docking.mjs
          git diff --cached --check
          git commit -m 'style(docking): apply scoped Prettier and remove temporary formatter'
          git push origin HEAD:feat/desktop-view-docking-20261015

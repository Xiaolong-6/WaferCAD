name: T-CMOS candidate reconstruction

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-tcmos-inverter-example.mjs'
      - 'scripts/tcmos-browser-acceptance.mjs'
      - 'site/tests/tcmos-inverter-reconstruction.test.mjs'
      - 'site/tests/implant-buried-interval.test.mjs'
      - 'site/tests/dopant-regions.test.mjs'
      - 'site/dopant-regions.js'
      - 'site/model.js'
      - 'site/process-recipe.js'
      - 'site/project-schema.js'
      - 'site/project-io.js'
      - 'site/controllers/process-panel-controller.js'
      - 'site/controllers/process-recipe-controller.js'
      - 'examples/projects/tcmos-ternary-inverter-2019-candidate/**'
      - '.github/workflows/tcmos-reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-time-mask-fixture:
    name: One-time Fig1b CNT fixture sync
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 225
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate Fig1b geometry and format touched files
        run: |
          node scripts/build-tcmos-inverter-example.mjs
          cp test-results/tcmos/tcmos-ternary-inverter-130nm.wafercad examples/projects/tcmos-ternary-inverter-2019-candidate/tcmos-ternary-inverter-130nm.wafercad
          npx prettier --write scripts/build-tcmos-inverter-example.mjs site/tests/tcmos-inverter-reconstruction.test.mjs
      - name: Commit only to PR 225 branch
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-tcmos-inverter-example.mjs site/tests/tcmos-inverter-reconstruction.test.mjs examples/projects/tcmos-ternary-inverter-2019-candidate/tcmos-ternary-inverter-130nm.wafercad
          if git diff --cached --quiet; then
            echo "Already synced"
          else
            git commit -m "chore(tcmos-mask): sync expanded body CNT geometry"
            git push origin "HEAD:${PR_BRANCH}"
          fi

  paper-geometry:
    name: T-CMOS kernel, Recipe and storage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check focused regressions and generate project
        run: |
          node --test site/tests/tcmos-inverter-reconstruction.test.mjs site/tests/implant-buried-interval.test.mjs site/tests/dopant-regions.test.mjs
          node scripts/build-tcmos-inverter-example.mjs
          node scripts/build-tcmos-inverter-example.mjs --tilt-demo
          cmp examples/projects/tcmos-ternary-inverter-2019-candidate/tcmos-ternary-inverter-130nm.wafercad test-results/tcmos/tcmos-ternary-inverter-130nm.wafercad
      - name: Check source formatting
        if: always()
        run: npx prettier --check site/three-view.js site/tests/issue-11-3d-controls.test.mjs scripts/tcmos-browser-acceptance.mjs scripts/build-tcmos-inverter-example.mjs site/tests/tcmos-inverter-reconstruction.test.mjs site/tests/implant-buried-interval.test.mjs site/tests/dopant-regions.test.mjs site/dopant-regions.js site/model.js site/process-recipe.js site/project-schema.js site/project-io.js site/controllers/process-panel-controller.js site/controllers/process-recipe-controller.js examples/projects/tcmos-ternary-inverter-2019-candidate/README.md
      - name: Share candidate project and verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tcmos-ternary-inverter-130nm-candidate
          path: test-results/tcmos/
          retention-days: 14
          if-no-files-found: ignore

  browser-replay:
    name: T-CMOS v2 browser Run All
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Generate candidate and replay in v2 Workstation
        env:
          WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
          WAFERCAD_V2_BASE: http://127.0.0.1:4173
        run: |
          node scripts/build-tcmos-inverter-example.mjs
          node scripts/build-tcmos-inverter-example.mjs --tilt-demo
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > /tmp/tcmos-browser.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          node scripts/tcmos-browser-acceptance.mjs
      - name: Upload v2 acceptance screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tcmos-v2-browser-acceptance
          path: test-results/tcmos/
          retention-days: 14
          if-no-files-found: ignore

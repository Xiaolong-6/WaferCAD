name: T-CMOS candidate reconstruction

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-tcmos-inverter-example.mjs'
      - 'site/tests/tcmos-inverter-reconstruction.test.mjs'
      - 'examples/projects/tcmos-ternary-inverter-2019-candidate/**'
      - '.github/workflows/tcmos-reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-geometry:
    name: T-CMOS kernel, Recipe and storage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check source formatting and focused regressions
        run: |
          npx prettier --check scripts/build-tcmos-inverter-example.mjs site/tests/tcmos-inverter-reconstruction.test.mjs examples/projects/tcmos-ternary-inverter-2019-candidate/README.md
          node --test site/tests/tcmos-inverter-reconstruction.test.mjs
      - name: Generate candidate project and validation report
        run: node scripts/build-tcmos-inverter-example.mjs
      - name: Share candidate project and verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tcmos-ternary-inverter-130nm-candidate
          path: test-results/tcmos/
          retention-days: 14
          if-no-files-found: ignore

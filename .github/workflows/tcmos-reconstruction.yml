name: T-CMOS candidate reconstruction

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-tcmos-inverter-example.mjs'
      - 'site/tests/tcmos-inverter-reconstruction.test.mjs'
      - 'examples/projects/tcmos-ternary-inverter-2019-candidate/**'
      - '.github/workflows/tcmos-reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-geometry:
    name: T-CMOS kernel, Recipe and storage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check focused regressions and generate project
        run: |
          node --test site/tests/tcmos-inverter-reconstruction.test.mjs
          node scripts/build-tcmos-inverter-example.mjs
      - name: Check source formatting
        if: always()
        run: npx prettier --check scripts/build-tcmos-inverter-example.mjs site/tests/tcmos-inverter-reconstruction.test.mjs examples/projects/tcmos-ternary-inverter-2019-candidate/README.md
      - name: Display exact formatted files for branch repair
        if: always()
        run: |
          for file in scripts/build-tcmos-inverter-example.mjs site/tests/tcmos-inverter-reconstruction.test.mjs site/model.js site/model-view-geometry.js site/controllers/process-panel-controller.js site/controllers/process-recipe-controller.js site/project-schema.js site/process-recipe.js examples/projects/tcmos-ternary-inverter-2019-candidate/README.md; do
            echo "TCMOS_FMT_START:$file"
            npx prettier "$file"
            echo "TCMOS_FMT_END:$file"
          done
      - name: Share candidate project and verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tcmos-ternary-inverter-130nm-candidate
          path: test-results/tcmos/
          retention-days: 14
          if-no-files-found: ignore

name: Temporary Mobile Scroll Diagnostic
on:
  push:
    branches: [feat/ui-v2-mobile-document-scroll-20261014]
permissions:
  contents: read
jobs:
  mobile-scroll:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.1
      - run: npx playwright install --with-deps chromium
      - name: Run isolated Mobile scroll test
        run: |
          node scripts/v2/serve-v2.mjs > /tmp/mobile-serve.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4182/app.html; then
              break
            fi
            sleep 1
          done
          node scripts/v2/check-mobile-workstation.mjs

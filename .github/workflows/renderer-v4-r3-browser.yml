name: Renderer V4 R3 feature and GPU census parity

on:
  push:
    branches:
      - perf/renderer-v4-adaptive-tiles-20261010
    paths:
      - site/three-view.js
      - site/renderer-v4-feature-footprints.js
      - site/renderer-v4-resource-census.js
      - scripts/renderer-v4-r3-browser.mjs
      - .github/workflows/renderer-v4-r3-browser.yml

permissions:
  contents: read

concurrency:
  group: renderer-v4-r3-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-r3.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/app.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wafercad-r3.log
          exit 1
      - name: Paired 625-site R3 parity
        run: node scripts/renderer-v4-r3-browser.mjs
      - name: Save parity artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: renderer-v4-r3-browser
          path: test-results/renderer-v4-r3/
          if-no-files-found: warn
          retention-days: 14

name: GaN HEMT microchannel reconstruction

on:
  push:
    branches:
      - feat/example-gan-hemt-microchannel-20261014
    paths:
      - scripts/build-gan-hemt-microchannel-example.mjs
      - scripts/gan-hemt-microchannel-visual-acceptance.mjs
      - scripts/example-recipe-runall-acceptance.mjs
      - site/tests/gan-hemt-microchannel-reconstruction.test.mjs
      - site/tests/gan-hemt-microchannel-replay.test.mjs
      - docs/GAN_HEMT_MICROCHANNEL_RECONSTRUCTION_2026-10-14.md
      - .github/workflows/gan-hemt-microchannel.yml
      - site/examples/gan-hemt-microchannel-2022.wafercad
      - site/examples/previews/gan-hemt-microchannel-2022.wafercad
      - site/examples/thumbnails/gan-hemt-microchannel-2022-three.webp
      - tests/fixtures/project-io/example-thumbnails.json
      - site/bundled-examples.js
      - site/tests/welcome-example.test.mjs
      - docs/wiki/Examples-and-Modeling-Limits.md
      - README.md
      - docs/wiki/Getting-Started.md
  pull_request:
    paths:
      - scripts/build-gan-hemt-microchannel-example.mjs
      - scripts/gan-hemt-microchannel-visual-acceptance.mjs
      - scripts/example-recipe-runall-acceptance.mjs
      - site/tests/gan-hemt-microchannel-reconstruction.test.mjs
      - site/tests/gan-hemt-microchannel-replay.test.mjs
      - docs/GAN_HEMT_MICROCHANNEL_RECONSTRUCTION_2026-10-14.md
      - .github/workflows/gan-hemt-microchannel.yml
      - site/examples/gan-hemt-microchannel-2022.wafercad
      - site/examples/previews/gan-hemt-microchannel-2022.wafercad
      - site/examples/thumbnails/gan-hemt-microchannel-2022-three.webp
      - tests/fixtures/project-io/example-thumbnails.json
      - site/bundled-examples.js
      - site/tests/welcome-example.test.mjs
      - docs/wiki/Examples-and-Modeling-Limits.md
      - README.md
      - docs/wiki/Getting-Started.md
  workflow_dispatch:

concurrency:
  group: gan-hemt-candidate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Focused lint
        run: npx eslint scripts/build-gan-hemt-microchannel-example.mjs site/tests/gan-hemt-microchannel-reconstruction.test.mjs site/tests/gan-hemt-microchannel-replay.test.mjs scripts/gan-hemt-microchannel-visual-acceptance.mjs
      - name: Focused formatting
        run: npx prettier --check scripts/build-gan-hemt-microchannel-example.mjs site/tests/gan-hemt-microchannel-reconstruction.test.mjs site/tests/gan-hemt-microchannel-replay.test.mjs scripts/gan-hemt-microchannel-visual-acceptance.mjs docs/GAN_HEMT_MICROCHANNEL_RECONSTRUCTION_2026-10-14.md
      - name: Kernel reconstruction and physics-invariant unit tests
        run: node --test site/tests/gan-hemt-microchannel-reconstruction.test.mjs site/tests/gan-hemt-microchannel-replay.test.mjs
      - name: Generate reopenable project and validation evidence
        run: node scripts/build-gan-hemt-microchannel-example.mjs
      - name: Upload physical geometry and execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gan-hemt-microchannel-reconstruction
          path: test-results/gan-microchannel/
          if-no-files-found: warn

  publish-candidate:
    name: Commit generated draft project
    needs: reconstruction
    if: (github.event_name == 'push' && github.ref_name == 'feat/example-gan-hemt-microchannel-20261014') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/example-gan-hemt-microchannel-20261014
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build exact candidate project using live Process Kernel
        run: node scripts/build-gan-hemt-microchannel-example.mjs --write-repo
      - name: Format new Welcome catalog and source documentation
        run: npx prettier --write site/bundled-examples.js site/tests/welcome-example.test.mjs docs/wiki/Examples-and-Modeling-Limits.md README.md docs/wiki/Getting-Started.md
      - name: Generate fast final-state project preview
        run: node scripts/build-example-previews.mjs --id=gan-hemt-microchannel-2022 --write
      - name: Install headless Chromium for real render acceptance
        run: npx playwright install --with-deps chromium
      - name: Launch static WaferCAD UI server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > /tmp/wafercad-gan.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/wafercad-gan.log
          exit 1
      - name: Capture actual 3D example preview
        env:
          WAFERCAD_THREE_DIR: ./node_modules/three
        run: node scripts/build-example-thumbnails.mjs --id=gan-hemt-microchannel-2022
      - name: Capture all four real browser views for screenshot audit
        env:
          WAFERCAD_THREE_DIR: ./node_modules/three
        run: node scripts/gan-hemt-microchannel-visual-acceptance.mjs
      - name: Verify Welcome and Wiki catalog, history and previews
        run: node --test site/tests/welcome-example.test.mjs site/tests/wiki-manual.test.mjs site/tests/example-recipe-audit.test.mjs
      - name: Run complete UI Recipe from fresh Base and validate output
        env:
          WAFERCAD_THREE_DIR: ./node_modules/three
        run: node scripts/example-recipe-runall-acceptance.mjs --id=gan-hemt-microchannel-2022
      - name: Upload browser and Native Kernel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gan-hemt-visual-browser-evidence
          path: |
            test-results/gan-microchannel/
            test-results/example-recipe-runall/
          if-no-files-found: warn
      - name: Commit validated project, preview, sources and docs to feature branch
        run: |
          git add site/examples/gan-hemt-microchannel-2022.wafercad site/examples/previews/gan-hemt-microchannel-2022.wafercad site/examples/thumbnails/gan-hemt-microchannel-2022-three.webp tests/fixtures/project-io/example-thumbnails.json site/bundled-examples.js site/tests/welcome-example.test.mjs docs/wiki/Examples-and-Modeling-Limits.md README.md docs/wiki/Getting-Started.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "feat(example): check in validated GaN microchannel project asset"
            git push origin HEAD:feat/example-gan-hemt-microchannel-20261014
          fi

name: GaN HEMT microchannel reconstruction

on:
  push:
    branches:
      - feat/example-gan-hemt-microchannel-20261014
    paths:
      - scripts/build-gan-hemt-microchannel-example.mjs
      - site/tests/gan-hemt-microchannel-reconstruction.test.mjs
      - docs/GAN_HEMT_MICROCHANNEL_RECONSTRUCTION_2026-10-14.md
      - .github/workflows/gan-hemt-microchannel.yml
  pull_request:
    paths:
      - scripts/build-gan-hemt-microchannel-example.mjs
      - site/tests/gan-hemt-microchannel-reconstruction.test.mjs
      - docs/GAN_HEMT_MICROCHANNEL_RECONSTRUCTION_2026-10-14.md
      - .github/workflows/gan-hemt-microchannel.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-branch-sources:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/example-gan-hemt-microchannel-20261014
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format new reconstruction sources
        run: npx prettier --write scripts/build-gan-hemt-microchannel-example.mjs site/tests/gan-hemt-microchannel-reconstruction.test.mjs docs/GAN_HEMT_MICROCHANNEL_RECONSTRUCTION_2026-10-14.md
      - name: Commit formatter output to development branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/build-gan-hemt-microchannel-example.mjs site/tests/gan-hemt-microchannel-reconstruction.test.mjs docs/GAN_HEMT_MICROCHANNEL_RECONSTRUCTION_2026-10-14.md
            git commit -m "style(example): format GaN microchannel reconstruction sources"
            git push origin HEAD:feat/example-gan-hemt-microchannel-20261014
          fi

  reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Focused lint
        run: npx eslint scripts/build-gan-hemt-microchannel-example.mjs site/tests/gan-hemt-microchannel-reconstruction.test.mjs
      - name: Focused formatting
        run: npx prettier --check scripts/build-gan-hemt-microchannel-example.mjs site/tests/gan-hemt-microchannel-reconstruction.test.mjs docs/GAN_HEMT_MICROCHANNEL_RECONSTRUCTION_2026-10-14.md
      - name: Kernel reconstruction and physics-invariant unit tests
        run: node --test site/tests/gan-hemt-microchannel-reconstruction.test.mjs
      - name: Generate reopenable project and validation evidence
        run: node scripts/build-gan-hemt-microchannel-example.mjs
      - name: Upload physical geometry and execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gan-hemt-microchannel-reconstruction
          path: test-results/gan-microchannel/
          if-no-files-found: warn

name: GaN HEMT microchannel reconstruction

on:
  pull_request:
    paths:
      - scripts/build-gan-hemt-microchannel-example.mjs
      - scripts/gan-hemt-microchannel-visual-acceptance.mjs
      - site/tests/gan-hemt-tsv-liner-probe.test.mjs
      - scripts/example-recipe-runall-acceptance.mjs
      - site/tests/gan-hemt-microchannel-reconstruction.test.mjs
      - site/tests/assembly-wire-geometry.test.mjs
      - site/assembly-wire-geometry.js
      - site/assembly-wire-mesh.js
      - site/three-view.js
      - site/ui-v2/three-view.js
      - site/controllers/project-state-controller.js
      - site/project-schema.js
      - site/tests/gan-hemt-microchannel-replay.test.mjs
      - docs/GAN_HEMT_MICROCHANNEL_RECONSTRUCTION_2026-10-14.md
      - .github/workflows/gan-hemt-microchannel.yml
      - site/examples/gan-hemt-microchannel-2022.wafercad
      - site/examples/previews/gan-hemt-microchannel-2022.wafercad
      - site/examples/thumbnails/gan-hemt-microchannel-2022-three.webp
      - tests/fixtures/project-io/example-thumbnails.json
      - site/bundled-examples.js
      - site/tests/welcome-example.test.mjs
      - docs/wiki/Examples-and-Modeling-Limits.md
      - README.md
      - docs/wiki/Getting-Started.md
  workflow_dispatch:

concurrency:
  group: gan-hemt-candidate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Focused lint
        run: npx eslint scripts/build-gan-hemt-microchannel-example.mjs site/tests/gan-hemt-microchannel-reconstruction.test.mjs site/tests/assembly-wire-geometry.test.mjs site/tests/gan-hemt-microchannel-replay.test.mjs scripts/gan-hemt-microchannel-visual-acceptance.mjs site/assembly-wire-geometry.js site/assembly-wire-mesh.js site/three-view.js site/ui-v2/three-view.js site/controllers/project-state-controller.js site/project-schema.js site/tests/gan-hemt-tsv-liner-probe.test.mjs scripts/example-recipe-runall-acceptance.mjs
      - name: Focused formatting
        run: npx prettier --check scripts/build-gan-hemt-microchannel-example.mjs site/tests/gan-hemt-microchannel-reconstruction.test.mjs site/tests/assembly-wire-geometry.test.mjs site/tests/gan-hemt-microchannel-replay.test.mjs scripts/gan-hemt-microchannel-visual-acceptance.mjs docs/GAN_HEMT_MICROCHANNEL_RECONSTRUCTION_2026-10-14.md site/assembly-wire-geometry.js site/assembly-wire-mesh.js site/three-view.js site/ui-v2/three-view.js site/controllers/project-state-controller.js site/project-schema.js site/tests/gan-hemt-tsv-liner-probe.test.mjs scripts/example-recipe-runall-acceptance.mjs
      - name: Kernel reconstruction and physics-invariant unit tests
        run: node --test site/tests/assembly-wire-geometry.test.mjs site/tests/gan-hemt-microchannel-reconstruction.test.mjs site/tests/gan-hemt-microchannel-replay.test.mjs
      - name: TSV conformal material wall-science probe
        run: node --test site/tests/gan-hemt-tsv-liner-probe.test.mjs
      - name: Generate reopenable project and validation evidence
        run: node scripts/build-gan-hemt-microchannel-example.mjs
      - name: Upload physical geometry and execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gan-hemt-microchannel-reconstruction
          path: test-results/gan-microchannel/
          if-no-files-found: warn

  browser-acceptance:
    name: Browser acceptance and immutable asset verification
    needs: reconstruction
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate candidate science model before browser rendering
        run: node scripts/build-gan-hemt-microchannel-example.mjs
      - name: Check candidate text formatting
        run: npx prettier --check site/bundled-examples.js site/tests/welcome-example.test.mjs docs/wiki/Examples-and-Modeling-Limits.md README.md docs/wiki/Getting-Started.md
      - name: Install headless Chromium for real render acceptance
        run: npx playwright install --with-deps chromium
      - name: Launch static WaferCAD UI server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > /tmp/wafercad-gan.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/wafercad-gan.log
          exit 1
      # Real 3D evidence must be captured before a stale committed thumbnail
      # checksum can abort the job. Do not relax or replace the checksum gate.
      # Preserve the package precontract screenshot and true WebGL mesh counters.
      # The public Workstation snapshot intentionally omits assemblyWires;
      # verify actual rendered wire/end-cap counts without altering scientific gates.
      - name: Capture all four real browser views for screenshot audit
        env:
          WAFERCAD_THREE_DIR: ./node_modules/three
        run: node scripts/gan-hemt-microchannel-visual-acceptance.mjs
      - name: Capture candidate 3D thumbnail (evidence only, not canonical)
        env:
          WAFERCAD_THREE_DIR: ./node_modules/three
        run: node scripts/build-example-thumbnails.mjs --id=gan-hemt-microchannel-2022
      - name: Verify saved Preview shape and Welcome/Wiki catalog after rendering
        run: |
          node scripts/build-example-previews.mjs --id=gan-hemt-microchannel-2022
          node --test site/tests/welcome-example.test.mjs site/tests/wiki-manual.test.mjs site/tests/example-recipe-audit.test.mjs
      - name: Run complete UI Recipe from fresh Base and validate output
        env:
          WAFERCAD_THREE_DIR: ./node_modules/three
        run: node scripts/example-recipe-runall-acceptance.mjs --id=gan-hemt-microchannel-2022
      - name: Upload browser and Native Kernel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gan-hemt-visual-browser-evidence
          path: |
            test-results/gan-microchannel/
            test-results/example-recipe-runall/
            site/examples/thumbnails/gan-hemt-microchannel-2022-three.webp
          if-no-files-found: warn
      - name: Verify generation cannot silently edit scientific source assets
        run: |
          git diff --exit-code -- \
            site/examples/gan-hemt-microchannel-2022.wafercad \
            site/examples/previews/gan-hemt-microchannel-2022.wafercad \
            site/bundled-examples.js \
            site/tests/welcome-example.test.mjs \
            docs/wiki/Examples-and-Modeling-Limits.md \
            README.md docs/wiki/Getting-Started.md
      # The preview source hash was refreshed only after real Chromium
      # reproduced the exact existing canonical WebP bytes and image digest.
      - name: Validate committed thumbnail integrity after browser comparison
        run: |
          # Headless raster output can vary between identical Browser/GPU contexts.
          # The canonical committed thumbnail and its checksum stay immutable;
          # the new screenshot is retained as a separate Actions artifact.
          git restore -- \
            site/examples/thumbnails/gan-hemt-microchannel-2022-three.webp \
            tests/fixtures/project-io/example-thumbnails.json
          node --test site/tests/welcome-example.test.mjs
          git diff --exit-code

name: Format integration once
# rerun after formatter glob fix

on:
  push:
    branches:
      - merge/review-regression-snapshots
    paths:
      - ".github/workflows/format-integration-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v6
        with:
          ref: merge/review-regression-snapshots

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install development tools
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Format active source and current docs
        run: npm run format

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site docs README.md THIRD_PARTY_NOTICES.md eslint.config.js package.json .prettierrc.json
          if git diff --cached --quiet; then
            echo "No formatting changes."
          else
            git commit -m "style: format integration changes"
            git push origin HEAD:merge/review-regression-snapshots
          fi

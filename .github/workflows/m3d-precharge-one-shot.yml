name: M3D precharge one-shot fixture generation

on:
  push:
    branches:
      - feat/m3d-precharge-geometry-20261017
    paths:
      - .github/workflows/m3d-precharge-one-shot.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'Xiaolong-6/WaferCAD' && github.ref == 'refs/heads/feat/m3d-precharge-geometry-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m3d-precharge-geometry-20261017
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild project with real Process Kernel
        run: node scripts/build-m3d-lime-example.mjs --write-repo
      - name: Check source-derived science before writing fixture
        run: node --test site/tests/m3d-lime-builder.test.mjs
      - name: Commit only regenerated project to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- scripts/build-m3d-lime-example.mjs site/tests/m3d-lime-builder.test.mjs scripts/klayout-m3d-lime-verify.py
          git add -- site/examples/m3d-lime-rram-cntfet.wafercad
          if git diff --cached --quiet; then
            echo "Expected the updated mask topology to change the fixture."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "testdata(m3d): regenerate 15-CNTFET precharge fixture"
          # Preserve any newer human/agent commits; never force the branch.
          git fetch origin refs/heads/feat/m3d-precharge-geometry-20261017
          git rebase origin/feat/m3d-precharge-geometry-20261017
          git push origin HEAD:refs/heads/feat/m3d-precharge-geometry-20261017

name: Feature guide final verification

on:
  push:
    branches: [feat/process-visual-guide-wiki]

permissions:
  contents: write

concurrency:
  group: process-guide-final-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format only changed guide graphics and tests
        run: npx prettier --write site/process-guide-svg.js site/tests/process-guide.test.mjs
      - name: Verify docs and regression suite
        run: npm run check:ci
      - name: Commit targeted formatting if necessary
        run: |
          git add site/process-guide-svg.js site/tests/process-guide.test.mjs
          if ! git diff --cached --quiet; then
            git config user.name "wafercad-docs-bot"
            git config user.email "wafercad-docs-bot@users.noreply.github.com"
            git commit -m "style: format final Process schematic updates"
            git push origin HEAD:feat/process-visual-guide-wiki
          fi

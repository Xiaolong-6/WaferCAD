name: GaN TSV focused science probe

on:
  push:
    branches:
      - feat/example-gan-hemt-microchannel-20261014
    paths:
      - .github/workflows/gan-tsv-conformal-science-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tsv-conformal:
    name: TSV liner geometry and coolant invariants
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test site/tests/gan-hemt-tsv-liner-probe.test.mjs

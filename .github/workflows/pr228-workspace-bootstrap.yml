name: PR228 one-shot local workspace bundle
on:
  pull_request:
    paths:
      - '.github/workflows/pr228-workspace-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package exact-head source and pinned dependencies for offline local validation
        run: |
          tar -czf "$RUNNER_TEMP/pr228-local-workspace.tgz" \
            --exclude=.git \
            --exclude=.cache \
            --exclude=test-results \
            --exclude=pr228-local-workspace.tgz \
            .
          ls -lh "$RUNNER_TEMP/pr228-local-workspace.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: pr228-local-workspace-once
          path: ${{ runner.temp }}/pr228-local-workspace.tgz
          retention-days: 2
          if-no-files-found: error

name: Wafer bonding preview Chromium

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - feat/example-gan-hemt-microchannel-20261014
    paths:
      - scripts/v2/check-assembly-preview.mjs
      - scripts/v2/check-assembly-bond-draft.mjs
      - site/ui-v2/assembly-bond-draft.js
      - site/wafer-assembly-editor-session.js
      - site/wafer-assembly-draft-recovery.js
      - site/ui-v2/assembly-preview.js
      - site/ui-v2/workstation-entry.js
      - site/ui-v2/workstation-runtime.js
      - site/controllers/project-controller.js
      - site/controllers/workspace-persistence-controller.js
      - site/assembly-startup-routing.js
      - scripts/v2/check-recovery-failure-atomicity.mjs
      - scripts/v2/check-recovery-corrupt-checkpoint.mjs
      - site/ui-v2/workstation-preview.css
      - .github/workflows/wafer-bonding-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wafer-bond-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-preview:
    # Chromium is expensive: run only on an explicit visual-acceptance label.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'wafer-bond-visual')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install targeted Chromium
        run: npx playwright install --with-deps chromium
      - name: Native Assembly three-stage four-view acceptance
        env:
          WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
          WAFERCAD_V2_BASE: http://127.0.0.1:4182
        run: |
          python3 -m http.server 4182 --bind 127.0.0.1 --directory site >/tmp/wafercad-assembly-preview-http.log 2>&1 &
          node scripts/v2/check-assembly-preview.mjs
          node scripts/v2/check-assembly-bond-draft.mjs
      - name: Ordinary Workstation Recovery integrity after Assembly handoff
        env:
          WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
          WAFERCAD_V2_BASE: http://127.0.0.1:4182
        run: |
          node scripts/v2/check-recovery-failure-atomicity.mjs
          node scripts/v2/check-recovery-corrupt-checkpoint.mjs
      - name: Store inspected view screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wafer-bond-assembly-preview
          path: |
            test-results/wafer-bond-preview/*.png
            test-results/wafer-bond-draft/*.png
          if-no-files-found: warn
          retention-days: 14

name: Format active source once

on:
  push:
    branches:
      - chore/quality-safety-cleanup
    paths:
      - ".github/workflows/format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: chore/quality-safety-cleanup

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install development tools
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Format active source and current docs
        run: |
          npx prettier --write             "site/**/*.{js,mjs,css,html}"             "docs/**/*.md"             "README.md"             "legacy/README.md"             "THIRD_PARTY_NOTICES.md"             "eslint.config.js"             "package.json"             ".prettierrc.json"

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site docs README.md legacy/README.md THIRD_PARTY_NOTICES.md eslint.config.js package.json .prettierrc.json
          if git diff --cached --quiet; then
            echo "No formatting changes."
          else
            git commit -m "style: format active source"
            git push origin HEAD:chore/quality-safety-cleanup
          fi

name: UI v2 Main, Mask and Mobile acceptance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'site/**'
      - 'scripts/v2/**'
      - '.github/workflows/ui-v2-main-mask.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-v2-main-mask-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main-mask:
    name: Main and Mask browser gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run CI checks
        run: npm run check:ci
      - name: Cache Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.1
      - name: Install Playwright Chromium 1.55.1
        run: npx playwright install --with-deps chromium
      - name: Start UI v2 server and wait for port 4182
        shell: bash
        run: |
          node scripts/v2/serve-v2.mjs > serve.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4182/app-v2-main.html; then
              exit 0
            fi
            sleep 1
          done
          cat serve.log
          exit 1
      - name: Check Main, Mask and shared Section; count all failures
        shell: bash
        run: |
          failures=0
          for script in check-mobile-workstation check-open-mask-unit-editor check-unit-roi-alignment-lifecycle check-tooltips check-main-view check-mask-view check-section-view; do
            echo "::group::${script}"
            if ! node "scripts/v2/${script}.mjs"; then
              echo "::error::View gate failed: ${script}"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          echo "Main/Mask/Mobile browser gate failures: ${failures}"
          test "${failures}" -eq 0
      - name: Upload browser review and server evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wafercad-ui-v2-main-mask-${{ github.sha }}
          path: |
            test-results/ui-v2-main-review/
            test-results/ui-v2-mask-review/
            test-results/ui-v2-unit-editor/
            test-results/ui-v2-unit-lifecycle/
            test-results/ui-v2-section-review/
            test-results/ui-v2-tooltip-review/
            test-results/ui-v2-mobile/
            serve.log
          retention-days: 14
          if-no-files-found: warn

name: Renderer V4 R7 ABBA instrument smoke

on:
  push:
    branches:
      - perf/renderer-v4-adaptive-tiles-20261010
    paths:
      - site/three-view.js
      - scripts/renderer-v4-r7-abba-browser.mjs
      - scripts/renderer-v4-r7-compare-saved.mjs
      - scripts/test-helpers/renderer-r7-abba.mjs
      - scripts/tests/renderer-v4-r7-abba.test.mjs
      - .github/workflows/renderer-v4-r7-abba.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderer-v4-r7-abba-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check ABBA statistics and script style
        run: |
          node --test scripts/tests/renderer-v4-r7-abba.test.mjs
          npx eslint scripts/renderer-v4-r7-abba-browser.mjs scripts/renderer-v4-r7-compare-saved.mjs scripts/test-helpers/renderer-r7-abba.mjs scripts/tests/renderer-v4-r7-abba.test.mjs
          npx prettier --check scripts/renderer-v4-r7-abba-browser.mjs scripts/renderer-v4-r7-compare-saved.mjs scripts/test-helpers/renderer-r7-abba.mjs scripts/tests/renderer-v4-r7-abba.test.mjs
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static WaferCAD
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-v4-r7.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/app.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wafercad-v4-r7.log
          exit 1
      - name: CI smoke ABBA four-context parity (not a hardware speed benchmark)
        run: node scripts/renderer-v4-r7-abba-browser.mjs --ci-smoke --gpu-timing
      - name: Verify offline R7 pairwise analyzer on saved smoke artifacts
        run: node scripts/renderer-v4-r7-compare-saved.mjs --ci-smoke
      - name: Print exact Prettier diffs on formatting failure
        if: failure()
        run: |
          for file in scripts/renderer-v4-r7-abba-browser.mjs scripts/renderer-v4-r7-compare-saved.mjs scripts/test-helpers/renderer-r7-abba.mjs scripts/tests/renderer-v4-r7-abba.test.mjs; do
            npx prettier "$file" | diff -u "$file" - || true
          done
      - name: Retain R7 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: renderer-v4-r7-abba-smoke
          path: test-results/renderer-v4-r7-ci-smoke/
          if-no-files-found: warn
          retention-days: 14

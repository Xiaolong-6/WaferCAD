name: T-CMOS candidate fixture sync (temporary)

on:
  push:
    branches:
      - feat/tcmos-ternary-inverter-example-20261014
    paths:
      - .github/workflows/tcmos-fixture-sync-once.yml

permissions: {}

jobs:
  sync:
    if: github.repository == 'Xiaolong-6/WaferCAD'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate T-CMOS science and generated fixture
        run: |
          node --test site/tests/tcmos-inverter-reconstruction.test.mjs site/tests/dopant-regions.test.mjs site/tests/implant-buried-interval.test.mjs
          node scripts/build-tcmos-inverter-example.mjs
          node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('test-results/tcmos/tcmos-ternary-inverter-130nm.wafercad'));const ids=new Set(p.layout.elements.map(x=>x.layer));if(ids.size!==8||p.layout.elements.length!==232)throw Error('Source SVG File Mask changed');"
      - name: Commit only the generated candidate
        env:
          TARGET_BRANCH: feat/tcmos-ternary-inverter-example-20261014
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          cp test-results/tcmos/tcmos-ternary-inverter-130nm.wafercad examples/projects/tcmos-ternary-inverter-2019-candidate/tcmos-ternary-inverter-130nm.wafercad
          git add -- examples/projects/tcmos-ternary-inverter-2019-candidate/tcmos-ternary-inverter-130nm.wafercad
          if git diff --cached --quiet; then
            echo "Fixture is already synchronized"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "test(tcmos): synchronize approved-SVG Recipe candidate fixture"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi

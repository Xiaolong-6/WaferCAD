name: Temporary #337 offline Chromium workspace bundle
on:
  push:
    branches:
      - perf/microdisk-72-project-open-20261018
    paths:
      - '.github/workflows/perf337-offline-bundle.yml'
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v6
        with:
          name: perf337-local-source-three-playwright
          path: |
            site/
            scripts/
            node_modules/three/
            node_modules/playwright/
            node_modules/playwright-core/
            package.json
            package-lock.json
            eslint.config.js
            .prettierrc.json
          retention-days: 1
          if-no-files-found: error

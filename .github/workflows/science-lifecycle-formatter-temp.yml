name: Temporary scientific lifecycle formatter
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/science-lifecycle-formatter-temp.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/scientific-data-lifecycle-20261013
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format scoped scientific lifecycle changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ./node_modules/.bin/prettier --write site/controllers/mask-import-controller.js site/controllers/mask-roi-controller.js scripts/v2/check-unit-roi-alignment-lifecycle.mjs
          git add site/controllers/mask-import-controller.js site/controllers/mask-roi-controller.js scripts/v2/check-unit-roi-alignment-lifecycle.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(science): format ROI and Alignment lifecycle code"
            git push origin HEAD:refs/heads/test/scientific-data-lifecycle-20261013
          fi

name: Microdisk native adaptive Workstation evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/v2/capture-isotropic-microdisk-workstation.mjs'
      - 'site/isotropic-release-*.js'
      - 'site/model.js'
      - 'site/tests/isotropic-release-*.test.mjs'
      - 'site/examples/suspended-silica-microdisks.wafercad'
      - '.github/workflows/isotropic-microdisk-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-microdisk:
    name: Native v2 3D and Section source/legacy/adaptive comparison
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
      WAFERCAD_V2_BASE: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Launch actual WaferCAD v2
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > /tmp/wafercad-microdisk-v2.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/wafercad-microdisk-v2.log
          exit 1
      - name: Compare actual published Microdisk and opt-in native 3D/Section screenshots
        run: node scripts/v2/capture-isotropic-microdisk-workstation.mjs
      - name: Upload real Workstation screens and physical manifest
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-v2-isotropic-microdisk-workstation
          path: test-results/isotropic-microdisk-workstation/
          if-no-files-found: warn
          retention-days: 14

name: M3D Prettier one-shot
on:
  push:
    branches:
      - feat/m3d-rram-cntfet-lime-20261014
    paths:
      - .github/workflows/m3d-prettier-once.yml
permissions:
  contents: write
jobs:
  format-precise:
    if: github.repository == 'Xiaolong-6/WaferCAD' && github.ref == 'refs/heads/feat/m3d-rram-cntfet-lime-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m3d-rram-cntfet-lime-20261014
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prettier only two M3D source files
        run: |
          npx prettier --write scripts/build-m3d-lime-example.mjs site/tests/m3d-lime-builder.test.mjs
          npx prettier --check scripts/build-m3d-lime-example.mjs site/tests/m3d-lime-builder.test.mjs
      - name: Commit format-only changes without force
        shell: bash
        run: |
          set -euo pipefail
          git add -- scripts/build-m3d-lime-example.mjs site/tests/m3d-lime-builder.test.mjs
          if git diff --cached --quiet; then
            echo 'No formatting needed'; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "style(m3d): apply Prettier to precharge builder and regression"
          git fetch origin refs/heads/feat/m3d-rram-cntfet-lime-20261014
          git rebase origin/feat/m3d-rram-cntfet-lime-20261014
          git push origin HEAD:refs/heads/feat/m3d-rram-cntfet-lime-20261014

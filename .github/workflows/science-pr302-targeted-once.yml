name: Science PR302 targeted format evidence
on:
  push:
    branches: [science/figure-provenance-299]
permissions:
  contents: read
jobs:
  format-diff-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exact formatter diff and provenance unit tests
        shell: bash
        run: |
          set -euo pipefail
          node --test site/tests/literature-provenance-matrix.test.mjs
          npx --no-install prettier --write scripts/example-literature-visual-evidence.mjs site/tests/literature-provenance-matrix.test.mjs
          git --no-pager diff -- scripts/example-literature-visual-evidence.mjs site/tests/literature-provenance-matrix.test.mjs

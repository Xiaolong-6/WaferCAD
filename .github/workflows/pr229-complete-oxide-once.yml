name: PR229 final unmasked oxide and retired fallback mask acceptance

on:
  push:
    branches: [feat/example-gan-hemt-microchannel-20261014]
    paths: [.github/workflows/pr229-complete-oxide-once.yml]

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format touched scientific source only
        run: |
          npx prettier --write site/model.js site/process-topology.js site/tests/conformal-floating-gap.test.mjs scripts/build-gan-hemt-microchannel-example.mjs scripts/gan-hemt-microchannel-visual-acceptance.mjs site/tests/gan-hemt-tsv-liner-probe.test.mjs site/tests/gan-hemt-microchannel-reconstruction.test.mjs docs/GAN_HEMT_MICROCHANNEL_RECONSTRUCTION_2026-10-14.md
          npx eslint site/model.js site/process-topology.js site/tests/conformal-floating-gap.test.mjs scripts/build-gan-hemt-microchannel-example.mjs scripts/gan-hemt-microchannel-visual-acceptance.mjs site/tests/gan-hemt-tsv-liner-probe.test.mjs site/tests/gan-hemt-microchannel-reconstruction.test.mjs
      - name: Rebuild physical full-oxide project and compact Preview
        run: |
          node scripts/build-gan-hemt-microchannel-example.mjs --write-repo
          node scripts/build-example-previews.mjs --id=gan-hemt-microchannel-2022 --write
      - name: Scientific oxide, full coolant, source replay and save validation
        run: |
          node --test site/tests/conformal-floating-gap.test.mjs site/tests/conformal-process.test.mjs site/tests/process-topology.test.mjs site/tests/gan-hemt-tsv-liner-probe.test.mjs site/tests/gan-hemt-microchannel-replay.test.mjs site/tests/gan-hemt-microchannel-reconstruction.test.mjs
      - name: Run physical browser renderer
        run: |
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > /tmp/gan306-browser.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/gan306-browser.log
          exit 1
      - name: Main/Mask/3D/Section real Chromium screenshots
        env:
          WAFERCAD_THREE_DIR: ./node_modules/three
        run: node scripts/gan-hemt-microchannel-visual-acceptance.mjs
      - name: Regenerate just this example's thumbnail
        env:
          WAFERCAD_THREE_DIR: ./node_modules/three
        run: node scripts/build-example-thumbnails.mjs --id=gan-hemt-microchannel-2022
      - name: Save only validated GaN source and generated assets on PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/model.js site/process-topology.js site/tests/conformal-floating-gap.test.mjs scripts/build-gan-hemt-microchannel-example.mjs scripts/gan-hemt-microchannel-visual-acceptance.mjs site/tests/gan-hemt-tsv-liner-probe.test.mjs site/tests/gan-hemt-microchannel-reconstruction.test.mjs docs/GAN_HEMT_MICROCHANNEL_RECONSTRUCTION_2026-10-14.md site/examples/gan-hemt-microchannel-2022.wafercad site/examples/previews/gan-hemt-microchannel-2022.wafercad site/examples/thumbnails/gan-hemt-microchannel-2022-three.webp tests/fixtures/project-io/example-thumbnails.json
          if ! git diff --cached --quiet; then
            git commit -m "build(gan): persist full exposed oxide model and canonical artifacts"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr229-complete-oxide-three-chip-browser-evidence
          path: test-results/gan-microchannel/visual/
          if-no-files-found: warn

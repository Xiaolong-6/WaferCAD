name: M3D full replay

on:
  push:
    branches:
      - fix/m3d-conformal-microcracks-20261008
    paths:
      - "scripts/m3d-kernel-full-replay.mjs"
      - "site/tests/m3d-reconstruction-regression.test.mjs"
      - "site/model.js"
      - "site/history-operation-label.js"
      - "site/tests/history-operation-label.test.mjs"
      - "site/project-io.js"
      - "site/project-export-worker.js"
      - "site/tests/project-file.test.mjs"
      - "scripts/m3d-visual-acceptance.mjs"
      - "examples/projects/m3d-selfpowered-2026-candidate/**"
      - ".github/workflows/m3d-full-replay.yml"
  workflow_dispatch:

concurrency:
  group: m3d-conformal-microcracks-20261008
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Corrected M3D mask and focused Kernel regression
        run: node --test site/tests/m3d-reconstruction-regression.test.mjs site/tests/conformal-process.test.mjs
      - name: Kernel full replay S00-S26
        run: node scripts/m3d-kernel-full-replay.mjs --write-repo
      - name: Sync production project and single-step welcome preview
        run: |
          cp examples/projects/m3d-selfpowered-2026-replay/M3D_selfpowered_full_replay.wafercad site/examples/m3d-selfpowered-full-replay.wafercad
          node scripts/build-example-previews.mjs --id=m3d-selfpowered-heterogeneous-ic --write
      - name: Commit validated replay outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/projects/m3d-selfpowered-2026-replay site/examples/m3d-selfpowered-full-replay.wafercad site/examples/previews/m3d-selfpowered-heterogeneous-ic.wafercad
          git diff --cached --quiet || git commit -m "Add validated M3D Kernel full replay outputs"
          git fetch origin fix/m3d-conformal-microcracks-20261008
          git rebase origin/fix/m3d-conformal-microcracks-20261008
          git push origin HEAD:fix/m3d-conformal-microcracks-20261008
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3d-kernel-full-replay
          path: test-results/m3d/kernel-full-replay
          if-no-files-found: warn

  visual-acceptance:
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/m3d-conformal-microcracks-20261008
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check corrected masks and Kernel fixtures
        run: node --test site/tests/m3d-reconstruction-regression.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start WaferCAD preview
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wafercad-http.log
          exit 1
      - name: Build matching M3D WebP preview and thumbnail manifest
        run: node scripts/build-example-thumbnails.mjs --id=m3d-selfpowered-heterogeneous-ic
      - name: Focused M3D project and Kernel acceptance
        run: node --test site/tests/m3d-bundled-example.test.mjs site/tests/m3d-reconstruction-regression.test.mjs
      - name: Commit validated final 3D thumbnail and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/examples/thumbnails/m3d-selfpowered-heterogeneous-ic-three.webp tests/fixtures/project-io/example-thumbnails.json
          git diff --cached --quiet || git commit -m "Add M3D final-state 3D thumbnail"
          git fetch origin fix/m3d-conformal-microcracks-20261008
          git rebase origin/fix/m3d-conformal-microcracks-20261008
          git push origin HEAD:fix/m3d-conformal-microcracks-20261008
      - name: Import and inspect Main, Section, 3D, History and Export
        run: node scripts/m3d-visual-acceptance.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: m3d-visual-acceptance
          path: test-results/m3d/visual-acceptance/
          if-no-files-found: warn
          retention-days: 14

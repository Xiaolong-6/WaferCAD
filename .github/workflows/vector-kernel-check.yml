name: Vector kernel check
on:
  push:
    branches:
      - rewrite/vector-region-kernel
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run vector geometry self-test
        run: node site/selftest.mjs

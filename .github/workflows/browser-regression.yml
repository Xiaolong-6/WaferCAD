name: Browser regression

on:
  workflow_call:
    inputs:
      force_full:
        description: Run the complete nightly Browser matrix
        required: false
        type: boolean
        default: false
      skip_node_gate:
        description: The release workflow owns the Node gate for this revision
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run_scope:
        description: Run the complete Browser matrix or only 625-site renderer stress
        required: false
        type: choice
        default: full
        options:
          - full
          - renderer-array

concurrency:
  group: browser-regression-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan browser suites
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      smoke: ${{ steps.plan.outputs.smoke }}
      workstation: ${{ steps.plan.outputs.workstation }}
      resilience: ${{ steps.plan.outputs.resilience }}
      history: ${{ steps.plan.outputs.history }}
      persistence: ${{ steps.plan.outputs.persistence }}
      interaction: ${{ steps.plan.outputs.interaction }}
      examples: ${{ steps.plan.outputs.examples }}
      product_layout: ${{ steps.plan.outputs.product_layout }}
      renderer: ${{ steps.plan.outputs.renderer }}
      process: ${{ steps.plan.outputs.process }}
      extended: ${{ steps.three_reuse.outputs.extended || steps.plan.outputs.extended }}
      extended_matrix: ${{ steps.three_reuse.outputs.extended_matrix || steps.plan.outputs.extended_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build regression plan
        id: plan
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.run_scope }}" == "renderer-array" ]]; then
            # Isolate the single expensive 625-site real-browser owner. This
            # opt-in diagnostic does not replace any Ready/release suite.
            for suite in full smoke workstation resilience history persistence interaction examples product_layout process extended; do
              echo "$suite=false" >> "$GITHUB_OUTPUT"
            done
            echo 'renderer=true' >> "$GITHUB_OUTPUT"
            echo 'extended_matrix=["none"]' >> "$GITHUB_OUTPUT"
            echo 'Manual 625-site renderer-only acceptance (all 20 toggles)'
          elif [[ "${{ inputs.force_full }}" == "true" ]]; then
            node scripts/ci-test-plan.mjs --full
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
              | node scripts/ci-test-plan.mjs --stdin \
                  --base=${{ github.event.pull_request.base.sha }} \
                  --head=${{ github.event.pull_request.head.sha }}
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            node scripts/ci-test-plan.mjs --full
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" =~ ^0+$ ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              # Conservative fallback for an unusual push event where the
              # previous main revision cannot be resolved locally.
              node scripts/ci-test-plan.mjs --full
            else
              git diff --name-only "$before" "${{ github.sha }}" \
                | node scripts/ci-test-plan.mjs --stdin
            fi
          else
            node scripts/ci-test-plan.mjs --full
          fi

      - name: Reuse source-identical accepted 3D browser evidence
        id: three_reuse
        if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && !inputs.force_full && steps.plan.outputs.three == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BROWSER_EXTENDED_MATRIX: ${{ steps.plan.outputs.extended_matrix }}
        run: node scripts/ci-three-evidence.mjs

  browser:
    name: ${{ github.event_name == 'push' && 'Main targeted regression' || 'Chromium targeted regression' }}
    needs: plan
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_scope != 'renderer-array' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
      WAFERCAD_CAPTURE_REVIEW: ${{ (inputs.force_full || github.event_name == 'workflow_dispatch') && '1' || '0' }}
      WAFERCAD_EXTENDED_REVIEW: ${{ (inputs.force_full || github.event_name == 'workflow_dispatch') && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.1

      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Node test gate outside PRs
        if: ${{ github.event_name != 'pull_request' && !inputs.skip_node_gate }}
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start WaferCAD
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wafercad-http.log
          exit 1

      - name: Run UI smoke
        if: ${{ needs.plan.outputs.smoke == 'true' }}
        run: npm run test:ui:smoke

      - name: Run resilience regression
        if: ${{ needs.plan.outputs.resilience == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft || github.event.pull_request.number == 290) }}
        run: npm run test:ui:resilience

      - name: Run History regression
        if: ${{ needs.plan.outputs.history == 'true' }}
        run: npm run test:ui:history

      - name: Run persistence regression
        if: ${{ needs.plan.outputs.persistence == 'true' }}
        run: npm run test:ui:persistence
      - name: Check rough cap, sidewall, and outline geometry contracts
        if: needs.plan.outputs.renderer == 'true'
        run: node --test site/tests/rough-boundary-profile.test.mjs site/tests/three-outline-geometry.test.mjs site/tests/three-outline-ownership.test.mjs

      # PR #328's scientific contract uses the actual committed PERC file.
      # Draft Quality runs only the fast structural checks, so keep this
      # targeted geometry gate active before final review.
      - name: Verify PERC front Implant ownership after rear contact partition
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 328 }}
        run: node --test site/tests/perc-front-implant-ownership.test.mjs site/tests/project-annotation.test.mjs

      - name: Verify PR250 conformal 50 nm common-XY geometry
        if: ${{ needs.plan.outputs.renderer == 'true' && github.event_name == 'pull_request' && github.event.pull_request.number == 250 }}
        run: node --test site/tests/photodetector-rough-conformal.test.mjs

      - name: Capture real photodetector rough ROI evidence
        if: ${{ needs.plan.outputs.renderer == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.number == 250 || github.event.pull_request.number == 326)) }}
        env:
          WAFERCAD_AUDIT_PHOTODETECTOR: '1'
          WAFERCAD_AUDIT_PERSPECTIVE: ${{ (github.event.pull_request.number == 250 || github.event.pull_request.number == 326) && '1' || '0' }}
          WAFERCAD_AUDIT_FILTER: photodetector-blacksi-final
          WAFERCAD_AUDIT_OUTPUT: test-results/product-review/pr250-photodetector
        run: node scripts/pr250-renderer-audit.mjs

      - name: Upload targeted Photodetector ROI evidence
        if: ${{ !cancelled() && needs.plan.outputs.renderer == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.number == 250 || github.event.pull_request.number == 326)) }}
        uses: actions/upload-artifact@v6
        with:
          name: pr250-photodetector-${{ github.sha }}
          path: test-results/product-review/pr250-photodetector/
          if-no-files-found: error
          retention-days: 3

      - name: Check explicit no-Worker rough fallback matrix
        if: ${{ needs.plan.outputs.renderer == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.number == 250) }}
        env:
          WAFERCAD_AUDIT_NO_WORKER: '1'
          WAFERCAD_AUDIT_TIMEOUT: '30000'
          WAFERCAD_AUDIT_OUTPUT: test-results/product-review/pr250-no-worker
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.number }}" == "250" ]]; then
            # Recheck the formerly failed no-Worker 8-fixture, 40-capture matrix.
            node scripts/pr250-renderer-audit.mjs
          else
            WAFERCAD_AUDIT_FILTER=rect-stochastic-exposed node scripts/pr250-renderer-audit.mjs
          fi

      - name: Upload PR250 no-Worker matrix evidence
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 250 && needs.plan.outputs.renderer == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: pr250-no-worker-${{ github.sha }}
          path: test-results/product-review/pr250-no-worker/
          if-no-files-found: error
          retention-days: 3

      - name: Check rough boundary and depth visibility evidence
        if: ${{ needs.plan.outputs.renderer == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.number == 250) }}
        env:
          WAFERCAD_AUDIT_ORACLE: '1'
          WAFERCAD_AUDIT_OUTPUT: test-results/product-review/pr250-audit
        run: node scripts/pr250-renderer-audit.mjs

      - name: Package tested preview
        if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft || github.event.pull_request.number == 290) }}
        run: |
          mkdir -p test-results/product-review/preview
          cp -R site/. test-results/product-review/preview/
          node -e 'require("node:fs").writeFileSync("test-results/product-review/preview/build-info.json", JSON.stringify({commit:process.env.GITHUB_SHA}))'

      - name: Upload product review and preview
        if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft || github.event.pull_request.number == 290) }}
        uses: actions/upload-artifact@v6
        with:
          name: wafercad-product-review-${{ github.sha }}
          path: test-results/product-review
          retention-days: 14

  release-ui-owners:
    name: Native v2 Release ${{ matrix.suite }}
    needs: plan
    if: ${{ needs.plan.outputs.extended == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft || github.event.pull_request.number == 290) }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.plan.outputs.extended_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
      WAFERCAD_V2_BASE: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.1
      - run: npx playwright install --with-deps chromium
      - name: Start real native-v2 application
        run: |
          python3 -m http.server 4173 --directory site >/tmp/release-ui-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/app.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/release-ui-http.log
          exit 1
      - name: Execute scientific Browser release owner
        shell: bash
        run: |
          case "${{ matrix.suite }}" in
            workstation) npm run test:ui:workstation ;;
            interaction) npm run test:ui:interaction ;;
            examples) npm run test:ui:examples ;;
            product_layout) npm run test:ui:product:layout ;;
            renderer) node scripts/renderer-product-regression.mjs ;;
            # Ready-only: accepted 3D gesture/viewport/export owner without
            # duplicating the full Workstation/Section/interaction sequence.
            three) node scripts/v2/check-three-view.mjs ;;
            *) echo 'Unknown release owner' >&2; exit 1 ;;
          esac
      - name: Archive real Chromium release evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-release-${{ matrix.suite }}-${{ github.sha }}
          path: |
            test-results/
            /tmp/release-ui-http.log
          retention-days: 7
          if-no-files-found: ignore

  renderer-array:
    name: 625-site array renderer regression
    needs: plan
    # Run 625-site software-WebGL stress at final review, on main or by manual dispatch.
    if: ${{ needs.plan.outputs.renderer == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft || github.event.pull_request.number == 290) }}
    runs-on: ubuntu-latest
    # All 20 completed full-quality transparent WebGL toggles remain mandatory.
    # Preserve the established 1440x960 framebuffer and scientific invariants;
    # hangs and retained-resource failures remain hard failures.
    timeout-minutes: 60
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.1

      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start WaferCAD
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-array-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wafercad-array-http.log
          exit 1

      # The native renderer owner in the same planned Browser workflow already
      # executes the four-width/touch M3D check and 80x80 array isolation.
      # Keep the unique full-scene 625-site leak/stability contract here.
      - name: Check 625-site renderer scientific invariants
        run: node --test site/tests/transparent-array-lod.test.mjs site/tests/renderer-geometry-cache.test.mjs

      - name: Check 625-site array scene and retained resources
        run: node scripts/v2/check-source-sunset-renderer-stress.mjs

      - name: Upload array renderer diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wafercad-array-renderer-${{ github.sha }}
          path: test-results/array-renderer
          retention-days: 14
          if-no-files-found: warn

  process-geometry:
    name: Process geometry regression (${{ matrix.domain }})
    needs: plan
    if: ${{ needs.plan.outputs.process == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        domain: [process, io, array]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
      WAFERCAD_PROCESS_EXTENDED: ${{ (inputs.force_full || github.event_name == 'workflow_dispatch') && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.1

      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start WaferCAD
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wafercad-http.log
          exit 1

      - name: Run native scientific release owner
        shell: bash
        run: |
          case "${{ matrix.domain }}" in
            process) node scripts/process-geometry-regression.mjs ;;
            io) npm run test:ui:io ;;
            array) npm run test:ui:array ;;
            *) echo 'Unknown process owner' >&2; exit 1 ;;
          esac

      - name: Upload Lift-off UX screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-process-${{ matrix.domain }}-${{ github.sha }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  renderer-array-edge-on:
    name: 625-site edge-on exact-wall restoration
    needs: plan
    if: ${{ needs.plan.outputs.renderer == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_scope != 'renderer-array') && (github.event_name != 'pull_request' || !github.event.pull_request.draft || github.event.pull_request.number == 290) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.1
      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start WaferCAD
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-edge-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wafercad-edge-http.log
          exit 1
      - name: Check exact sidewalls and fitted far-field recovery
        run: node scripts/array-renderer-edge-on-regression.mjs
      - name: Upload edge-on renderer diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wafercad-array-edge-on-${{ github.sha }}
          path: test-results/array-renderer-edge-on
          retention-days: 14
          if-no-files-found: warn

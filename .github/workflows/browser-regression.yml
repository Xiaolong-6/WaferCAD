name: Browser regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "site/**"
      - "!site/tests/**"
      - "examples/**"
      - "scripts/ui-smoke.mjs"
      - "scripts/workstation-regression.mjs"
      - "scripts/history-regression.mjs"
      - "scripts/persistence-regression.mjs"
      - "scripts/process-geometry-regression.mjs"
      - "scripts/project-io-runtime-regression.mjs"
      - "scripts/array-runtime-regression.mjs"
      - "scripts/array-renderer-regression.mjs"
      - "scripts/renderer-pipeline-benchmark.mjs"
      - "scripts/interaction-regression.mjs"
      - "scripts/resilience-regression.mjs"
      - "scripts/test-helpers/**"
      - "scripts/example-regression.mjs"
      - "scripts/product-regression.mjs"
      - "scripts/product-layout-cases.mjs"
      - "scripts/renderer-product-cases.mjs"
      - "scripts/product-layout-regression.mjs"
      - "scripts/renderer-product-regression.mjs"
      - "scripts/process-benchmarks.mjs"
      - "scripts/ci-test-plan.mjs"
      - ".github/workflows/browser-regression.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "site/**"
      - "!site/tests/**"
      - "examples/**"
      - "scripts/**"
      - ".github/workflows/browser-regression.yml"
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

concurrency:
  group: browser-regression-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan browser suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      smoke: ${{ steps.plan.outputs.smoke }}
      workstation: ${{ steps.plan.outputs.workstation }}
      resilience: ${{ steps.plan.outputs.resilience }}
      history: ${{ steps.plan.outputs.history }}
      persistence: ${{ steps.plan.outputs.persistence }}
      interaction: ${{ steps.plan.outputs.interaction }}
      examples: ${{ steps.plan.outputs.examples }}
      product_layout: ${{ steps.plan.outputs.product_layout }}
      renderer: ${{ steps.plan.outputs.renderer }}
      process: ${{ steps.plan.outputs.process }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build regression plan
        id: plan
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
              | node scripts/ci-test-plan.mjs --stdin
          elif [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            node scripts/ci-test-plan.mjs --full
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" =~ ^0+$ ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              # Conservative fallback for an unusual push event where the
              # previous main revision cannot be resolved locally.
              node scripts/ci-test-plan.mjs --full
            else
              git diff --name-only "$before" "${{ github.sha }}" \
                | node scripts/ci-test-plan.mjs --stdin
            fi
          else
            node scripts/ci-test-plan.mjs --full
          fi

  browser:
    name: ${{ github.event_name == 'push' && 'Main targeted regression' || 'Chromium targeted regression' }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
      WAFERCAD_CAPTURE_REVIEW: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
      WAFERCAD_EXTENDED_REVIEW: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.1

      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Node test gate outside PRs
        if: ${{ github.event_name != 'pull_request' }}
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start WaferCAD
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wafercad-http.log
          exit 1

      - name: Run UI smoke
        if: ${{ needs.plan.outputs.smoke == 'true' }}
        run: npm run test:ui:smoke

      - name: Run workstation regression
        if: ${{ needs.plan.outputs.workstation == 'true' }}
        run: npm run test:ui:workstation

      - name: Run resilience regression
        if: ${{ needs.plan.outputs.resilience == 'true' }}
        run: npm run test:ui:resilience

      - name: Run History regression
        if: ${{ needs.plan.outputs.history == 'true' }}
        run: npm run test:ui:history

      - name: Run persistence regression
        if: ${{ needs.plan.outputs.persistence == 'true' }}
        run: npm run test:ui:persistence

      - name: Run interaction regression
        if: ${{ needs.plan.outputs.interaction == 'true' }}
        run: npm run test:ui:interaction

      - name: Run bundled example regression
        if: ${{ needs.plan.outputs.examples == 'true' }}
        run: npm run test:ui:examples

      - name: Run product layout regression
        if: ${{ needs.plan.outputs.product_layout == 'true' }}
        run: npm run test:ui:product:layout

      - name: Run renderer product regression
        if: ${{ needs.plan.outputs.renderer == 'true' }}
        run: npm run test:ui:product:renderer

      - name: Run renderer pipeline benchmark
        if: ${{ needs.plan.outputs.renderer == 'true' }}
        run: npm run benchmark:renderer

      - name: Run rough renderer benchmark
        if: ${{ needs.plan.outputs.renderer == 'true' }}
        run: node scripts/rough-renderer-benchmark.mjs

      - name: Package tested preview
        if: always()
        run: |
          mkdir -p test-results/product-review/preview
          cp -R site/. test-results/product-review/preview/
          node -e 'require("node:fs").writeFileSync("test-results/product-review/preview/build-info.json", JSON.stringify({commit:process.env.GITHUB_SHA}))'

      - name: Upload product review and preview
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wafercad-product-review-${{ github.sha }}
          path: test-results/product-review
          retention-days: 14

  process-geometry:
    name: Process geometry regression
    needs: plan
    if: ${{ needs.plan.outputs.process == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
      WAFERCAD_PROCESS_EXTENDED: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.1

      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start WaferCAD
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wafercad-http.log
          exit 1

      - name: Run process geometry regression
        run: npm run test:ui:process

name: M3D ML isolated GDS/OAS and 3D conductor audit

on:
  push:
    branches:
      - feat/m3d-precharge-geometry-20261017
    paths:
      - .github/workflows/m3d-ml-once.yml

permissions:
  contents: read
  actions: read

jobs:
  verify-exact-kernel-artifact:
    if: github.repository == 'Xiaolong-6/WaferCAD' && github.ref == 'refs/heads/feat/m3d-precharge-geometry-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download source-Kernel generated fixture and real Chromium mask exports
        uses: actions/download-artifact@v4
        with:
          run-id: 39029843399
          name: m3d-ml-native-evidence-a7366bfe62dcd6283a70f6afbe221af07ec16170
          path: .
          github-token: ${{ github.token }}
      - name: Strict evidence provenance and source identity
        shell: bash
        run: |
          set -euo pipefail
          test -s site/examples/m3d-lime-rram-cntfet.wafercad
          test -s test-results/m3d-lime/browser/full-inferred-mask.gds
          test -s test-results/m3d-lime/browser/full-inferred-mask.oas
          test -s test-results/m3d-lime/validation.json
          test -s test-results/m3d-lime/browser/three-local-tcam-ml-junction.png
          git diff --exit-code a7366bfe62dcd6283a70f6afbe221af07ec16170 HEAD -- scripts/build-m3d-lime-example.mjs
          python3 - <<'PY'
          import json
          p=json.load(open('site/examples/m3d-lime-rram-cntfet.wafercad'))
          s=json.load(open('test-results/m3d-lime/validation.json'))
          assert s['pass'] is True
          assert len(p['processRecipe']['steps']) == 50
          assert len(p['layout']['elements']) == 142
          assert len(p['layout']['combos']) == 12
          print('Exact real Kernel fixture, 50 Recipe steps, 142 polygons, 12 masks: PASS')
          PY
      - name: Install only independent external scientific readers
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir klayout==0.30.12 shapely==2.1.2
      - name: KLayout GDSII/OASIS native export and contact-net verification
        run: python3 scripts/klayout-m3d-lime-verify.py test-results/m3d-lime/browser
      - name: Independent polygon-island-aware 3D Pd network verification
        run: python3 scripts/m3d-ml-conductive-graph.py site/examples/m3d-lime-rram-cntfet.wafercad | tee test-results/m3d-lime/ml-conductive-graph.json
      - name: Export scoped scientific proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3d-ml-interop-evidence-${{ github.sha }}
          path: |
            test-results/m3d-lime/klayout-m3d-lime.json
            test-results/m3d-lime/ml-conductive-graph.json
          retention-days: 14
          if-no-files-found: warn

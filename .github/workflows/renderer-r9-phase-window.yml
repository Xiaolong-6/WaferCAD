name: Renderer R9 bounded raster diagnostic

on:
  push:
    branches:
      - perf/renderer-v4-adaptive-tiles-20261010
    paths:
      - scripts/renderer-unified-hardware.mjs
      - scripts/test-helpers/renderer-hardware-output-path.mjs
      - scripts/test-helpers/renderer-hardware-inventory.mjs
      - scripts/test-helpers/renderer-hardware-evidence.mjs
      - scripts/test-helpers/renderer-hardware-zip.mjs
      - site/tests/renderer-r9-evidence-zip.test.mjs
      - scripts/renderer-electrical-fresh-context-ab.mjs
      - scripts/test-helpers/renderer-unified-hardware-plan.mjs
      - scripts/test-helpers/renderer-v3-phase-window.mjs
      - scripts/tests/renderer-unified-hardware.test.mjs
      - site/tests/renderer-r9-phase-window.test.mjs
      - site/tests/renderer-r9-phase-patterns.test.mjs
      - scripts/test-helpers/renderer-r9-phase-patterns.mjs
      - scripts/renderer-r9-phase-readout.mjs
      - scripts/test-helpers/webgl-frame-probe.mjs
      - scripts/test-helpers/renderer-r9-focus-evidence.mjs
      - scripts/tests/renderer-r9-focus-fixture.mjs
      - site/tests/renderer-r9-focus-evidence.test.mjs
      - docs/RENDERER_R9_MSAA_PRESERVATION_2026-10-13.md
      - docs/RENDERER_174_CLOSEOUT_2026-10-13.md
      - .github/workflows/renderer-r9-phase-window.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/renderer-unified-hardware.mjs
      - scripts/test-helpers/renderer-hardware-output-path.mjs
      - scripts/test-helpers/renderer-hardware-inventory.mjs
      - scripts/test-helpers/renderer-hardware-evidence.mjs
      - scripts/test-helpers/renderer-hardware-zip.mjs
      - site/tests/renderer-r9-evidence-zip.test.mjs
      - scripts/renderer-electrical-fresh-context-ab.mjs
      - scripts/test-helpers/renderer-unified-hardware-plan.mjs
      - scripts/test-helpers/renderer-v3-phase-window.mjs
      - scripts/tests/renderer-unified-hardware.test.mjs
      - site/tests/renderer-r9-phase-window.test.mjs
      - site/tests/renderer-r9-phase-patterns.test.mjs
      - scripts/test-helpers/renderer-r9-phase-patterns.mjs
      - scripts/renderer-r9-phase-readout.mjs
      - scripts/test-helpers/webgl-frame-probe.mjs
      - scripts/test-helpers/renderer-r9-focus-evidence.mjs
      - scripts/tests/renderer-r9-focus-fixture.mjs
      - site/tests/renderer-r9-focus-evidence.test.mjs
      - docs/RENDERER_R9_MSAA_PRESERVATION_2026-10-13.md
      - docs/RENDERER_174_CLOSEOUT_2026-10-13.md
      - .github/workflows/renderer-r9-phase-window.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderer-r9-phase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate read-only native phase-window plan
        run: |
          node --test scripts/tests/renderer-unified-hardware.test.mjs site/tests/renderer-r9-phase-window.test.mjs site/tests/renderer-r9-phase-patterns.test.mjs site/tests/renderer-r9-focus-evidence.test.mjs site/tests/renderer-r9-evidence-zip.test.mjs
          node scripts/renderer-unified-hardware.mjs --plan-only --campaign=r9-phase-window
          node scripts/renderer-unified-hardware.mjs --plan-only --campaign=r9-focus
      - name: Check focused formatting
        run: |
          npx prettier --check scripts/renderer-unified-hardware.mjs scripts/renderer-electrical-fresh-context-ab.mjs scripts/test-helpers/renderer-unified-hardware-plan.mjs scripts/tests/renderer-unified-hardware.test.mjs site/tests/renderer-r9-phase-window.test.mjs scripts/test-helpers/renderer-r9-phase-patterns.mjs site/tests/renderer-r9-phase-patterns.test.mjs scripts/renderer-r9-phase-readout.mjs scripts/test-helpers/webgl-frame-probe.mjs scripts/test-helpers/renderer-r9-focus-evidence.mjs scripts/tests/renderer-r9-focus-fixture.mjs site/tests/renderer-r9-focus-evidence.test.mjs scripts/test-helpers/renderer-hardware-output-path.mjs scripts/test-helpers/renderer-hardware-inventory.mjs site/tests/renderer-r9-evidence-zip.test.mjs docs/RENDERER_R9_MSAA_PRESERVATION_2026-10-13.md docs/RENDERER_174_CLOSEOUT_2026-10-13.md
      - name: Show actual formatter differences on failure
        if: failure()
        run: |
          for file in scripts/renderer-unified-hardware.mjs scripts/renderer-electrical-fresh-context-ab.mjs scripts/test-helpers/renderer-unified-hardware-plan.mjs scripts/tests/renderer-unified-hardware.test.mjs site/tests/renderer-r9-phase-window.test.mjs scripts/test-helpers/renderer-r9-phase-patterns.mjs site/tests/renderer-r9-phase-patterns.test.mjs scripts/renderer-r9-phase-readout.mjs scripts/test-helpers/webgl-frame-probe.mjs scripts/test-helpers/renderer-r9-focus-evidence.mjs scripts/tests/renderer-r9-focus-fixture.mjs site/tests/renderer-r9-focus-evidence.test.mjs scripts/test-helpers/renderer-hardware-output-path.mjs scripts/test-helpers/renderer-hardware-inventory.mjs site/tests/renderer-r9-evidence-zip.test.mjs docs/RENDERER_R9_MSAA_PRESERVATION_2026-10-13.md docs/RENDERER_174_CLOSEOUT_2026-10-13.md; do
            npx prettier "$file" | diff -u "$file" - || true
          done

name: T-CMOS 4x4 Section fixture sync (temporary)

on:
  push:
    branches:
      - feat/tcmos-ternary-inverter-example-20261014
    paths:
      - .github/workflows/tcmos-row-section-sync-once.yml

permissions: {}

jobs:
  sync:
    if: github.repository == 'Xiaolong-6/WaferCAD'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Update view-only Section and verify immutable model
        run: |
          set -euo pipefail
          path=examples/projects/tcmos-ternary-inverter-2019-candidate/tcmos-inverter-4x4-replayed.wafercad
          test "$(git hash-object "$path")" = 994fafc0b509eb593d12b565e72a5628735bf897
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const file = 'examples/projects/tcmos-ternary-inverter-2019-candidate/tcmos-inverter-4x4-replayed.wafercad';
          const stored = JSON.parse(readFileSync(file, 'utf8'));
          assert.equal(stored.model.kernel, 'vector-2.5d-array-v1');
          assert.equal(stored.layout.elements.length, 3712);
          assert.equal(stored.snapshotBranches.nodes.length, 23);
          assert.deepEqual(stored.section, { a: [-23.52, 0], b: [23.52, 0] });
          const branch = stored.snapshotBranches.branches.find(
            (item) => item.id === stored.snapshotBranches.activeBranchId,
          );
          assert.ok(branch);
          const scientific = createHash('sha256').update(JSON.stringify({
            model: stored.model,
            layout: stored.layout,
            processRecipe: stored.processRecipe,
            nodes: stored.snapshotBranches.nodes,
          })).digest('hex');
          const section = { a: [-28, -5.2], b: [28, -5.2] };
          stored.section = section;
          branch.headState.section = { ...section, a: [...section.a], b: [...section.b] };
          assert.equal(createHash('sha256').update(JSON.stringify({
            model: stored.model,
            layout: stored.layout,
            processRecipe: stored.processRecipe,
            nodes: stored.snapshotBranches.nodes,
          })).digest('hex'), scientific);
          writeFileSync(file, JSON.stringify(stored));
          console.log('View-only 4×4 row Section aligned; model, layout, Recipe, History nodes unchanged.');
          NODE
      - name: Commit only the verified 4x4 project
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/tcmos-ternary-inverter-example-20261014"
          git add -- examples/projects/tcmos-ternary-inverter-2019-candidate/tcmos-inverter-4x4-replayed.wafercad
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "fix(tcmos): store approved transistor-row Section in 4x4 replay project"
          git push origin HEAD:refs/heads/feat/tcmos-ternary-inverter-example-20261014

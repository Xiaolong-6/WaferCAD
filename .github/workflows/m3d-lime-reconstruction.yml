name: M3D-LIME kernel reconstruction

on:
  pull_request:
    paths:
      - scripts/build-m3d-lime-example.mjs
      - site/tests/m3d-lime-builder.test.mjs
      - site/tests/m3d-lime-ald45-regression.test.mjs
      - site/model.js
      - scripts/v2/check-m3d-lime-project.mjs
      - scripts/klayout-m3d-lime-verify.py
      - site/controllers/base-controls-controller.js
      - site/controllers/project-controller.js
      - site/controllers/workspace-persistence-controller.js
      - site/controllers/workspace-session-controller.js
      - site/workspace-persistence.js
      - site/tests/controllers.test.mjs
      - site/ui-v2/project-mask-panels.js
      - site/ui-v2/workstation-workflow.js
      - site/app.js
      - site/tests/base-section-rebuild.test.mjs
      - site/examples/m3d-lime-rram-cntfet.wafercad
      - docs/M3D_LIME_2023_RECONSTRUCTION.md
      - .github/workflows/m3d-lime-reconstruction.yml
  workflow_dispatch:

# One-shot verified project sync; the workflow restores this read-only file
# into the exact generated commit before pushing to its Draft PR branch.
permissions:
  contents: write

jobs:
  paper-derived-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Isolated 45nm ALD geometry and rollback regression
        run: node --test site/tests/m3d-lime-ald45-regression.test.mjs
      - name: Format targeted exact-edge science regression
        run: npx prettier --write site/tests/m3d-lime-builder.test.mjs
      - name: Generate real Kernel example and validate project I/O
        run: node scripts/build-m3d-lime-example.mjs --write-repo
      - name: Source-derived structural regression (before browser)
        run: node --test site/tests/m3d-lime-builder.test.mjs
      - name: Commit validated PVD fixture and restore read-only CI in same commit
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/m3d-rram-cntfet-lime-20261014'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git diff --check
          git show 5ef0990e55488e8025cbceb2ac4c425d46c539c2:.github/workflows/m3d-lime-reconstruction.yml > .github/workflows/m3d-lime-reconstruction.yml
          git add .github/workflows/m3d-lime-reconstruction.yml site/tests/m3d-lime-builder.test.mjs site/examples/m3d-lime-rram-cntfet.wafercad
          git diff --cached --check
          git -c user.name='WaferCAD fixture bot' -c user.email='actions@users.noreply.github.com' commit -m 'test(m3d-lime): persist exact PVD contact fixture and read-only CI'
          git push origin "HEAD:refs/heads/${HEAD_REF}"
      - name: Check committed project matches source recipe
        run: git diff --exit-code -- site/examples/m3d-lime-rram-cntfet.wafercad
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.1
      - run: npx playwright install --with-deps chromium
      - name: Start v2 server
        shell: bash
        run: |
          node scripts/v2/serve-v2.mjs > serve-v2.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4182/app.html; then
              exit 0
            fi
            sleep 1
          done
          cat serve-v2.log
          exit 1
      - name: Browser project load and Run All
        env:
          WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
        run: node scripts/v2/check-m3d-lime-project.mjs
      - name: KLayout external validation of actual v2 mask exports
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir klayout==0.30.12
          python3 scripts/klayout-m3d-lime-verify.py test-results/m3d-lime/browser
      - name: Upload generated model and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3d-lime-kernel-${{ github.sha }}
          if-no-files-found: warn
          path: |
            site/examples/m3d-lime-rram-cntfet.wafercad
            test-results/m3d-lime/validation.json
            test-results/m3d-lime/klayout-m3d-lime.json
            test-results/m3d-lime/browser/
          retention-days: 14

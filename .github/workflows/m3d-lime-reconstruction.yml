name: M3D-LIME kernel reconstruction

on:
  pull_request:
    paths:
      - scripts/build-m3d-lime-example.mjs
      - site/tests/m3d-lime-builder.test.mjs
      - docs/M3D_LIME_2023_RECONSTRUCTION.md
      - .github/workflows/m3d-lime-reconstruction.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper-derived-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate real Kernel example and validate project I/O
        run: node scripts/build-m3d-lime-example.mjs --write-repo
      - name: Source-derived structural regression
        run: node --test site/tests/m3d-lime-builder.test.mjs
      - name: Upload generated model and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3d-lime-kernel-${{ github.sha }}
          if-no-files-found: warn
          path: |
            site/examples/m3d-lime-rram-cntfet.wafercad
            test-results/m3d-lime/validation.json
          retention-days: 14
      - name: One-time promote validated fixture to feature branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/m3d-rram-cntfet-lime-20261014'
        run: |
          test -s site/examples/m3d-lime-rram-cntfet.wafercad
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/examples/m3d-lime-rram-cntfet.wafercad
          git diff --cached --quiet || git commit -m "feat(examples): persist kernel-generated M3D-LIME process project"
          git push origin HEAD:refs/heads/feat/m3d-rram-cntfet-lime-20261014

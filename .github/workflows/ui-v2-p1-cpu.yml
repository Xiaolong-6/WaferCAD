name: UI v2 P1 CPU diagnostics

on:
  push:
    branches:
      - feat/ui-v2-progressive-startup-20261013
    paths:
      - 'scripts/v2/profile-startup-ci.mjs'
      - '.github/workflows/ui-v2-p1-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-hotspots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start UI v2 server
        shell: bash
        run: |
          node scripts/v2/serve-v2.mjs > serve-v2.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4182/app.html; then
              exit 0
            fi
            sleep 1
          done
          cat serve-v2.log
          exit 1
      - name: CPU sample M3D and restored Quality
        timeout-minutes: 20
        run: node scripts/v2/profile-startup-ci.mjs
      - name: Upload CPU evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p1-startup-cpu-${{ github.sha }}
          path: |
            test-results/p1-startup-cpu/
            serve-v2.log
          retention-days: 14
          if-no-files-found: warn

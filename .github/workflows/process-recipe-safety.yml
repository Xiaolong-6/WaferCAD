name: Process Recipe safety
on:
  workflow_call:
    inputs:
      skip_shared_node_gate:
        description: The caller already verifies the full lint, docs and Node test gate
        required: false
        type: boolean
        default: false
  push:
    branches:
      - fix/process-recipe-safety-r1-r7
      - feat/process-recipe-v1
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "site/process-recipe.js"
      - "site/model.js"
      - "site/process-numerical-contract.js"
      - "site/process-face-execution.js"
      - "site/process-worker.js"
      - "site/controllers/process-task-controller.js"
      - "site/controllers/process-panel-controller.js"
      - "site/process-recipe-preflight.js"
      - "site/controllers/process-recipe-controller.js"
      - "site/tests/process-recipe-preflight.test.mjs"
      - "scripts/process-recipe-safety-regression.mjs"
      - "scripts/process-transaction-ui-regression.mjs"
      - ".github/workflows/process-recipe-safety.yml"

permissions:
  contents: read

jobs:
  recipe:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft || github.event.pull_request.number == 290 }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # Ready PRs have the same full checks in Quality. Pages either runs its
      # release Quality job or verifies the exact Ready PR Quality evidence.
      # Keep this gate for standalone pushes and reusable callers by default.
      - name: Shared lint, docs and Node test gate
        if: ${{ github.event_name != 'pull_request' && !inputs.skip_shared_node_gate }}
        run: npm run check:ci
      - name: Start local app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site >/tmp/wafercad-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/app.html >/dev/null
      - name: Recipe interaction regression
        run: node scripts/process-recipe-safety-regression.mjs
      # Full production Run All, Ge Fig15 A/B and Keep-History are already
      # certified in parallel by example-recipe-reconstruction.yml. Running
      # them again sequentially here consumed the CI time budget and could
      # stall independent Recipe interaction acceptance. Keep this job focused
      # on Recipe security, preflight, undo/restore and Stop behavior.
      - name: Abort/rejected-worker History integrity in a real browser
        env:
          WAFERCAD_URL: http://127.0.0.1:4173
        run: node scripts/process-transaction-ui-regression.mjs
      - name: Upload browser replay diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: example-recipe-runall-diagnostics
          path: |
            test-results/example-recipe-runall/
            test-results/ui-acceptance/transaction/
          if-no-files-found: ignore
          retention-days: 14

name: PR229 targeted TiO2 preserved-color parity

on:
  push:
    branches:
      - feat/example-gan-hemt-microchannel-20261014
    paths:
      - .github/workflows/pr229-tio2-color-verify-once.yml

permissions:
  contents: read

jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate exactly the 4725-site source that failed
        run: |
          node scripts/tio2-metalens-array-scale.mjs --grid=80 --write-example
          git diff --exit-code -- site/examples/tio2-metalens-full-array.wafercad
      - name: Check generator lint and formatting only
        run: |
          npx eslint scripts/tio2-metalens-array-scale.mjs
          npx prettier --check scripts/tio2-metalens-array-scale.mjs

name: V2 History Pointer parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v2/check-history-pointer-parity.mjs'
      - 'site/controllers/history-mutation-controller.js'
      - 'site/ui-v2/workstation-workflow.js'
      - '.github/workflows/v2-history-pointer-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-history-pointer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  history-pointer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Diagnose Prettier layout (ephemeral runner only)
        run: |
          npx prettier --write scripts/v2/check-history-pointer-parity.mjs
          git diff -- scripts/v2/check-history-pointer-parity.mjs
      - run: npx playwright install --with-deps chromium
      - name: Start real v2 Workstation
        shell: bash
        run: |
          node scripts/v2/serve-v2.mjs > serve-v2.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent --output /dev/null http://127.0.0.1:4182/app.html && exit 0
            sleep 1
          done
          cat serve-v2.log
          exit 1
      - name: Verify real pointer event reaches History edit transaction
        env:
          WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
        run: node scripts/v2/check-history-pointer-parity.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v2-history-pointer-evidence
          path: |
            test-results/v2-history-pointer/after-pointer-click.png
            serve-v2.log
          if-no-files-found: ignore
          retention-days: 14

name: Photodetector reconstruction v2

on:
  push:
    branches:
      - fix/photodetector-reconstruction-v2
    paths:
      - "scripts/maintenance/rebuild-photodetectors.mjs"
      - "scripts/example-regression.mjs"
      - "site/tests/example-regression.test.mjs"
      - "site/tests/welcome-example.test.mjs"
      - ".github/workflows/photodetector-reconstruction-v2.yml"
  workflow_dispatch:

concurrency:
  group: photodetector-reconstruction-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Format changed source and documentation
        run: |
          npx prettier --write scripts/maintenance/rebuild-photodetectors.mjs scripts/example-regression.mjs site/tests/example-regression.test.mjs site/tests/welcome-example.test.mjs docs/PHOTODETECTOR_RECONSTRUCTION_V2_2026-10-08.md examples/projects/README.md
      - name: Rebuild full project from modern Kernel
        run: node scripts/maintenance/rebuild-photodetectors.mjs --write
      - name: Regenerate deterministic Welcome preview
        run: node scripts/build-example-previews.mjs --write --id=photodetector-literature
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site >/tmp/wafercad-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/app.html >/dev/null
      - name: Rebuild 3D thumbnail and hash manifest
        run: node scripts/build-example-thumbnails.mjs --id=photodetector-literature
      - name: Lint and Node scientific geometry acceptance
        run: npm run check:ci
      - name: Full example browser restoration acceptance
        run: node scripts/example-regression.mjs
      - name: Verify regeneration is stable
        run: |
          node scripts/maintenance/rebuild-photodetectors.mjs
          node scripts/build-example-previews.mjs --id=photodetector-literature
      - name: Commit fully validated regenerated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/maintenance/rebuild-photodetectors.mjs scripts/example-regression.mjs site/tests/example-regression.test.mjs site/tests/welcome-example.test.mjs docs/PHOTODETECTOR_RECONSTRUCTION_V2_2026-10-08.md examples/projects/README.md site/examples/photodetector-literature-examples.wafercad site/examples/previews/photodetector-literature.wafercad site/examples/thumbnails/photodetector-literature-three.webp tests/fixtures/project-io/example-thumbnails.json
          git diff --cached --quiet || git commit -m "Rebuild paper-faithful photodetector example from current kernel"
          git push origin HEAD:fix/photodetector-reconstruction-v2

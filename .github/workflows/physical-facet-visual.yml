name: Physical facet real-browser preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'site/physical-facet-preview.html'
      - 'site/physical-facet-preview.js'
      - 'site/physical-facet-render-geometry.js'
      - 'site/physical-facet-surface.js'
      - 'site/model-view-geometry.js'
      - 'scripts/v2/capture-physical-facet-preview.mjs'
      - '.github/workflows/physical-facet-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physical-facet-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screenshot:
    name: Real Chromium 3D and Section evidence (review required)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: One-time exact formatter source evidence
        run: |
          npx prettier --write site/physical-facet-preview.html site/physical-facet-preview.js site/physical-facet-render-geometry.js scripts/v2/capture-physical-facet-preview.mjs
          git diff --stat
      - name: Upload formatter output for review (temporary)
        uses: actions/upload-artifact@v6
        with:
          name: physical-facet-formatted-sources
          path: |
            site/physical-facet-preview.html
            site/physical-facet-preview.js
            site/physical-facet-render-geometry.js
            scripts/v2/capture-physical-facet-preview.mjs
          retention-days: 1
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.1
      - run: npx playwright install --with-deps chromium
      - name: Render true physical facet geometry in Chromium
        run: node scripts/v2/capture-physical-facet-preview.mjs
      - name: Retain unreviewed screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: physical-facet-same-owner-browser-evidence
          path: test-results/physical-facet-preview/
          retention-days: 14
          if-no-files-found: warn

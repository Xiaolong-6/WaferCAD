name: Pages live publication probe
on:
  pull_request:
    paths:
      - '.github/workflows/pages-publication-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    name: Check live Pages revision and deployment queue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, datetime
          repo=os.environ["REPO"]
          root="https://xiaolong-6.github.io/WaferCAD/"
          urls=["build-info.json","app.html","ui-v2/project-mask-panels.js","ui-v2/view-kit/project-export-menu.js","ui-v2/workstation-entry.js"]
          def fetch(url, headers=None):
              req=urllib.request.Request(url,headers=headers or {"Cache-Control":"no-cache","Pragma":"no-cache","User-Agent":"WaferCAD-live-deploy-probe"})
              try:
                  with urllib.request.urlopen(req,timeout=22) as f:
                      data=f.read()
                      return (f.status,dict(f.headers),data)
              except urllib.error.HTTPError as e:
                  return (e.code,dict(e.headers),e.read())
              except Exception as e:
                  return (-1,{},str(e).encode())
          print("PROBE_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
          for path in urls:
              status,headers,data=fetch(root+path+"?probe=20261013-208")
              result={"path":path,"http":status,"bytes":len(data),"cache_control":headers.get("Cache-Control"),"age":headers.get("Age"),"etag":headers.get("ETag")}
              if path=="build-info.json":
                  result["body"]=data.decode("utf8","replace")[:1000]
              if path=="app.html":
                  result["workstation_entry"]=b'ui-v2/workstation-entry.js' in data
              if path.endswith("project-mask-panels.js"):
                  result["contains_projectExportMenuBtn"]=b'projectExportMenuBtn' in data
                  result["contains_mountProjectExportMenu"]=b'mountProjectExportMenu' in data
              if path.endswith("project-export-menu.js"):
                  result["has_export_menu"]=b'mountProjectExportMenu' in data
              print("LIVE_ASSET",json.dumps(result,sort_keys=True))
          api="https://api.github.com/repos/"+repo+"/actions/workflows/pages.yml/runs?branch=main&per_page=12"
          token=os.environ.get("GH_TOKEN","")
          status,_,data=fetch(api,{"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28","User-Agent":"WaferCAD-live-deploy-probe"})
          print("ACTIONS_API_HTTP",status)
          try:
              runs=json.loads(data).get("workflow_runs",[])
              for run in runs:
                  print("PAGES_RUN",json.dumps({k:run.get(k) for k in ("id","head_sha","status","conclusion","created_at","updated_at","html_url")},sort_keys=True))
              if not runs:print("API_DETAIL",data.decode("utf8","replace")[:400])
          except Exception as e:print("API_ERROR",str(e),data.decode("utf8","replace")[:400])
          PY

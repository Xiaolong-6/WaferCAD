name: V2 Workspace Storage Worker scientific regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/workspace-storage-worker-regression.mjs'
      - 'scripts/test-helpers/ui.mjs'
      - 'scripts/process-benchmarks.mjs'
      - 'site/workspace-persistence.js'
      - 'site/workspace-storage-worker.js'
      - 'site/project-io.js'
      - '.github/workflows/v2-workspace-storage-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print canonical formatting diff for migrated test
        run: npx prettier scripts/workspace-storage-worker-regression.mjs | diff -u scripts/workspace-storage-worker-regression.mjs - || true
      - run: npx playwright install --with-deps chromium
      - name: Start production v2 server
        shell: bash
        run: |
          node scripts/v2/serve-v2.mjs > serve-v2.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent --output /dev/null http://127.0.0.1:4182/index.html && exit 0
            sleep 1
          done
          cat serve-v2.log
          exit 1
      - name: Verify 40-step worker packing, lease loss, retry and Recovery
        env:
          WAFERCAD_URL: http://127.0.0.1:4182
        run: node scripts/workspace-storage-worker-regression.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v2-storage-worker-evidence
          path: |
            test-results/native-fig3/workspace-storage-worker.json
            serve-v2.log
          if-no-files-found: ignore
          retention-days: 14

name: Temporary KLayout formatter

on:
  push:
    branches:
      - "fix/klayout-gds-oasis-compat"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Format compatibility files
        run: npx prettier --write scripts/klayout-compat.mjs scripts/klayout-ui-compat.mjs docs/KLAYOUT_LAYOUT_COMPATIBILITY.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/klayout-compat.mjs scripts/klayout-ui-compat.mjs docs/KLAYOUT_LAYOUT_COMPATIBILITY.md
          git commit -m "style: format KLayout compatibility files"
          git push

name: Docking Live Divider One-shot Cleanup

on:
  push:
    branches:
      - fix/desktop-docking-live-divider-20261016
    paths:
      - .github/workflows/docking-live-divider-once.yml

permissions:
  contents: write

jobs:
  format-and-self-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format one acceptance script
        run: npx --no-install prettier --write scripts/v2/check-desktop-docking.mjs
      - name: Remove temporary workflow and commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/docking-live-divider-once.yml
          git add scripts/v2/check-desktop-docking.mjs
          git diff --cached --check
          git commit -m 'style(docking): format targeted browser assertions and retire one-shot job'
          git push origin HEAD:fix/desktop-docking-live-divider-20261016

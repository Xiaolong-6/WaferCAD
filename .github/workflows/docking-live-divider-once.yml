# Targeted rerun: test genuine column/row handle hit targets away from their crossing.
name: Docking Live Divider Visual Check

on:
  push:
    branches:
      - fix/desktop-docking-live-divider-20261016
    paths:
      - .github/workflows/docking-live-divider-once.yml

permissions:
  contents: read

jobs:
  live-divider-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Targeted scientific-state invariant smoke
        run: node --test site/tests/view-layout.test.mjs
      - name: Start actual production workstation
        shell: bash
        run: |
          node scripts/v2/serve-v2.mjs > serve-v2.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent --output /dev/null http://127.0.0.1:4182/app.html && exit 0
            sleep 1
          done
          cat serve-v2.log
          exit 1
      - name: Verify live splitter movement using real Chromium and record screenshots
        env:
          WAFERCAD_V2_BASE: http://127.0.0.1:4182
        run: node scripts/v2/check-desktop-docking.mjs
      - name: Preserve screenshots and error logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-divider-targeted-evidence
          path: |
            test-results/ui-v2-desktop-docking/
            serve-v2.log
          if-no-files-found: ignore
          retention-days: 14

name: T-CMOS #225 integrated Chromium visual/science gate (temporary)

on:
  push:
    branches:
      - integrate/tcmos225-main-20261017
    paths:
      - .github/workflows/tcmos-main-chromium-once.yml

permissions:
  contents: read

jobs:
  integrated-chromium:
    if: github.repository == 'Xiaolong-6/WaferCAD'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install actual Chromium
        run: npx playwright install --with-deps chromium
      - name: Check source SVG, real v2 Main/Mask/3D/Section and 4x4 Recipe Recovery
        timeout-minutes: 25
        env:
          WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
          WAFERCAD_V2_BASE: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          node scripts/build-tcmos-inverter-example.mjs
          node scripts/build-tcmos-inverter-example.mjs --tilt-demo
          node scripts/build-tcmos-array-patch.mjs
          node scripts/build-tcmos-array-recipe-experiment.mjs
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > /tmp/tcmos-integrated-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          node scripts/tcmos-svg-mask-browser-acceptance.mjs
          node scripts/tcmos-browser-acceptance.mjs
          node scripts/tcmos-array-browser-acceptance.mjs
          node scripts/tcmos-array-recipe-browser-acceptance.mjs
      - name: Upload real Chromium screenshots and scientific material parity reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tcmos225-integrated-real-chromium
          path: |
            test-results/tcmos/
            test-results/tcmos-svg-mask/
          retention-days: 14
          if-no-files-found: ignore

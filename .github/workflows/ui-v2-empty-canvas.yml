name: UI v2 empty canvas focused acceptance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'site/ui-v2/view-kit/empty-state.js'
      - 'site/ui-v2/view-kit/plan-stage.css'
      - 'site/ui-v2/main-view.js'
      - 'site/ui-v2/mask-view.js'
      - 'site/ui-v2/desktop-shell.css'
      - 'site/ui-v2/tokens.css'
      - 'site/model.js'
      - 'site/plan-grid.js'
      - 'site/plan-renderers.js'
      - 'scripts/v2/check-empty-canvas-hints.mjs'
      - '.github/workflows/ui-v2-empty-canvas.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-v2-empty-canvas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Empty Main/Mask/Section visual and actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify legacy ROI contract and MAGIC-1000 saved-project fidelity
        run: node --test site/tests/function-panel-feedback.test.mjs site/tests/magic1000-reconstruction.test.mjs
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.1
      - run: npx playwright install --with-deps chromium
      - name: Check empty-stage actions and capture real browser screenshots
        run: node scripts/v2/check-empty-canvas-hints.mjs
      - name: Preserve actual screenshot evidence and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: empty-canvas-${{ github.sha }}
          path: test-results/empty-canvas-hints/
          retention-days: 7
          if-no-files-found: warn

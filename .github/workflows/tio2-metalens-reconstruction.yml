name: TiO2 metalens reconstruction acceptance

on:
  pull_request:
    paths:
      - 'scripts/build-tio2-metalens-example.mjs'
      - 'site/tests/tio2-metalens-reconstruction.test.mjs'
      - '.github/workflows/tio2-metalens-reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture canonical formatting for review (temporary)
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import prettier from 'prettier';
          const paths=["site/tests/tio2-metalens-reconstruction.test.mjs","site/tests/wiki-manual.test.mjs","scripts/build-tio2-metalens-example.mjs","scripts/tio2-metalens-ui-regression.mjs","docs/TIO2_METALENS_RECONSTRUCTION_2026-10-09.md"];
          for(const path of paths){
          const content=await readFile(path,'utf8');
          const config=(await prettier.resolveConfig(path))||{};
          const fmt=await prettier.format(content,{...config,filepath:path});
          if(content===fmt) continue;
          const base=Buffer.from(fmt,'utf8').toString('base64');
          const chunks=base.match(/.{1,2400}/g)||[];
          for(let i=0;i<chunks.length;i++)console.log('WAFERFMT|'+encodeURIComponent(path)+'|'+i+'|'+chunks.length+'|'+chunks[i]);
          }
          NODE
      - name: Rebuild source-derived four-unit process and 4725-site illustrative GDS
        run: node scripts/build-tio2-metalens-example.mjs
      - name: Install Chromium for real Recipe Run All
        run: npx playwright install --with-deps chromium
      - name: Start WaferCAD
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-metalens-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/app.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wafercad-metalens-http.log
          exit 1
      - name: Real browser Recipe Run All and geometry/export acceptance
        env:
          WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
        run: node scripts/tio2-metalens-ui-regression.mjs
      - name: Build exact production Welcome preview
        run: |
          node scripts/build-example-previews.mjs --write --id=tio2-metalens-four-unit
          cp site/examples/previews/tio2-metalens-four-unit.wafercad test-results/metalens/
      - name: Upload explicit-provenance reconstruction artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tio2-metalens-source-derived-${{ github.sha }}
          path: test-results/metalens
          retention-days: 21
          if-no-files-found: warn

name: TiO2 metalens reconstruction acceptance

on:
  pull_request:
    paths:
      - 'site/bundled-examples.js'
      - 'site/examples/tio2-metalens-full-array.wafercad'
      - 'scripts/tio2-metalens-ui-regression.mjs'
      - 'scripts/v2/check-metalens-recipe-science.mjs'
      - 'scripts/build-tio2-metalens-example.mjs'
      - 'site/tests/tio2-metalens-reconstruction.test.mjs'
      - 'scripts/tio2-metalens-array-scale.mjs'
      - 'scripts/tio2-metalens-grid-browser.mjs'
      - 'site/process-recipe-preflight.js'
      - 'site/process-recipe.js'
      - 'site/controllers/base-controls-controller.js'
      - 'site/model-array-construction.js'
      - '.github/workflows/tio2-metalens-reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tio2-metalens-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Probe scale-safe array templates at 8x8 and 25x25
        run: |
          node scripts/tio2-metalens-array-scale.mjs --grid=8
          node scripts/tio2-metalens-array-scale.mjs --grid=25
      - name: Probe 4725 processed sites in bounded complete 80x80 array
        timeout-minutes: 10
        run: |
          node scripts/tio2-metalens-array-scale.mjs --grid=80 --write-example
          git diff --exit-code -- site/examples/tio2-metalens-full-array.wafercad
      - name: Rebuild source-derived four-unit process and 4725-site illustrative GDS
        run: node scripts/build-tio2-metalens-example.mjs
      - name: Install Chromium for real Recipe Run All
        run: npx playwright install --with-deps chromium
      - name: Start real production v2 Workstation
        run: |
          node scripts/v2/serve-v2.mjs > serve-v2.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4182/app.html; then exit 0; fi
            sleep 1
          done
          cat serve-v2.log
          exit 1
      # #290 retired the Legacy editor. The canonical v2 oracle exercises
      # all 4,725 device sites, 9 Recipe steps, each intermediate History
      # model, full Mask geometry, project Export/Reopen and real Main/Mask.
      - name: Real v2 4725-site nine-Step science and visual acceptance
        timeout-minutes: 25
        env:
          WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
        run: node scripts/v2/check-metalens-recipe-science.mjs
      - name: Build exact production Welcome preview
        run: |
          node scripts/build-example-previews.mjs --write --id=tio2-metalens-four-unit
          cp site/examples/previews/tio2-metalens-four-unit.wafercad test-results/metalens/
      - name: Upload explicit-provenance reconstruction artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tio2-metalens-source-derived-${{ github.sha }}
          path: |
            test-results/metalens
            test-results/v2-metalens-science
          retention-days: 21
          if-no-files-found: warn

  full-grid-replay:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start WaferCAD for exact GRID replay
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-full-grid.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/app.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wafercad-full-grid.log
          exit 1
      - name: Actual 4725-site Recipe Run All from Base
        timeout-minutes: 20
        env:
          WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
        run: node scripts/example-recipe-runall-acceptance.mjs --id=tio2-metalens-four-unit
      - name: Retain GRID replay diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: metalens-full-grid-replay-${{ github.sha }}
          path: test-results/example-recipe-runall
          retention-days: 14
          if-no-files-found: warn

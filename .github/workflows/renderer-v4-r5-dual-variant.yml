name: Renderer V4 R5 dual-variant cache

on:
  push:
    branches:
      - perf/renderer-v4-adaptive-tiles-20261010
    paths:
      - site/three-view.js
      - site/renderer-v4-resource-lifetime.js
      - scripts/renderer-v4-r5-dual-variant-browser.mjs
      - .github/workflows/renderer-v4-r5-dual-variant.yml

permissions:
  contents: read

concurrency:
  group: renderer-v4-r5-dual-variant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dual-variant:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static WaferCAD server
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-r5-dual-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/app.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wafercad-r5-dual-http.log
          exit 1
      - name: True 625-site opaque/transparent cache switching
        run: node scripts/renderer-v4-r5-dual-variant-browser.mjs
      - name: Preserve dual-variant resource evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: renderer-v4-r5-dual-variant
          path: test-results/renderer-v4-r5-dual-variant/
          if-no-files-found: warn
          retention-days: 14

name: M3D conformal baseline audit

on:
  pull_request:
    branches:
      - main
    paths:
      - "site/model.js"
      - "site/app.html"
      - "site/controllers/process-panel-controller.js"
      - "docs/wiki/**"
  workflow_dispatch:

concurrency:
  group: m3d-conformal-baseline-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scientific-baseline:
    name: Scientific ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: original-main
            source: bad705c406ebb57a84f3a0ac66340b63e92bcf0c
          - variant: integrated-review
            source: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.source }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Geometry, M3D and persistence baseline
        run: |
          node --test \
            site/tests/conformal-process.test.mjs \
            site/tests/process-topology.test.mjs \
            site/tests/process-benchmarks.test.mjs \
            site/tests/material-boundaries.test.mjs \
            site/tests/m3d-reconstruction-regression.test.mjs \
            site/tests/m3d-bundled-example.test.mjs \
            site/tests/m3d-persistence-roundtrip.test.mjs

  approved-windows-visual-baseline:
    name: Native v2 M3D Section / historical layout / ${{ matrix.variant }}
    needs: scientific-baseline
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: original-main
            source: bad705c406ebb57a84f3a0ac66340b63e92bcf0c
          - variant: integrated-review
            source: ${{ github.event.pull_request.head.sha || github.sha }}
    env:
      WAFERCAD_VISUAL_BASELINE_DIR: tests/visual-baselines/windows-chromium
      WAFERCAD_THREE_DIR: ${{ github.workspace }}\node_modules\three
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.source }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Start preview server
        shell: pwsh
        run: |
          Start-Process -FilePath python -ArgumentList @('-m', 'http.server', '4173', '--bind', '127.0.0.1', '--directory', 'site') -PassThru | Out-Null
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $response = Invoke-WebRequest 'http://127.0.0.1:4173/app.html' -UseBasicParsing -TimeoutSec 3
              if ($response.StatusCode -eq 200) { $ready = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { throw 'WaferCAD localhost preview did not start.' }
      - name: Compare historical 2026-10-05 visual snapshots (diagnostic)
        if: matrix.variant == 'original-main'
        id: historical
        continue-on-error: true
        run: node scripts/visual-baseline-regression.mjs
      # Main retired app-legacy.html. The historical product-layout runner
      # can only boot the frozen original-main source. On the integrated
      # candidate, exercise the real v2 Workstation with two independent A-B
      # cuts, actual rendered Section canvases, and physical material probes.
      # Never recreate the retired Legacy page or suppress a native failure.
      - name: Enforce native v2 M3D power-via Section and material contracts
        if: matrix.variant == 'integrated-review'
        run: node scripts/v2/check-m3d-second-power-via-section.mjs
      - name: Record historical drift without hiding it
        if: always()
        shell: pwsh
        run: |
          "Historical Oct-05 snapshot outcome (${{ matrix.variant }}): ${{ steps.historical.outcome }}" >> $env:GITHUB_STEP_SUMMARY
          "Original-main keeps the frozen Legacy baseline; integrated-review runs native v2 M3D geometry and Section screenshots because Main retired app-legacy.html. Do not rebaseline historical pixels." >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-m3d-native-or-historical-${{ matrix.variant }}
          path: |
            test-results/visual-diff
            test-results/literature-figure-cuts/native-v2-m3d
          if-no-files-found: warn

name: Renderer V4 current-main UI v2 / Legacy compatibility

on:
  push:
    branches:
      - perf/renderer-v4-adaptive-tiles-20261010
    paths:
      - site/three-view.js
      - site/ui-v2/workstation-workflow.js
      - site/controllers/process-panel-controller.js
      - site/controllers/process-recipe-controller.js
      - scripts/v2/check-manual-both.mjs
      - scripts/v2/check-m4-projects.mjs
      - .github/workflows/ui-v2-stage-c-m4.yml
      - site/renderer-capture-transaction.js
      - site/tests/renderer-workstation-route.test.mjs
      - scripts/renderer-v4-*.mjs
      - scripts/renderer-electrical-*.mjs
      - scripts/renderer-quality-index-ab.mjs
      - scripts/renderer-roi-*.mjs
      - scripts/test-helpers/renderer-workstation-route.mjs
      - scripts/test-helpers/renderer-hardware-site.mjs
      - scripts/renderer-hardware-http-smoke.mjs
      - scripts/renderer-v4-pr177-default-smoke.mjs
      - .github/workflows/renderer-v4-pr177-compat.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderer-pr177-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-merged-worktree:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Build actual integration tree without modifying either PR or main
        run: |
          git fetch origin main
          git config user.name "WaferCAD CI Integration"
          git config user.email "ci@wafercad.invalid"
          # PR177 and Renderer changed the same gesture/Legacy browser
          # hunks independently. Only these audited overlaps may prefer our
          # equivalent implementation; every other conflict remains fatal.
          if ! git merge --no-commit --no-ff origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -gt 0
            for file in "${conflicts[@]}"; do
              case "$file" in
                site/three-view.js|scripts/array-renderer-edge-on-regression.mjs|scripts/array-renderer-regression.mjs|scripts/renderer-pipeline-benchmark.mjs)
                  git checkout --ours -- "$file"
                  git add -- "$file"
                  ;;
                *)
                  echo "Unreviewed main integration conflict: $file" >&2
                  exit 1
                  ;;
              esac
            done
            test -z "$(git diff --name-only --diff-filter=U)"
          fi
          test -f site/app-legacy.html
          grep -q 'data-ui="v2"' site/app.html
          grep -q 'function setGestureMode' site/three-view.js
          grep -q 'rendererWorkstationUrl' scripts/array-renderer-regression.mjs
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Route, lifecycle and scientific DOM contracts
        run: node --test site/tests/renderer-workstation-route.test.mjs site/tests/renderer-capture-transaction.test.mjs site/tests/renderer-v4-resource-lifetime.test.mjs
      - name: Real UI v2 Manual Both, 3D gestures and retained Legacy renderer
        env:
          WAFERCAD_URL: http://127.0.0.1:4182
          WAFERCAD_V2_BASE: http://127.0.0.1:4182
          WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
        run: |
          node scripts/v2/serve-v2.mjs > /tmp/wafercad-v2-serve.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4182/app.html > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4182/app-legacy.html > /dev/null
          node scripts/renderer-v4-pr177-default-smoke.mjs
          node scripts/v2/check-manual-both.mjs
          WAFERCAD_V2_EXAMPLE=photodetector node scripts/v2/check-three-view.mjs
          node scripts/renderer-v4-r2-browser.mjs
      - name: Upload non-baseline integration evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-v4-pr177-compat
          path: |
            test-results/ui-v2-three-review*
            test-results/ui-v2-manual-both/
            test-results/renderer-v4-r2
          if-no-files-found: ignore

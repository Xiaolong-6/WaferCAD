name: Product manual and Wiki sync

# Intentionally runs on EVERY main push, regardless of changed paths.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-manual-wiki
  cancel-in-progress: false

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tracked documentation
        uses: actions/checkout@v6

        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify generated manual and diagrams
        run: |
          node scripts/build-process-guide.mjs --check
          node --test site/tests/process-guide.test.mjs

      - name: Detect possible product manual drift
        env:
          PREVIOUS_MAIN_SHA: ${{ github.event.before }}
        run: node scripts/check-wiki-change-coverage.mjs

      - name: Compare and synchronize managed Wiki pages
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 -w 0)"
          echo "::add-mask::$auth"

          target="$RUNNER_TEMP/wafercad-product-wiki"
          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            clone --depth=1 "https://github.com/${GITHUB_REPOSITORY}.wiki.git" "$target"; then
            echo "::error title=Wiki sync could not clone::Enable and initialize the GitHub Wiki (create Home once). If the workflow token cannot push, configure a WIKI_PUSH_TOKEN secret with Wiki write access."
            exit 1
          fi
          cd "$target"

          # Remove only pages previously generated by this workflow.
          if [[ -f .wafercad-wiki-managed ]]; then
            while IFS= read -r old; do
              [[ -z "$old" ]] && continue
              if [[ "$old" == */* || "$old" == *..* ]]; then
                echo "::error::Unsafe managed wiki manifest entry: $old"
                exit 1
              fi
              if [[ ! -f "$GITHUB_WORKSPACE/docs/wiki/$old" ]]; then
                git rm -f --ignore-unmatch -- "$old"
              fi
            done < .wafercad-wiki-managed
          fi

          : > .wafercad-wiki-managed
          for source in "$GITHUB_WORKSPACE"/docs/wiki/*.md; do
            name="$(basename "$source")"
            cp "$source" "$name"
            printf '%s\n' "$name" >> .wafercad-wiki-managed
            git add -- "$name"
          done
          git add -- .wafercad-wiki-managed

          if git diff --cached --quiet; then
            echo "Wiki is already up to date: no commit necessary."
            exit 0
          fi

          git config user.name "wafercad-docs-bot"
          git config user.email "wafercad-docs-bot@users.noreply.github.com"
          git commit -m "docs: synchronize WaferCAD product manual from main ${GITHUB_SHA:0:12}"
          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD; then
            echo "::error title=Wiki sync push failed::Configure repository secret WIKI_PUSH_TOKEN with write permission for the GitHub Wiki repository."
            exit 1
          fi
          echo "Published updated product manual to GitHub Wiki."

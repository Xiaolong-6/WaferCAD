name: M3D branch validation

on:
  push:
    branches:
      - fix/m3d-transfer-conformal-mask-regression

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Node regressions
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start WaferCAD
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wafercad-http.log
          exit 1
      - name: Process geometry and project I/O regressions
        run: npm run test:ui:process

name: Renderer V4 R6 full-wafer context parity

on:
  push:
    branches:
      - perf/renderer-v4-adaptive-tiles-20261010
    paths:
      - site/three-view.js
      - site/renderer-v4-resource-lifetime.js
      - scripts/renderer-v4-r6-full-wafer-browser.mjs
      - .github/workflows/renderer-v4-r6-full-wafer.yml

permissions:
  contents: read

concurrency:
  group: renderer-v4-r6-full-wafer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-wafer-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static WaferCAD
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-r6-full.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/app.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wafercad-r6-full.log
          exit 1
      - name: Full-wafer two-context strict pixel and CPU ownership gate
        run: node scripts/renderer-v4-r6-full-wafer-browser.mjs
      - name: Retain recovery evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: renderer-v4-r6-full-wafer
          path: test-results/renderer-v4-r6-full-wafer/
          if-no-files-found: warn
          retention-days: 14

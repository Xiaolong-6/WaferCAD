name: Quality

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "THIRD_PARTY_NOTICES.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install development tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint and tests
        run: npm run check:ci

      # Temporary PR-only formatter diagnostic; remove after reviewing log.
      - name: Show precise formatter diff
        if: always()
        run: |
          npx prettier --write site/controllers/process-recipe-controller.js docs/MAIN_P0_P1_STABILITY_2026-10-08.md
          git diff -- site/controllers/process-recipe-controller.js docs/MAIN_P0_P1_STABILITY_2026-10-08.md

name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install development tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Keep the stable Quality job/check name for branch protection. Drafts run
      # the structural fast gate; complete Node coverage returns at final review.
      - name: Draft lint, formatting and generated-document contracts
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          npm run lint
          npm run format:check
          npm run docs:check
          node --test site/tests/ci-test-plan.test.mjs site/tests/ci-development-gates.test.mjs

      - name: Final lint, formatting, generated documentation and Node tests
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
        run: npm run check

name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/experimental-implant-structure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install development tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint and tests
        run: npm run check:ci

name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install development tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint, formatting, generated documentation and Node tests
        run: npm run check

      - name: Print exact PR250 canonical formatting diff
        if: failure()
        run: |
          files=(site/gpu-rough-surface.js site/three-view.js scripts/pr250-renderer-audit.mjs scripts/renderer-product-cases.mjs scripts/test-helpers/pr250-gpu-height-oracle.mjs)
          for file in "${files[@]}"; do
            cp "$file" /tmp/pr250-prettier-original
            npx prettier --write "$file"
            echo "PR250_DIFF_BEGIN:$file"
            diff -u /tmp/pr250-prettier-original "$file" || true
            echo "PR250_DIFF_END:$file"
          done

name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install development tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint, formatting, generated documentation and Node tests
        run: npm run check

      - name: Print canonical Prettier files for diagnostics
        if: failure()
        run: |
          npx prettier --write site/three-outline-geometry.js site/tests/three-outline-geometry.test.mjs
          for file in site/three-outline-geometry.js site/tests/three-outline-geometry.test.mjs; do
            echo "PRETTIER_BEGIN:${file}"
            base64 -w0 "${file}"
            echo
            echo "PRETTIER_END:${file}"
          done

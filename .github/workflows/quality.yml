name: Quality

on:
  push:
    branches:
      - main
      - "chore/**"
      - "fix/**"
      - "rewrite/**"
      - "merge/**"
      - "feat/issue-13-settings-tooltips"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install development tools
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Prettier preview
        run: |
          npx prettier --write site/index.html site/tests/issue-13-settings-ui.test.mjs
          git diff -- site/index.html site/tests/issue-13-settings-ui.test.mjs

      - name: Format check
        run: npm run format:check

      - name: Geometry and project-format tests
        run: npm test

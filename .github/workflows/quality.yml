name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install development tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Print API audit formatting diff (temporary)
        run: |
          for path in site/tests/site-export-api-review.test.mjs docs/SITE_EXPORT_API_REVIEW_2026-10-13.md; do
            npx prettier "$path" > /tmp/api-audit-formatted
            diff -u "$path" /tmp/api-audit-formatted || true
          done

      - name: Lint, formatting, generated documentation and Node tests
        run: npm run check

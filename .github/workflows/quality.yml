name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install development tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint, formatting, generated documentation and Node tests
        run: npm run check


      - name: Print exact stochastic display-LOD formatting diff
        if: failure()
        run: |
          for path in site/surface-rendering.js site/rough-mesh-geometry.js site/gpu-rough-surface.js site/three-view.js site/tests/rough-display-lod.test.mjs site/tests/rough-mesh-geometry.test.mjs scripts/pr250-renderer-audit.mjs; do
            cp "$path" /tmp/pr250-original.js
            npx prettier --write "$path"
            echo "LOD_FORMAT_BEGIN:$path"
            diff -u /tmp/pr250-original.js "$path" || true
            echo "LOD_FORMAT_END:$path"
          done

name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install development tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Temporary P1 border formatting diff
        if: github.event.pull_request.number == 188
        run: |
          npx prettier --write site/renderer-border-position-clip.js site/tests/renderer-border-position-clip.test.mjs
          git diff -- site/renderer-border-position-clip.js site/tests/renderer-border-position-clip.test.mjs

      - name: Lint, formatting, generated documentation and Node tests
        run: npm run check

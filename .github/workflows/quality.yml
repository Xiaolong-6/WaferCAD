name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default PR checkout is the proposed merge tree. Source-bound evidence
      # must cover that integrated content, not only an outdated branch head.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Require Draft local Quality evidence
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: node scripts/local-verification.mjs verify draft

      - name: Require full local Quality evidence
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
        run: node scripts/local-verification.mjs verify full

name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install development tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Keep the stable Quality job/check name for branch protection. Drafts run
      # the structural fast gate; complete Node coverage returns at final review.
      - name: Draft lint, formatting and generated-document contracts
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.pull_request.number != 290 }}
        run: |
          set -euo pipefail
          npm run lint
          npm run format:check
          npm run docs:check
          node --test site/tests/ci-test-plan.test.mjs site/tests/ci-development-gates.test.mjs

      - name: Final lint, formatting, generated documentation and Node tests
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft || github.event.pull_request.number == 290 }}
        run: npm run check

      # Non-mutating PR290 diagnostics. The required Quality check still fails
      # until the formatted contents are committed and reviewed on the branch.
      - name: Report exact Prettier suggestions for source-retirement files
        if: ${{ failure() && github.event_name == 'pull_request' && github.event.pull_request.number == 290 }}
        run: |
          files=(
            site/tests/source-sunset-draw-process-owner.test.mjs
            scripts/v2/check-source-sunset-draw-process.mjs
            scripts/v2/check-source-sunset-edge-on.mjs
            scripts/v2/check-source-sunset-release-owners.mjs
            scripts/v2/check-source-sunset-renderer-stress.mjs
            docs/LEGACY_SOURCE_SUNSET.md
          )
          npx prettier --write "${files[@]}"
          node -e 'const fs=require("node:fs"); for(const f of process.argv.slice(1)) console.log("PR290_FORMAT_FILE:"+f+":"+JSON.stringify(fs.readFileSync(f,"utf8")));' "${files[@]}"

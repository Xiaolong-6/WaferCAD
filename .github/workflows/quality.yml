name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install development tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint, formatting, generated documentation and Node tests
        run: npm run check

      # Temporary, report-scoped formatting diagnostics. Remove after P1 is formatted.
      - name: Show report formatting diff on check failure
        if: failure()
        run: |
          npx prettier --write site/tests/process-report.test.mjs scripts/v2/check-report-export.mjs
          git diff -- site/tests/process-report.test.mjs scripts/v2/check-report-export.mjs

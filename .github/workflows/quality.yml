name: Quality

on:
  workflow_call:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # The default PR checkout is the proposed merge tree. Test precisely that tree.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # On PR, missing/stale proof FAILS CLOSED (no expensive automatic fallback).
      # Nightly intentionally runs the real full checks, regardless of proof.
      - name: Probe source-bound local Quality evidence
        id: evidence
        continue-on-error: true
        env:
          QUALITY_SCOPE: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft' || 'full' }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "Nightly executes full tests, not just existing proof"
            exit 0
          fi
          node scripts/local-verification.mjs verify "$QUALITY_SCOPE"

      - name: Reject missing or stale PR proof before remote tests
        if: ${{ github.event_name == 'pull_request' && steps.evidence.outcome != 'success' }}
        shell: bash
        run: |
          echo '::error::Missing or stale source-bound local verification. Run locally and commit its receipt; CI will not repeat your tests.'
          exit 1

      # Strict second verification is named for the fast-release provenance gate.
      # Never give a tolerated probe the 'Require full' step name.
      - name: Require full local Quality evidence
        if: ${{ steps.evidence.outcome == 'success' && github.event_name == 'pull_request' && !github.event.pull_request.draft }}
        run: node scripts/local-verification.mjs verify full

      - name: Install locked dependencies only for missing or stale evidence
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Nightly always executes full lint, formatting, docs and Node tests.
      # This exact name is recognized by the fast-release provenance gate.
      - name: Final lint, formatting, generated documentation and Node tests
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: npm run check

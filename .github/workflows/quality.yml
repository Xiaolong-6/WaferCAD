name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install development tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Prettier preview
        run: |
          npx prettier --write site/tests/issue-11-3d-controls.test.mjs site/tests/project-file.test.mjs scripts/ui-smoke.mjs docs/DEVELOPMENT.md
          git diff -- site/tests/issue-11-3d-controls.test.mjs site/tests/project-file.test.mjs scripts/ui-smoke.mjs docs/DEVELOPMENT.md

      - name: Format check
        run: npm run format:check

      - name: Geometry and project-format tests
        run: npm test

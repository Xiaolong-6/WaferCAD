name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install development tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Format check
        run: |
          if ! npm run format:check; then
            npx prettier --write site/controllers/view-maximize-controller.js site/style.css site/tests/controllers.test.mjs
            git diff -- site/controllers/view-maximize-controller.js site/style.css site/tests/controllers.test.mjs
            exit 1
          fi

      - name: Geometry and project-format tests
        run: npm test

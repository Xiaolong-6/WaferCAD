name: Quality

on:
  push:
    branches:
      - main
      - "chore/**"
      - "fix/**"
      - "rewrite/**"
      - "merge/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install development tools
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Prettier preview
        run: |
          npx prettier --write site/app.js site/index.html site/roi-editor.js site/style.css site/tests/roi-editor.test.mjs
          git diff -- site/app.js site/index.html site/roi-editor.js site/style.css site/tests/roi-editor.test.mjs

      - name: Format check
        run: npm run format:check

      - name: Geometry and project-format tests
        run: npm test

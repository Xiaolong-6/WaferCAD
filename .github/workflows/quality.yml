name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install development tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint, formatting, generated documentation and Node tests
        run: npm run check

      # Temporary PR-only diagnostic, removed after applying exact formatter output.
      - name: Show exact Markdown formatter diff after Quality failure
        if: failure()
        run: |
          npx prettier --write docs/EXAMPLE_LITERATURE_FIDELITY_2026-10-14.md
          git diff -- docs/EXAMPLE_LITERATURE_FIDELITY_2026-10-14.md

name: Quality

on:
  workflow_call:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # The default PR checkout is the proposed merge tree. Test precisely that tree.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # On PR, missing/stale proof FAILS CLOSED (no expensive automatic fallback).
      # Nightly intentionally runs the real full checks, regardless of proof.
      - name: Probe source-bound local Quality evidence
        id: evidence
        continue-on-error: true
        env:
          QUALITY_SCOPE: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft' || 'full' }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "Nightly executes full tests, not just existing proof"
            exit 0
          fi
          node scripts/local-verification.mjs verify "$QUALITY_SCOPE"

      # A missing receipt may use incremental Quality ONLY when the exact main
      # parent has independently verifiable full proof and every changed path
      # has an explicit ownership rule. Unknown/critical changes fail closed.
      - name: Verify exact main baseline and incremental diff eligibility
        id: incremental_base
        if: ${{ github.event_name == 'pull_request' && steps.evidence.outcome != 'success' }}
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/incremental-quality.mjs plan "$BASE_SHA" "$HEAD_SHA"
          base_dir="$(mktemp -d)"
          git worktree add --detach "$base_dir" "$BASE_SHA"
          node "$base_dir/scripts/local-verification.mjs" verify full
          git worktree remove --force "$base_dir"

      - name: Install locked dependencies for incremental Quality
        if: ${{ github.event_name == 'pull_request' && steps.incremental_base.outcome == 'success' }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run exact-diff Quality and owning Node contracts
        id: incremental_checks
        if: ${{ github.event_name == 'pull_request' && steps.incremental_base.outcome == 'success' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/incremental-quality.mjs run "$BASE_SHA" "$HEAD_SHA"

      - name: Reject missing or stale PR proof before remote tests
        if: ${{ github.event_name == 'pull_request' && steps.evidence.outcome != 'success' && steps.incremental_checks.outcome != 'success' }}
        shell: bash
        run: |
          echo '::error::Neither source-bound Quality receipt nor verified-base incremental Quality passed.'
          exit 1

      # Strict second verification is named for the fast-release provenance gate.
      # Never give a tolerated probe the 'Require full' step name.
      - name: Require full local Quality evidence
        if: ${{ steps.evidence.outcome == 'success' && github.event_name == 'pull_request' && !github.event.pull_request.draft }}
        run: node scripts/local-verification.mjs verify full

      - name: Install locked dependencies only for missing or stale evidence
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Nightly always executes full lint, formatting, docs and Node tests.
      # This exact name is recognized by the fast-release provenance gate.
      - name: Final lint, formatting, generated documentation and Node tests
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: npm run check

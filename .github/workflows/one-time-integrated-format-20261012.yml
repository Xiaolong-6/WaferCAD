name: One-time integrated premerge formatting
on:
  push:
    branches:
      - ui/human-review-2026-10-12
    paths:
      - .github/workflows/one-time-integrated-format-20261012.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply canonical Prettier formatting
        run: npm run format
      - name: Verify formatting
        run: npm run format:check
      - name: Commit formatted files to integrated branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: format integrated docs and UI for premerge quality gate"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

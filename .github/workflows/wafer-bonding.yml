name: Wafer bonding targeted science

on:
  pull_request:
    branches:
      - feat/example-gan-hemt-microchannel-20261014
    paths:
      - site/wafer-bonding.js
      - site/wafer-assembly.js
      - site/wafer-bond-transaction.js
      - site/wafer-assembly-history.js
      - site/wafer-assembly-history-session.js
      - site/wafer-assembly-editor-session.js
      - site/wafer-assembly-variants.js
      - site/wafer-assembly-postbond-process.js
      - site/wafer-assembly-draft-recovery.js
      - site/project-schema.js
      - site/project-io.js
      - site/workspace-persistence.js
      - site/controllers/project-state-controller.js
      - site/ui-v2/assembly-preview.js
      - site/ui-v2/assembly-bond-draft.js
      - site/ui-v2/workstation-entry.js
      - site/ui-v2/workstation-runtime.js
      - site/ui-v2/workstation-preview.css
      - site/tests/wafer-bonding.test.mjs
      - site/tests/wafer-assembly.test.mjs
      - site/tests/wafer-bond-transaction.test.mjs
      - site/tests/wafer-assembly-history.test.mjs
      - site/tests/wafer-assembly-history-session.test.mjs
      - site/tests/wafer-assembly-editor-session.test.mjs
      - site/tests/wafer-assembly-variants.test.mjs
      - site/tests/wafer-assembly-postbond-process.test.mjs
      - site/tests/wafer-assembly-durable-workspace.test.mjs
      - site/tests/wafer-assembly-native-preview.test.mjs
      - scripts/v2/check-assembly-bond-draft.mjs
      - site/tests/wafer-bonding-gan-two-wafer.test.mjs
      - site/tests/wafer-assembly-io.test.mjs
      - site/tests/wafer-assembly-editor-guard.test.mjs
      - site/tests/wafer-assembly-state-owner.test.mjs
      - site/tests/project-geometry-storage.test.mjs
      - docs/MULTI_WAFER_BONDING_DESIGN_2026-10-15.md
      - .github/workflows/wafer-bonding.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wafer-bonding-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  bonding-science:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Bond geometry scientific invariants
        run: node --test site/tests/wafer-bonding.test.mjs site/tests/wafer-assembly.test.mjs site/tests/wafer-bond-transaction.test.mjs site/tests/wafer-assembly-history.test.mjs site/tests/wafer-assembly-history-session.test.mjs site/tests/wafer-assembly-editor-session.test.mjs site/tests/wafer-assembly-variants.test.mjs site/tests/wafer-assembly-postbond-process.test.mjs site/tests/wafer-assembly-durable-workspace.test.mjs site/tests/wafer-assembly-native-preview.test.mjs site/tests/wafer-bonding-gan-two-wafer.test.mjs site/tests/wafer-assembly-io.test.mjs site/tests/project-geometry-storage.test.mjs site/tests/issue-13-settings-ui.test.mjs site/tests/wafer-assembly-editor-guard.test.mjs site/tests/wafer-assembly-state-owner.test.mjs site/tests/project-controller-recovery.test.mjs
      - name: Bond-specific lint and formatting
        run: |
          npx eslint site/controllers/project-state-controller.js site/tests/wafer-assembly-editor-guard.test.mjs site/tests/wafer-assembly-state-owner.test.mjs site/workspace-persistence.js site/wafer-bonding.js site/wafer-assembly.js site/wafer-bond-transaction.js site/wafer-assembly-history.js site/wafer-assembly-history-session.js site/wafer-assembly-editor-session.js site/wafer-assembly-variants.js site/wafer-assembly-postbond-process.js site/tests/wafer-bond-transaction.test.mjs site/tests/wafer-assembly-history.test.mjs site/tests/wafer-assembly-history-session.test.mjs site/tests/wafer-assembly-editor-session.test.mjs site/tests/wafer-assembly-variants.test.mjs site/tests/wafer-assembly-postbond-process.test.mjs site/tests/wafer-assembly-durable-workspace.test.mjs site/tests/wafer-assembly-native-preview.test.mjs site/ui-v2/assembly-preview.js site/ui-v2/assembly-bond-draft.js site/wafer-assembly-draft-recovery.js site/ui-v2/workstation-entry.js site/ui-v2/workstation-runtime.js scripts/v2/check-assembly-preview.mjs scripts/v2/check-assembly-bond-draft.mjs site/project-schema.js site/project-io.js site/tests/wafer-bonding.test.mjs site/tests/wafer-assembly.test.mjs site/tests/wafer-bonding-gan-two-wafer.test.mjs site/tests/wafer-assembly-io.test.mjs
          npx prettier --check site/controllers/project-state-controller.js site/tests/wafer-assembly-editor-guard.test.mjs site/tests/wafer-assembly-state-owner.test.mjs site/workspace-persistence.js site/wafer-bonding.js site/wafer-assembly.js site/wafer-bond-transaction.js site/wafer-assembly-history.js site/wafer-assembly-history-session.js site/wafer-assembly-editor-session.js site/wafer-assembly-variants.js site/wafer-assembly-postbond-process.js site/tests/wafer-bond-transaction.test.mjs site/tests/wafer-assembly-history.test.mjs site/tests/wafer-assembly-history-session.test.mjs site/tests/wafer-assembly-editor-session.test.mjs site/tests/wafer-assembly-variants.test.mjs site/tests/wafer-assembly-postbond-process.test.mjs site/tests/wafer-assembly-durable-workspace.test.mjs site/tests/wafer-assembly-native-preview.test.mjs site/ui-v2/assembly-preview.js site/ui-v2/assembly-bond-draft.js site/wafer-assembly-draft-recovery.js site/ui-v2/workstation-entry.js site/ui-v2/workstation-runtime.js scripts/v2/check-assembly-preview.mjs scripts/v2/check-assembly-bond-draft.mjs site/project-schema.js site/project-io.js site/tests/wafer-bonding.test.mjs site/tests/wafer-assembly.test.mjs site/tests/wafer-bonding-gan-two-wafer.test.mjs site/tests/wafer-assembly-io.test.mjs docs/MULTI_WAFER_BONDING_DESIGN_2026-10-15.md site/ui-v2/workstation-preview.css
      - name: One-shot Main sync formatter differences
        if: failure()
        run: |
          for path in site/controllers/project-state-controller.js site/workspace-persistence.js docs/GAN_HEMT_MICROCHANNEL_RECONSTRUCTION_2026-10-14.md; do
            npx prettier "$path" | diff -u "$path" - || true
          done

name: Wafer bonding targeted science

on:
  pull_request:
    branches:
      - feat/example-gan-hemt-microchannel-20261014
    paths:
      - site/wafer-bonding.js
      - site/wafer-assembly.js
      - site/project-schema.js
      - site/project-io.js
      - site/workspace-persistence.js
      - site/controllers/project-state-controller.js
      - site/tests/wafer-bonding.test.mjs
      - site/tests/wafer-assembly.test.mjs
      - site/tests/wafer-bonding-gan-two-wafer.test.mjs
      - site/tests/wafer-assembly-io.test.mjs
      - site/tests/wafer-assembly-editor-guard.test.mjs
      - site/tests/project-geometry-storage.test.mjs
      - docs/MULTI_WAFER_BONDING_DESIGN_2026-10-15.md
      - .github/workflows/wafer-bonding.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wafer-bonding-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  bonding-science:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Bond geometry scientific invariants
        run: node --test site/tests/wafer-bonding.test.mjs site/tests/wafer-assembly.test.mjs site/tests/wafer-bonding-gan-two-wafer.test.mjs site/tests/wafer-assembly-io.test.mjs site/tests/project-geometry-storage.test.mjs site/tests/issue-13-settings-ui.test.mjs site/tests/wafer-assembly-editor-guard.test.mjs site/tests/project-controller-recovery.test.mjs
      - name: Bond-specific lint and formatting
        run: |
          npx eslint site/controllers/project-state-controller.js site/tests/wafer-assembly-editor-guard.test.mjs site/workspace-persistence.js site/wafer-bonding.js site/wafer-assembly.js site/project-schema.js site/project-io.js site/tests/wafer-bonding.test.mjs site/tests/wafer-assembly.test.mjs site/tests/wafer-bonding-gan-two-wafer.test.mjs site/tests/wafer-assembly-io.test.mjs
          npx prettier --check site/controllers/project-state-controller.js site/tests/wafer-assembly-editor-guard.test.mjs site/workspace-persistence.js site/wafer-bonding.js site/wafer-assembly.js site/project-schema.js site/project-io.js site/tests/wafer-bonding.test.mjs site/tests/wafer-assembly.test.mjs site/tests/wafer-bonding-gan-two-wafer.test.mjs site/tests/wafer-assembly-io.test.mjs docs/MULTI_WAFER_BONDING_DESIGN_2026-10-15.md
      - name: Temporary canonical formatting evidence
        if: failure()
        run: |
          npx prettier --write site/tests/wafer-assembly-editor-guard.test.mjs docs/MULTI_WAFER_BONDING_DESIGN_2026-10-15.md
          node --input-type=module -e '
            import fs from "node:fs";
            for (const path of ["site/tests/wafer-assembly-editor-guard.test.mjs","docs/MULTI_WAFER_BONDING_DESIGN_2026-10-15.md"]) {
              console.log("BOND_FORMAT_START:" + path);
              console.log(fs.readFileSync(path).toString("base64"));
              console.log("BOND_FORMAT_END:" + path);
            }
          '

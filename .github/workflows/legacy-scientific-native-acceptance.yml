name: PR290 Native scientific candidate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/v2/check-source-sunset-science.mjs'
      - 'site/tests/source-sunset-scientific-candidates.test.mjs'
      - '.github/workflows/legacy-scientific-native-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: pr290-native-science-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-process-io:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 290 }}
    strategy:
      fail-fast: false
      matrix:
        domain: [process, interchange]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WAFERCAD_V2_BASE: http://127.0.0.1:4173
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.1
      - run: npx playwright install --with-deps chromium
      - name: Start production v2 server
        run: |
          python3 -m http.server 4173 --directory site >/tmp/pr290-native-science.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/app.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pr290-native-science.log
          exit 1
      - name: Verify physical-science and IO owners without changing tolerances
        run: node scripts/v2/check-source-sunset-science.mjs ${{ matrix.domain }}

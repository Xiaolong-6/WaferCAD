name: Pre-main integration validation

on:
  push:
    branches:
      - fix/z-collapse-front-back-scale
  workflow_dispatch:

concurrency:
  group: pre-main-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
      WAFERCAD_PROCESS_EXTENDED: "1"
      WAFERCAD_EXTENDED_REVIEW: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint and Node tests
        run: npm run check:ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start WaferCAD
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wafercad-http.log
          exit 1

      - name: Complete browser regression inventory
        run: npm run test:ui:all

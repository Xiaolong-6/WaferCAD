name: Microdisk adaptive saved Variant acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/experimental/microdisk/generate-microdisk-adaptive-variant.mjs'
      - 'site/experimental/microdisk/microdisk-adaptive-persisted-variant.test.mjs'
      - 'site/experimental/microdisk/check-microdisk-adaptive-persisted-workstation.mjs'
      - '.github/workflows/microdisk-adaptive-variant.yml'
      - 'site/model.js'
      - 'site/process-topology.js'
      - 'site/tests/process-topology.test.mjs'
      - 'site/examples/suspended-silica-microdisks.wafercad'
      - 'site/experimental/microdisk/suspended-silica-microdisks-adaptive.wafercad'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  saved-variant:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WAFERCAD_THREE_DIR: /home/runner/work/WaferCAD/WaferCAD/node_modules/three
      WAFERCAD_V2_BASE: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Assert immutable published adaptive Variant matches reviewed bytes
        run: |
          test "$(git hash-object site/experimental/microdisk/suspended-silica-microdisks-adaptive.wafercad)" = '6b8cbbfd9b6b573dde5168ca2b19ca4beeafd001'
      - name: Build separate saved adaptive M07 Variant
        run: |
          node site/experimental/microdisk/generate-microdisk-adaptive-variant.mjs
          test "$(git hash-object site/experimental/microdisk/suspended-silica-microdisks-adaptive.wafercad)" = '6b8cbbfd9b6b573dde5168ca2b19ca4beeafd001'
      - name: Verify native source, export/reopen, History and legacy parity
        run: node --test site/experimental/microdisk/microdisk-adaptive-persisted-variant.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Real native-v2 persisted Variant Section and 3D
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site >/tmp/wafercad-issue298.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node site/experimental/microdisk/check-microdisk-adaptive-persisted-workstation.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: microdisk-adaptive-72band-saved-variant-and-native-evidence
          path: |
            site/experimental/microdisk/suspended-silica-microdisks-adaptive.wafercad
            test-results/issue298-persisted-variant/
          retention-days: 30
          if-no-files-found: warn

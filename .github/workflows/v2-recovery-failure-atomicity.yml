name: V2 Recovery Failure atomicity

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v2/check-recovery-failure-atomicity.mjs'
      - 'site/controllers/workspace-persistence-controller.js'
      - '.github/workflows/v2-recovery-failure-atomicity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-recovery-failure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recovery-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start real v2 Workstation
        shell: bash
        run: |
          node scripts/v2/serve-v2.mjs > serve-v2.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent --output /dev/null http://127.0.0.1:4182/app.html && exit 0
            sleep 1
          done
          cat serve-v2.log
          exit 1
      - name: Verify Recovery write failure rolls back in-memory geometry and History
        env:
          WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
        run: node scripts/v2/check-recovery-failure-atomicity.mjs
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: v2-recovery-failure-diagnostic
          path: serve-v2.log
          retention-days: 14

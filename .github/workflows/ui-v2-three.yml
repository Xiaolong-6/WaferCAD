name: UI v2 Phase B 3D acceptance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'site/three-view.js'
      - 'site/app.html'
      - 'site/ui-v2/**'
      - 'scripts/v2/**'
      - 'scripts/test-helpers/ui.mjs'
      - 'package-lock.json'
      - '.github/workflows/ui-v2-three.yml'

permissions:
  contents: read

concurrency:
  group: ui-v2-three-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  three:
    name: Small-model 3D gestures and full-model GLB Abort
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Cache Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.1
      - name: Install Playwright Chromium 1.55.1
        run: npx playwright install --with-deps chromium
      - name: Start shared workstation server
        shell: bash
        run: |
          node scripts/v2/serve-v2.mjs > serve-three.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4182/app.html; then
              exit 0
            fi
            sleep 1
          done
          cat serve-three.log
          exit 1
      - name: Check real 3D four widths, touch and physical exports
        env:
          WAFERCAD_V2_EXAMPLE: metalens
        run: node scripts/v2/check-three-view.mjs
      - name: Check real full M3D GLB cancellation
        run: node scripts/v2/check-three-export-abort.mjs
      - name: Upload 3D review evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wafercad-ui-v2-three-${{ github.sha }}
          path: |
            test-results/ui-v2-three-review-metalens/
            test-results/ui-v2-three-export-abort/
            serve-three.log
          retention-days: 14
          if-no-files-found: warn

name: One-shot Intermediate History Reconciliation

on:
  push:
    branches:
      - audit/example-literature-fidelity-20261014
    paths:
      - '.github/workflows/one-shot-intermediate-history-reconciliation.yml'

permissions:
  contents: read

jobs:
  reconcile:
    if: ${{ github.repository == 'Xiaolong-6/WaferCAD' && github.ref == 'refs/heads/audit/example-literature-fidelity-20261014' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Rebuild and reconcile only the seven plus three known intermediate states
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > /tmp/wafercad-history-reconcile.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          node scripts/example-recipe-runall-acceptance.mjs --id=suspended-silica-microdisk --reconcile-intermediate-history
          node scripts/example-recipe-runall-acceptance.mjs --id=fully-textured-perovskite-silicon-tandem --reconcile-intermediate-history
          node scripts/maintenance/backfill-example-recipes.mjs --write --id=suspended-silica-microdisks
          node scripts/maintenance/backfill-example-recipes.mjs --write --id=fully-textured-perovskite-silicon-tandem
          node scripts/maintenance/sync-example-recipe-previews.mjs --write
          node --test site/tests/example-literature-fidelity.test.mjs site/tests/example-recipe-audit.test.mjs
      - name: Commit audited fixture-only geometry reconciliation to PR branch
        run: |
          git status --short
          git diff --check
          git add site/examples/suspended-silica-microdisks.wafercad site/examples/fully-textured-perovskite-silicon-tandem.wafercad
          git add site/examples/previews/suspended-silica-microdisk.wafercad site/examples/previews/fully-textured-perovskite-silicon-tandem.wafercad
          git add tests/fixtures/project-io/example-thumbnails.json
          git diff --cached --stat
          git diff --cached --quiet && { echo "No fixture changes detected"; exit 1; }
          git -c user.name='wafercad-ci' -c user.email='wafercad-ci@users.noreply.github.com' commit -m "fix(science): reconcile paper examples intermediate History with Kernel replay"
          git push origin HEAD:audit/example-literature-fidelity-20261014

name: Native v2 KLayout full UI corpus

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v2/check-klayout-corpus-ui.mjs'
      - 'site/ui-v2/project-mask-panels.js'
      - 'site/controllers/project-controller.js'
      - 'site/controllers/mask-import-controller.js'
      - 'site/gds.js'
      - 'site/oasis.js'
      - 'site/layout-worker.js'
      - '.github/workflows/v2-klayout-corpus-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-klayout-corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-ui-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Checkout pinned KLayout core GDS/OAS testdata
        uses: actions/checkout@v6
        with:
          repository: KLayout/klayout
          ref: 5fa733e1680212e4ceda532ca5fa6ea707c654de
          path: _klayout
          sparse-checkout: |
            testdata/gds
            testdata/oasis
            testdata/lstream
      - name: Start v2 Workstation
        shell: bash
        run: |
          node scripts/v2/serve-v2.mjs > serve-v2.log 2>&1 &
          for n in $(seq 1 60); do
            curl --fail --silent --output /dev/null http://127.0.0.1:4182/app.html && exit 0
            sleep 1
          done
          cat serve-v2.log
          exit 1
      - name: Run pinned corpus through native v2 Mask UI
        run: |
          node scripts/v2/check-klayout-corpus-ui.mjs \
            --url http://127.0.0.1:4182 \
            --root _klayout/testdata \
            --report klayout-v2-ui-compat.json \
            --failure-dir ui-failures-v2
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-v2-klayout-corpus
          path: |
            klayout-v2-ui-compat.json
            ui-failures-v2/
            serve-v2.log
          if-no-files-found: ignore
          retention-days: 14

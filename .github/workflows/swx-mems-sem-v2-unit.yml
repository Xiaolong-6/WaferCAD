name: SWX SEM V2 Single Unit

on:
  pull_request:
    paths:
      - 'scripts/swx-mems-sem-v2-unit.mjs'
      - 'scripts/build-swx-sem-v2-unit.mjs'
      - 'site/tests/swx-mems-sem-v2-unit.test.mjs'
      - '.github/workflows/swx-mems-sem-v2-unit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Scientific invariants for newly oriented single MEMS unit
        run: node --test site/tests/swx-mems-sem-v2-unit.test.mjs
      - name: Execute actual OFF/ON Kernel and common Recipe
        run: node scripts/build-swx-sem-v2-unit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-single-mems-sem-v2
          path: test-results/swx-sem-v2/
          retention-days: 14
          if-no-files-found: ignore

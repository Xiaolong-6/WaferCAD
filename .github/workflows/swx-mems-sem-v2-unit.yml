name: SWX SEM V2 Single Unit

on:
  pull_request:
    paths:
      - 'scripts/swx-mems-sem-v2-unit.mjs'
      - 'scripts/build-swx-sem-v2-unit.mjs'
      - 'scripts/swx-mems-sem-v2-browser-acceptance.mjs'
      - 'scripts/swx-mems-klayout-verify.py'
      - 'site/tests/swx-mems-sem-v2-unit.test.mjs'
      - '.github/workflows/swx-mems-sem-v2-unit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: One-time exact Prettier patch capture
        shell: bash
        run: |
          mkdir -p test-results/swx-sem-v2
          npx prettier --write scripts/swx-mems-sem-v2-unit.mjs site/tests/swx-mems-sem-v2-unit.test.mjs
          git diff -- scripts/swx-mems-sem-v2-unit.mjs site/tests/swx-mems-sem-v2-unit.test.mjs > test-results/swx-sem-v2/formatter.patch
      - name: Scientific invariants for newly oriented single MEMS unit
        run: node --test site/tests/swx-mems-sem-v2-unit.test.mjs
      - name: Execute actual OFF/ON Kernel and common Recipe
        run: node scripts/build-swx-sem-v2-unit.mjs
      - name: Install pinned Chromium for real unit visual validation
        run: npx playwright install --with-deps chromium
      - name: Start WaferCAD UI v2
        shell: bash
        run: |
          node scripts/v2/serve-v2.mjs > test-results/swx-sem-v2/server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4182/app.html; then
              exit 0
            fi
            sleep 1
          done
          cat test-results/swx-sem-v2/server.log
          exit 1
      - name: Real Chromium OFF/ON Mask, 3D, Section, browser Recipe, GDS/OAS
        run: node scripts/swx-mems-sem-v2-browser-acceptance.mjs
      - name: Independent GDS/OAS Boolean parity (KLayout 0.30.12)
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir klayout==0.30.12
          python3 scripts/swx-mems-klayout-verify.py test-results/swx-sem-v2 sem-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-single-mems-sem-v2
          path: test-results/swx-sem-v2/
          retention-days: 14
          if-no-files-found: ignore

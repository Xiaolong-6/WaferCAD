name: Temporary branch formatter

on:
  push:
    branches:
      - "fix/klayout-gds-oasis-compat"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Format changed sources
        run: npx prettier --write site/oasis.js site/gds.js scripts/klayout-compat.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/oasis.js site/gds.js scripts/klayout-compat.mjs
          git commit -m "style: format compatibility changes"
          git push

name: Temporary test-only format pass
on:
  push:
    branches: [test/history-recovery-fault-matrix-20261013]
    paths: [.github/workflows/temp-test-format.yml]
  pull_request:
    branches: [main]
    paths: [.github/workflows/temp-test-format.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format dedicated test files on their own isolated branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS=' ' read -r branch file; do
            git fetch origin "$branch"
            git switch -C "$branch" "origin/$branch"
            ./node_modules/.bin/prettier --write "$file"
            git add -- "$file"
            if ! git diff --cached --quiet; then
              git commit -m "style(test): format dedicated regression matrix"
              git push origin "HEAD:refs/heads/$branch"
            fi
          done <<'BRANCHES'
          test/history-recovery-fault-matrix-20261013 site/tests/history-recovery-fault-matrix.test.mjs
          test/layout-roundtrip-integrity-20261013 site/tests/layout-roundtrip-integrity.test.mjs
          test/kernel-invariant-matrix-20261013 site/tests/kernel-invariant-matrix.test.mjs
          BRANCHES

name: Feature guide formatting and validation

on:
  push:
    branches: [feat/process-visual-guide-wiki]

permissions:
  contents: write

concurrency:
  group: feature-process-guide-validation
  cancel-in-progress: true

jobs:
  format-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format new product manual and UI guide
        run: npm run format
      - name: Check generated manual matches catalog
        run: npm run docs:check
      - name: Run lint and unit regressions
        run: npm run check:ci
      - name: Commit formatting only if validations pass
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git config user.name "wafercad-docs-bot"
            git config user.email "wafercad-docs-bot@users.noreply.github.com"
            git commit -m "style: format Process guide and product manual"
            git push origin HEAD:feat/process-visual-guide-wiki
          fi

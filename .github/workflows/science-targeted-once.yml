name: One-time science oracle unit checks

on:
  push:
    branches: [science/figure-provenance-299]

permissions:
  contents: read

jobs:
  targeted-science:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run three independent scientific contracts
        shell: bash
        run: |
          set -euo pipefail
          for branch in science/physical-facets-297 science/smooth-release-298 science/figure-provenance-299; do
            echo "::group::SCIENTIFIC_TEST ${branch}"
            git fetch --depth=1 origin "refs/heads/${branch}"
            git checkout --force --detach FETCH_HEAD
            case "$branch" in
              science/physical-facets-297) file=site/tests/physical-facet-math.test.mjs ;;
              science/smooth-release-298) file=site/tests/isotropic-release-oracle.test.mjs ;;
              science/figure-provenance-299) file=site/tests/literature-provenance-matrix.test.mjs ;;
            esac
            node --test "$file"
            echo "::endgroup::"
          done

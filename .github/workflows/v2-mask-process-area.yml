name: V2 scientific Mask deposition area
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v2/check-mask-process-area.mjs'
      - 'site/model.js'
      - 'site/ui-v2/project-mask-panels.js'
      - 'site/ui-v2/workstation-workflow.js'
      - '.github/workflows/v2-mask-process-area.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-mask-area-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mask-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start workstation
        shell: bash
        run: |
          node scripts/v2/serve-v2.mjs > serve-v2.log 2>&1 &
          for n in $(seq 1 60); do
            curl --fail --silent --output /dev/null http://127.0.0.1:4182/app.html && exit 0
            sleep 1
          done
          cat serve-v2.log
          exit 1
      - name: Prove bounded Mask deposition physics
        run: node scripts/v2/check-mask-process-area.mjs
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: v2-mask-area-failure
          path: serve-v2.log
          retention-days: 14

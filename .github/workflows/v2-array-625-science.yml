name: V2 Array 625-site science

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v2/check-array-625-science.mjs'
      - 'site/tests/array-instance-invariants.test.mjs'
      - 'site/model-array.js'
      - 'site/model-array-process.js'
      - '.github/workflows/v2-array-625-science.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-array-625-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  array-science:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify focused science formatting with exact diff
        shell: bash
        run: |
          set -euo pipefail
          for file in site/tests/array-instance-invariants.test.mjs scripts/v2/check-array-625-science.mjs; do
            npx prettier "$file" | diff -u "$file" -
          done
      - name: Verify canonical 625-site Process and 6400-site IO science
        run: node --test site/tests/array-instance-invariants.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Start real v2 Workstation
        shell: bash
        run: |
          node scripts/v2/serve-v2.mjs > serve-v2.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent --output /dev/null http://127.0.0.1:4182/app.html && exit 0
            sleep 1
          done
          cat serve-v2.log
          exit 1
      - name: Verify all 625 device films and preserved buried layers
        env:
          WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
        run: node scripts/v2/check-array-625-science.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v2-array-625-acceptance
          path: |
            test-results/v2-array-science/625-sites-after-deposition.png
            test-results/v2-array-science/625-jlfet-conformal.png
            test-results/v2-array-science/625-jlfet-roi-etch-section.png
            serve-v2.log
          if-no-files-found: ignore
          retention-days: 14

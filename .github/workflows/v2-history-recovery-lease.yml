name: V2 History and Recovery transactions
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v2/check-history-recovery-lease.mjs'
      - 'site/controllers/workspace-persistence-controller.js'
      - 'site/controllers/workspace-session-controller.js'
      - 'site/ui-v2/workstation-workflow.js'
      - 'site/continuous-etch*.js'
      - 'site/continuous-material-owner.js'
      - 'site/plan-renderers.js'
      - 'site/three-view.js'
      - 'site/controllers/process-panel-controller.js'
      - 'site/process-worker.js'
      - 'scripts/v2/check-continuous-etch-workstation.mjs'
      - '.github/workflows/v2-history-recovery-lease.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-history-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start workstation
        shell: bash
        run: |
          node scripts/v2/serve-v2.mjs > serve-v2.log 2>&1 &
          for n in $(seq 1 60); do
            curl --fail --silent --output /dev/null http://127.0.0.1:4182/app.html && exit 0
            sleep 1
          done
          cat serve-v2.log
          exit 1
      - name: Verify History and Recovery transaction isolation
        run: node scripts/v2/check-history-recovery-lease.mjs
      - name: Verify Continuous Etch real Workstation transaction
        run: node scripts/v2/check-continuous-etch-workstation.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v2-history-recovery-continuous-evidence
          path: |
            serve-v2.log
            test-results/continuous-etch-workstation/
          retention-days: 14

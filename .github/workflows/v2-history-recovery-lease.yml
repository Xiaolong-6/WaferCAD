name: V2 History and Recovery transactions
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-history-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start workstation
        shell: bash
        run: |
          node scripts/v2/serve-v2.mjs > serve-v2.log 2>&1 &
          for n in $(seq 1 60); do
            curl --fail --silent --output /dev/null http://127.0.0.1:4182/app.html && exit 0
            sleep 1
          done
          cat serve-v2.log
          exit 1
      - name: Verify History and Recovery transaction isolation
        run: node scripts/v2/check-history-recovery-lease.mjs
      - name: Verify Starting Wafer Base Replay with real Workers
        run: node scripts/v2/check-history-base-replay-acceptance.mjs
      - name: Verify History View State and mobile navigation
        run: node scripts/v2/check-history-view-persistence.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pr350-base-replay-browser-evidence
          path: |
            test-results/pr350-history-base/
            test-results/pr350-history-view/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: v2-history-recovery-failure
          path: serve-v2.log
          retention-days: 14

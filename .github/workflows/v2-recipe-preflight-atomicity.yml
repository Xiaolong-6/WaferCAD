name: V2 Recipe preflight atomicity

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v2/check-recipe-preflight-atomicity.mjs'
      - 'site/controllers/process-recipe-controller.js'
      - 'site/process-recipe-preflight.js'
      - 'site/ui-v2/workstation-workflow.js'
      - '.github/workflows/v2-recipe-preflight-atomicity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-recipe-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start production v2 Workstation
        shell: bash
        run: |
          node scripts/v2/serve-v2.mjs > serve-v2.log 2>&1 &
          for n in $(seq 1 60); do
            curl --fail --silent --output /dev/null http://127.0.0.1:4182/app.html && exit 0
            sleep 1
          done
          cat serve-v2.log
          exit 1
      - name: Verify non-destructive v2 Recipe preflight
        run: node scripts/v2/check-recipe-preflight-atomicity.mjs
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: v2-recipe-preflight-evidence
          path: serve-v2.log
          retention-days: 14

name: Deploy WaferCAD to Pages

# Production publication validates the exact staged artifact, at the same main
# revision as the Quality, targeted Browser and UI v2 acceptance gates.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '!site/tests/**'
      - 'examples/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
      - '.github/workflows/release-evidence-contract.yml'
      - '.github/workflows/browser-regression.yml'
      - '.github/workflows/ui-v2-stage-c-m4.yml'
      - '.github/workflows/quality.yml'
      - '.github/workflows/ui-v2-main-mask.yml'
      - '.github/workflows/klayout-compat.yml'
      - '.github/workflows/process-recipe-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

# Validate each Main SHA independently. Only the final publishing step is
# serialized; never cancel a deployment that is already in progress.
concurrency:
  group: pages-validation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release-evidence:
    name: Select proven PR evidence or full release
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      checks: read
      pull-requests: read
      actions: read
    outputs:
      fast: ${{ steps.verify.outputs.fast }}
      mode: ${{ steps.verify.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require fail-closed release contract tests
        run: node --test site/tests/release-evidence.test.mjs
      - name: Inspect exact merge tree and reviewed PR checks
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/verified-pr-release.mjs

  release-quality:
    name: Release local Quality evidence
    needs: release-evidence
    if: ${{ needs.release-evidence.outputs.fast != 'true' && needs.release-evidence.outputs.mode != 'superseded' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # Prefer the exact-release-tree proof. If absent or stale, run the
      # complete real checks instead of allowing an unverified publication.
      - name: Probe full local Quality for this release tree
        id: evidence
        continue-on-error: true
        run: node scripts/local-verification.mjs verify full
      - name: Require full local Quality for this release tree
        if: ${{ steps.evidence.outcome == 'success' }}
        run: node scripts/local-verification.mjs verify full
      - name: Install locked dependencies for release Quality fallback
        if: ${{ !cancelled() && steps.evidence.outcome != 'success' }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Final lint, formatting, generated documentation and Node tests
        if: ${{ !cancelled() && steps.evidence.outcome != 'success' }}
        run: npm run check

  release-browser:
    name: Release targeted browser regression
    needs: release-evidence
    if: ${{ needs.release-evidence.outputs.fast != 'true' && needs.release-evidence.outputs.mode != 'superseded' }}
    uses: ./.github/workflows/browser-regression.yml
    with:
      skip_node_gate: true
    permissions:
      contents: read
      actions: read

  release-ui-v2:
    name: Release real UI v2 acceptance
    needs: release-evidence
    if: ${{ needs.release-evidence.outputs.fast != 'true' && needs.release-evidence.outputs.mode != 'superseded' }}
    uses: ./.github/workflows/ui-v2-stage-c-m4.yml
    permissions:
      contents: read

  release-impact:
    name: Select scientific release gates
    needs: release-evidence
    if: ${{ needs.release-evidence.outputs.fast != 'true' && needs.release-evidence.outputs.mode != 'superseded' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      main_mask: ${{ steps.plan.outputs.main_mask }}
      klayout: ${{ steps.plan.outputs.klayout }}
      recipe: ${{ steps.plan.outputs.recipe }}
    steps:
      - name: Checkout history for changed-path selection
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify same-revision changes
        id: plan
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" =~ ^0+$ ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              node scripts/ci-test-plan.mjs --full
            else
              git diff --name-only "$before" "$GITHUB_SHA" | node scripts/ci-test-plan.mjs --stdin
            fi
          else
            # A manual publication cannot safely infer what was previously tested.
            node scripts/ci-test-plan.mjs --full
          fi

  release-main-mask:
    name: Real Main/Mask/Section acceptance
    needs: [release-evidence, release-impact]
    if: ${{ needs.release-evidence.outputs.fast != 'true' && needs.release-evidence.outputs.mode != 'superseded' && needs.release-impact.outputs.main_mask == 'true' }}
    uses: ./.github/workflows/ui-v2-main-mask.yml
    permissions:
      contents: read

  release-klayout:
    name: KLayout interchange compatibility
    needs: [release-evidence, release-impact]
    if: ${{ needs.release-evidence.outputs.fast != 'true' && needs.release-evidence.outputs.mode != 'superseded' && needs.release-impact.outputs.klayout == 'true' }}
    uses: ./.github/workflows/klayout-compat.yml
    with:
      scope: all
    permissions:
      contents: read

  release-recipe:
    name: Recipe safety acceptance
    needs: [release-evidence, release-impact]
    if: ${{ needs.release-evidence.outputs.fast != 'true' && needs.release-evidence.outputs.mode != 'superseded' && needs.release-impact.outputs.recipe == 'true' }}
    uses: ./.github/workflows/process-recipe-safety.yml
    with:
      skip_shared_node_gate: true
    permissions:
      contents: read

  release-science:
    name: Scientific release aggregate
    if: ${{ always() && needs.release-evidence.outputs.fast != 'true' && needs.release-evidence.outputs.mode != 'superseded' }}
    needs: [release-evidence, release-impact, release-main-mask, release-klayout, release-recipe]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require planned suites to pass and unplanned suites to skip
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.release-impact.result }}
          MAIN_MASK_REQUIRED: ${{ needs.release-impact.outputs.main_mask }}
          MAIN_MASK_RESULT: ${{ needs.release-main-mask.result }}
          KLAYOUT_REQUIRED: ${{ needs.release-impact.outputs.klayout }}
          KLAYOUT_RESULT: ${{ needs.release-klayout.result }}
          RECIPE_REQUIRED: ${{ needs.release-impact.outputs.recipe }}
          RECIPE_RESULT: ${{ needs.release-recipe.result }}
        run: |
          test "$PLAN_RESULT" = success
          for gate in MAIN_MASK KLAYOUT RECIPE; do
            required_var="${gate}_REQUIRED"
            result_var="${gate}_RESULT"
            required="${!required_var}"
            result="${!result_var}"
            if [[ "$required" == "true" ]]; then
              test "$result" = success || { echo "::error::$gate required but $result"; exit 1; }
            elif [[ "$required" == "false" ]]; then
              test "$result" = skipped || { echo "::error::$gate not selected but $result"; exit 1; }
            else
              echo "::error::$gate routing output missing or invalid"
              exit 1
            fi
          done

  stage-pages:
    name: Build and smoke production Pages artifact
    needs: [release-evidence, release-quality, release-browser, release-ui-v2, release-science]
    # Without an explicit status function, any intentionally skipped upstream
    # job can silently skip both staging and deployment while leaving CI green.
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.release-evidence.outputs.mode != 'superseded' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - name: Require proven fast release or successful full release gates
        shell: bash
        env:
          EVIDENCE_RESULT: ${{ needs.release-evidence.result }}
          FAST: ${{ needs.release-evidence.outputs.fast }}
          QUALITY_RESULT: ${{ needs.release-quality.result }}
          BROWSER_RESULT: ${{ needs.release-browser.result }}
          UI_V2_RESULT: ${{ needs.release-ui-v2.result }}
          SCIENCE_RESULT: ${{ needs.release-science.result }}
        run: |
          test "$EVIDENCE_RESULT" = success || {
            echo "::error::Release evidence gate was not successful"; exit 1;
          }
          if [[ "$FAST" == true ]]; then
            # A trusted, exact-tree PR review replaces only redundant checks.
            # Failed or accidentally running/skipped gates cannot be hidden.
            expected=skipped
          elif [[ "$FAST" == false ]]; then
            expected=success
          else
            echo "::error::Release verification route was not established"
            exit 1
          fi
          for gate in QUALITY BROWSER UI_V2 SCIENCE; do
            result_var="${gate}_RESULT"
            result="${!result_var}"
            if [[ "$result" != "$expected" ]]; then
              echo "::error::Release $gate gate is $result, expected $expected"
              exit 1
            fi
          done
      - name: Checkout verified revision
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.1
      - run: npx playwright install --with-deps chromium
      - name: Stage and stamp production files
        run: |
          node scripts/build-pages-artifact.mjs
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > build/pages/build-info.json
          node scripts/stamp-pages-assets.mjs "$GITHUB_SHA" build/pages
      - name: Smoke the exact staged artifact at /WaferCAD/
        run: node scripts/smoke-pages-artifact.mjs
      - name: Upload exactly the tested Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    name: Publish verified main
    needs: [stage-pages]
    # Serialize only publication; verify the Main ref after obtaining the lock.
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.stage-pages.result == 'success' }}
    concurrency:
      group: pages-publication
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      published: ${{ steps.deployment.outcome == 'success' }}
      superseded: ${{ steps.latest.outputs.current == 'false' }}
    steps:
      - name: Verify current Main under the publication lock
        id: latest
        uses: actions/github-script@v7
        with:
          script: |
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });
            const current = ref.data.object.sha === context.sha;
            core.setOutput('current', String(current));
            core.info(current ? 'Publishing current Main.' : 'Superseded Main: omit publication.');
      - uses: actions/configure-pages@v5
        if: ${{ steps.latest.outputs.current == 'true' }}
      - name: Deploy the already-tested artifact
        id: deployment
        if: ${{ steps.latest.outputs.current == 'true' }}
        uses: actions/deploy-pages@v4

  release-verdict:
    name: Verify Pages deployment actually happened
    needs: [release-evidence, stage-pages, deploy]
    # An older SHA may be superseded, but cannot masquerade as a deployment.
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require publish or attested supersession
        shell: bash
        env:
          RELEASE_MODE: ${{ needs.release-evidence.outputs.mode }}
          STAGE_RESULT: ${{ needs.stage-pages.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PUBLISHED: ${{ needs.deploy.outputs.published }}
          SUPERSEDED: ${{ needs.deploy.outputs.superseded }}
        run: |
          if [[ "$RELEASE_MODE" == superseded ]]; then
            test "$STAGE_RESULT" = skipped
            test "$DEPLOY_RESULT" = skipped
            echo "Superseded Main did not publish; latest Main owns deployment."
          elif [[ "$STAGE_RESULT" == success && "$DEPLOY_RESULT" == success && "$PUBLISHED" == true ]]; then
            echo "The verified current Main artifact was published."
          elif [[ "$STAGE_RESULT" == success && "$DEPLOY_RESULT" == success && "$SUPERSEDED" == true && "$PUBLISHED" != true ]]; then
            echo "Main advanced in the publication queue; safely omitted stale publication."
          else
            echo "::error::Pages release incomplete: stage=$STAGE_RESULT deploy=$DEPLOY_RESULT published=$PUBLISHED superseded=$SUPERSEDED"
            exit 1
          fi

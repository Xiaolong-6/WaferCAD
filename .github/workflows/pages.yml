name: Deploy WaferCAD to Pages

# Production publication validates the exact staged artifact, at the same main
# revision as the Quality, targeted Browser and UI v2 acceptance gates.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '!site/tests/**'
      - 'examples/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
      - '.github/workflows/browser-regression.yml'
      - '.github/workflows/ui-v2-stage-c-m4.yml'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

permissions:
  contents: read

# A publishing run is never cancelled after it passes its expensive gates.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release-quality:
    name: Release lint, format, docs and Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check

  release-browser:
    name: Release targeted browser regression
    uses: ./.github/workflows/browser-regression.yml
    with:
      skip_node_gate: true
    permissions:
      contents: read

  release-ui-v2:
    name: Release real UI v2 acceptance
    uses: ./.github/workflows/ui-v2-stage-c-m4.yml
    permissions:
      contents: read

  stage-pages:
    name: Build and smoke production Pages artifact
    needs: [release-quality, release-browser, release-ui-v2]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.1
      - run: npx playwright install --with-deps chromium
      - name: Stage and stamp production files
        run: |
          node scripts/build-pages-artifact.mjs
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > build/pages/build-info.json
          node scripts/stamp-pages-assets.mjs "$GITHUB_SHA" build/pages
      - name: Smoke the exact staged artifact at /WaferCAD/
        run: node scripts/smoke-pages-artifact.mjs
      - name: Upload exactly the tested Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    name: Publish verified main
    needs: [stage-pages]
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the already-tested artifact
        id: deployment
        uses: actions/deploy-pages@v4

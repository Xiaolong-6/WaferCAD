name: Deploy WaferCAD to Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'package.json'
      - 'eslint.config.js'
      - '.prettierignore'
      - '.prettierrc.json'
      - '.github/workflows/pages.yml'
      - '.github/workflows/pr-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v6
        with:
          ref: main
          path: production

      - name: Checkout preview state
        uses: actions/checkout@v6
        with:
          ref: pages-preview-state
          path: preview-state

      - name: Assemble production and previews
        run: |
          mkdir -p publish
          cp -a production/site/. publish/

          if [ -d preview-state/previews ]; then
            mkdir -p publish/pr-preview
            cp -a preview-state/previews/. publish/pr-preview/
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

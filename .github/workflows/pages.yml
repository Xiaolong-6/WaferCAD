name: Deploy WaferCAD to Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/stamp-pages-assets.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run lightweight release sanity
        run: npm test

      - name: Write build commit
        run: printf '{"commit":"%s"}\n' "$GITHUB_SHA" > site/build-info.json

      - name: Version browser module imports
        run: node scripts/stamp-pages-assets.mjs "$GITHUB_SHA"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: View UX integration temporary formatter

on:
  push:
    branches: [feat/view-ux-v3-unified-20261009]
    paths:
      - ".github/workflows/view-ux-v3-format.yml"
      - "site/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
permissions:
  contents: write
concurrency:
  group: view-ux-v3-format
  cancel-in-progress: false
jobs:
  format:
    if: github.repository == 'Xiaolong-6/WaferCAD'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/view-ux-v3-unified-20261009
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Canonical format for changed source only
        shell: bash
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD |
            grep -E '^(site/.*\.(js|mjs|css|html)|scripts/.*\.mjs|docs/.*\.md|package\.json)$' |
            xargs -r npx prettier --write
      - name: Commit formatting to this feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/ scripts/ docs/ package.json
          if ! git diff --cached --quiet; then
            git commit -m "style(integration): canonical format Process and View UX"
            git push origin HEAD:feat/view-ux-v3-unified-20261009
          fi

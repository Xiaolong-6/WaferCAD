name: Temporary integration formatter

on:
  push:
    branches:
      - feat/view-ux-v3-unified-20261009
    paths:
      - ".github/workflows/view-ux-v3-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/view-ux-v3-unified-20261009
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Canonical formatting of integrated main and responsive UI checks
        run: >-
          npx prettier --write
          site/tests/transparent-array-lod.test.mjs
          site/three-view.js
          site/transparent-array-lod.js
          scripts/array-renderer-edge-on-regression.mjs
          scripts/array-renderer-regression.mjs
          docs/RENDERER_TRANSPARENCY_ROADMAP.md
          scripts/product-layout-cases.mjs
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/tests/transparent-array-lod.test.mjs site/three-view.js site/transparent-array-lod.js scripts/array-renderer-edge-on-regression.mjs scripts/array-renderer-regression.mjs docs/RENDERER_TRANSPARENCY_ROADMAP.md scripts/product-layout-cases.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(integration): normalize transparent LOD and view regression sources"
            git push origin HEAD:feat/view-ux-v3-unified-20261009
          fi

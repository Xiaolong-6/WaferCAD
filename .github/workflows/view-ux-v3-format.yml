name: Temporary integration formatter

on:
  push:
    branches:
      - feat/view-ux-v3-unified-20261009
    paths:
      - .github/workflows/view-ux-v3-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'Xiaolong-6/WaferCAD'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/view-ux-v3-unified-20261009
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format modified files
        run: npx prettier --write docs/RENDERER_TRANSPARENCY_ROADMAP.md scripts/test-helpers/product-layout.mjs site/controllers/view-popover-controller.js
      - name: Commit formatting on feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/RENDERER_TRANSPARENCY_ROADMAP.md scripts/test-helpers/product-layout.mjs site/controllers/view-popover-controller.js
          if ! git diff --cached --quiet; then
            git commit -m "style(integration): normalize current-main docs and ROI regression"
            git push origin HEAD:feat/view-ux-v3-unified-20261009
          fi

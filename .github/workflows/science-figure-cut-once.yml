name: One-time science three-family Chromium cuts

on:
  push:
    branches: [science/figure-provenance-299]

permissions:
  contents: read

jobs:
  targeted-chromium-cuts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Capture three paper-structure Section cases
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > /tmp/wafercad-science-figures.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          for id in magic-1000-mos2-beol tio2-metalens-four-unit m3d-selfpowered-heterogeneous-ic; do
            echo "::group::FIGURE_CASE ${id}"
            node scripts/example-literature-visual-evidence.mjs "--id=${id}"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: science-m3d-magic-tio2-real-chromium
          path: test-results/literature-figure-cuts/
          if-no-files-found: warn
          retention-days: 14

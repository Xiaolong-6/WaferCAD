name: Visual-first candidate screenshots

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'site/ui-v2/**'
      - 'site/app.html'
      - 'site/three-view.js'
      - 'site/section-view.js'
      - 'site/rough-mesh-geometry.js'
      - 'site/rough-mesh-worker.js'
      - 'site/examples/**'
      - 'site/bundled-examples.js'
      - 'site/workstation.css'
      - 'scripts/v2/capture-visual-first.mjs'
      - '.github/workflows/visual-first.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-first-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Draft screenshot evidence (not visual approval)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.1
      - run: npx playwright install --with-deps chromium
      - name: Start shared preview server for full Example acceptance
        if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.body, '[visual-photodetector-full]') }}
        run: |
          WAFERCAD_V2_PORT=4189 node scripts/v2/serve-v2.mjs > visual-preview-server.log 2>&1 &
          for attempt in $(seq 1 80); do
            if curl --fail --silent http://127.0.0.1:4189/app.html > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat visual-preview-server.log
          exit 1
      - name: Capture actual production UI v2 at desktop and portrait widths
        env:
          WAFERCAD_V2_BASE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.body, '[visual-photodetector-full]') && 'http://127.0.0.1:4189' || '' }}
        run: npm run preview:visual
      - name: Capture real full Photodetector Open and roughness
        if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.body, '[visual-photodetector-full]') }}
        env:
          WAFERCAD_V2_BASE: http://127.0.0.1:4189
          WAFERCAD_VISUAL_START: empty
          WAFERCAD_VISUAL_OPEN_PROJECT: photodetector-literature-examples.wafercad
          WAFERCAD_VISUAL_EXPECT_PROJECT: photodetector-literature-examples.wafercad
          WAFERCAD_VISUAL_EXPECT_LAYERS: '6'
          WAFERCAD_VISUAL_EXPECT_REGIONS: '5'
          WAFERCAD_VISUAL_REQUIRE_ROUGH: '1'
          WAFERCAD_VISUAL_VIEWPORTS: 1440x900
          WAFERCAD_VISUAL_PORT: '4190'
          WAFERCAD_VISUAL_SWIFTSHADER: '1'
          WAFERCAD_VISUAL_OUTPUT: test-results/visual-first-photodetector
        run: npm run preview:visual
      - name: Extract pinned Prettier normalization for final source commit
        if: ${{ always() && github.event_name == 'pull_request' && contains(github.event.pull_request.body, '[visual-photodetector-full]') }}
        run: |
          ./node_modules/.bin/prettier --write scripts/v2/capture-visual-first.mjs scripts/v2/visual-first-contract.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const path of ['scripts/v2/capture-visual-first.mjs', 'scripts/v2/visual-first-contract.mjs']) {
            console.log('WAFERCAD_VISUAL_PRETTIER:' + JSON.stringify({
              path, contentBase64: readFileSync(path).toString('base64'),
            }));
          }
          NODE
      - name: Upload unreviewed evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-first-${{ github.sha }}
          path: |
            test-results/visual-first/
            test-results/visual-first-photodetector/
          retention-days: 7
          if-no-files-found: warn

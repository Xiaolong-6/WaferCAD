name: Renderer V3 temporary format diagnostics
on:
  push:
    branches: [perf/transparent-renderer-v3-20261009]
    paths: [.github/workflows/renderer-v3-format-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print exact Prettier unified diffs
        shell: bash
        run: |
          for file in \
            site/tests/issue-11-3d-controls.test.mjs \
            site/three-view.js \
            scripts/renderer-electrical-same-context-ab.mjs \
            scripts/renderer-roi-recovery-regression.mjs \
            scripts/test-helpers/renderer-v3-phase-parity.mjs \
            scripts/tests/renderer-v3-phase-parity.test.mjs \
            docs/PR166_ROI_FAILURE_RECOVERY_2026-10-10.md \
            docs/RENDERER_R9_CONSOLIDATION_2026-10-12.md; do
            npx prettier "$file" | diff -u "$file" - || true
          done

name: UI v2 GitHub Pages preview

on:
  push:
    branches: [codex/ui-v2-main-wip]
    paths:
      - 'site/**'
      - '.github/workflows/ui-v2-preview.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Production-root-preserving v2 preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve last successfully deployed production revision
        id: verified-main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?branch=main&status=success&per_page=20" --jq '.workflow_runs[0].head_sha // empty')"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::No verified production Pages revision found; cannot publish preview.'
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout last verified production revision
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.verified-main.outputs.sha }}
          path: base
      - name: Checkout preview branch
        uses: actions/checkout@v6
        with:
          ref: codex/ui-v2-main-wip
          path: preview-src
      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Stage verified production root and stamp preview
        shell: bash
        run: |
          set -euo pipefail
          (
            cd base
            sha="$(git rev-parse HEAD)"
            node scripts/build-pages-artifact.mjs
            printf '{"commit":"%s"}\n' "$sha" > build/pages/build-info.json
            node scripts/stamp-pages-assets.mjs "$sha" build/pages
          )
          (
            cd preview-src
            sha="$(git rev-parse HEAD)"
            printf '{"commit":"%s"}\n' "$sha" > site/build-info.json
            node scripts/stamp-pages-assets.mjs "$sha"
          )
      - name: Assemble production root and isolated preview directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/preview
          cp -a base/build/pages/. _site/
          cp -a preview-src/site/. _site/preview/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy preview without changing main root content
        id: deployment
        uses: actions/deploy-pages@v4

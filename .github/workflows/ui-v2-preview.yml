name: UI v2 GitHub Pages preview

on:
  push:
    branches: [codex/ui-v2-main-wip]
    paths:
      - 'site/**'
      - '.github/workflows/ui-v2-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Production-root-preserving v2 preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current production main
        uses: actions/checkout$v6
        with:
          ref: main
          path: base
      - name: Checkout preview branch
        uses: actions/checkout$v6
        with:
          ref: codex/ui-v2-main-wip
          path: preview-src
      - name: Setup Node 24
        uses: actions/setup-node$v6
        with:
          node-version: '24'
      - name: Stamp each tree with its own commit
        shell: bash
        run: |
          set -euo pipefail
          for tree in base preview-src; do
            (
              cd "$tree"
              sha="$((git rev-parse HEAD)"
              printf '{"commit":"%s"}\n' "$sha" > site/build-info.json
              node scripts/stamp-pages-assets.mjs "$sha"
            )
          done
      - name: Assemble production root and isolated preview directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/preview
          cp -a base/site/. _site/
          cp -a preview-src/site/. _site/preview/
      - name: Configure Pages
        uses: actions/configure-pages$v5
      - name: Upload static site
        uses: actions/upload-pages-artifact$v4
        with:
          path: _site
      - name: Deploy preview without changing main root content
        id: deployment
        uses: actions/deploy-pages$v4

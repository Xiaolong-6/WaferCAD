name: PR290 Native Draw Process interaction

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/v2/check-source-sunset-draw-process.mjs'
      - 'site/tests/source-sunset-draw-process-owner.test.mjs'
      - '.github/workflows/legacy-interaction-native-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: pr290-draw-process-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-draw-process:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 290 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WAFERCAD_V2_BASE: http://127.0.0.1:4173
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.1
      - run: npx playwright install --with-deps chromium
      - name: Start production v2 app
        run: |
          python3 -m http.server 4173 --directory site >/tmp/pr290-native-interaction.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/app.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pr290-native-interaction.log
          exit 1
      - name: Native v2 Draw source, Process Worker and Recovery science
        run: node scripts/v2/check-source-sunset-draw-process.mjs
      - name: Preserve real-browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pr290-draw-process-${{ github.sha }}
          path: |
            test-results/pr290-draw-process-interaction/
            /tmp/pr290-native-interaction.log
          retention-days: 7
          if-no-files-found: ignore

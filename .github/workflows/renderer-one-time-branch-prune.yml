name: One-time renderer branch pruning
on:
  push:
    branches: [perf/renderer-v4-adaptive-tiles-20261010]
    paths: [.github/workflows/renderer-one-time-branch-prune.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    if: github.repository == 'Xiaolong-6/WaferCAD'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Check provenance and delete only two redundant refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/perf/transparent-renderer-v3-20261009:refs/remotes/origin/perf/transparent-renderer-v3-20261009 \
            +refs/heads/perf/renderer-v4-adaptive-tiles-20261010:refs/remotes/origin/perf/renderer-v4-adaptive-tiles-20261010 \
            +refs/heads/fix/renderer-lifecycle-20261012:refs/remotes/origin/fix/renderer-lifecycle-20261012
          test "$(git rev-parse origin/perf/transparent-renderer-v3-20261009)" = 4e7128042fb5ef86908e4ee7e3df7084ae7ce52f
          test "$(git rev-parse origin/fix/renderer-lifecycle-20261012)" = 2ed5490a64a92827a5cf1780f55e256ced26b4a5
          git merge-base --is-ancestor origin/perf/transparent-renderer-v3-20261009 origin/perf/renderer-v4-adaptive-tiles-20261010
          git merge-base --is-ancestor 14ea64f89fbd903cb8b5b9b4da44f53c218c249e origin/main
          test "$(gh api repos/${{ github.repository }}/pulls/183 --jq '.merged')" = true
          test "$(gh api repos/${{ github.repository }}/pulls/166 --jq '.state')" = closed
          test "$(gh api repos/${{ github.repository }}/pulls/174 --jq '.base.ref')" = main
          git push origin --delete \
            perf/transparent-renderer-v3-20261009 \
            fix/renderer-lifecycle-20261012
          echo 'Renderer experimental line consolidated to perf/renderer-v4-adaptive-tiles-20261010'

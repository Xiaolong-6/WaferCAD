name: Legacy to v2 cross-interface retirement parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v2/check-legacy-cross-ui-recovery.mjs'
      - 'scripts/v2/check-cross-ui-recovery.mjs'
      - 'site/app-legacy.html'
      - 'site/app.js'
      - 'site/workspace-persistence*.js'
      - 'site/project-*.js'
      - 'site/startup-file.js'
      - 'site/controllers/workspace-persistence-controller.js'
      - 'site/controllers/workspace-session-controller.js'
      - 'site/ui-v2/workstation-entry.js'
      - 'site/ui-v2/workstation-workflow.js'
      - 'site/ui-v2/project-mask-panels.js'
      - '.github/workflows/legacy-cross-ui-retirement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start local Workstation server with retained Legacy test entry
        shell: bash
        run: |
          node scripts/v2/serve-v2.mjs > serve-v2.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent --output /dev/null http://127.0.0.1:4182/app-legacy.html && exit 0
            sleep 1
          done
          cat serve-v2.log
          exit 1
      - name: Verify actual Legacy and v2 interoperability before retiring source
        run: node scripts/v2/check-legacy-cross-ui-recovery.mjs
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: legacy-cross-ui-retirement-failure
          path: serve-v2.log
          retention-days: 14

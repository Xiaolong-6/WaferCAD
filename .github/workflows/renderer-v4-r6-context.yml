name: Renderer V4 R6 WebGL context recovery

on:
  push:
    branches:
      - perf/renderer-v4-adaptive-tiles-20261010
    paths:
      - site/three-view.js
      - site/renderer-v4-resource-lifetime.js
      - scripts/renderer-v4-r6-context-browser.mjs
      - .github/workflows/renderer-v4-r6-context.yml

permissions:
  contents: read

concurrency:
  group: renderer-v4-r6-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-v4-r6.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/app.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wafercad-v4-r6.log
          exit 1
      - name: Loss/restore and post-recovery frame gate
        run: node scripts/renderer-v4-r6-context-browser.mjs
      - name: Save R6 diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: renderer-v4-r6-context
          path: test-results/renderer-v4-r6-context/
          if-no-files-found: warn
          retention-days: 14

name: Offline WaferCAD source bundle

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  bundle:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'source-only-bundle')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build source-only ZIP without npm or Three.js
        id: bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import zipfile
          from pathlib import Path

          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tracked = [os.fsdecode(p) for p in subprocess.check_output(
              ["git", "ls-files", "-z"]).split(b"\0") if p]
          excluded = {"vendor/npm/three-0.179.1.tgz"}
          files = [name for name in tracked if name not in excluded]
          output = Path(f"wafercad-source-{sha}.zip")
          manifest = {"schema": "wafercad-source-only-v1", "revision": sha,
                      "trackedFiles": len(tracked), "packagedFiles": len(files),
                      "excludedDependencyArchives": sorted(set(tracked) & excluded), "files": {}}
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED,
                               compresslevel=6) as archive:
              for name in files:
                  path = Path(name)
                  if not path.is_file() or path.is_symlink():
                      raise ValueError(f"Missing or unsafe source file: {name}")
                  content = path.read_bytes()
                  manifest["files"][name] = hashlib.sha256(content).hexdigest()
                  archive.writestr(name, content)
              archive.writestr("wafercad-source-manifest.json",
                               json.dumps(manifest, sort_keys=True, indent=2) + "\n")
          print(json.dumps({"revision": sha, "tracked": len(tracked),
                            "packaged": len(files), "zipBytes": output.stat().st_size}, indent=2))
          PY
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: wafercad-source-${{ steps.bundle.outputs.sha }}
          path: wafercad-source-${{ steps.bundle.outputs.sha }}.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  pinned-browser-deps:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.label.name == 'offline-playwright-deps'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Transfer exact locked Playwright packages (no tests)
        shell: bash
        run: |
          npm pack playwright@1.55.1 --ignore-scripts --pack-destination .
          npm pack playwright-core@1.55.1 --ignore-scripts --pack-destination .
          node - <<'JS'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          for (const name of ['playwright', 'playwright-core']) {
            const file = `${name}-1.55.1.tgz`;
            const actual = 'sha512-' + crypto.createHash('sha512').update(fs.readFileSync(file)).digest('base64');
            const expected = lock.packages[`node_modules/${name}`].integrity;
            if (actual !== expected) throw Error(`Pinned archive mismatch: ${name}`);
          }
          JS
      - uses: actions/upload-artifact@v6
        with:
          name: offline-playwright-1.55.1
          path: |
            playwright-1.55.1.tgz
            playwright-core-1.55.1.tgz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

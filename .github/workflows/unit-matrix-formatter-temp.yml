name: Temporary unit matrix formatter
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/unit-matrix-formatter-temp.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/physical-unit-shape-matrix-20261013
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format isolated regression script
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ./node_modules/.bin/prettier --write scripts/v2/check-open-mask-unit-editor.mjs
          git add scripts/v2/check-open-mask-unit-editor.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(test): format unit shape browser matrix"
            git push origin HEAD:refs/heads/test/physical-unit-shape-matrix-20261013
          fi

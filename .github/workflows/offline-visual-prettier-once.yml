name: One-time offline visual Prettier export
on:
  push:
    branches: [feat/offline-visual-kernel-20261017]
    paths: ['.github/workflows/offline-visual-prettier-once.yml']
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pinned local dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Export exact Prettier 3.9.9 normalization
        run: |
          ./node_modules/.bin/prettier --write scripts/v2/capture-photodetector-rough-roi.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const path = 'scripts/v2/capture-photodetector-rough-roi.mjs';
          console.log('WAFERCAD_ROUGH_FORMAT:' + JSON.stringify({
            path, contentBase64: readFileSync(path).toString('base64'),
          }));
          NODE

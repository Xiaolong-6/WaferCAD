name: One-shot PR242 M3D Power Via Repair

on:
  push:
    branches:
      - audit/example-literature-fidelity-20261014
    paths:
      - '.github/workflows/one-shot-pr242-m3d-power-via.yml'

permissions:
  contents: write

jobs:
  reconstruct:
    if: ${{ github.repository == 'Xiaolong-6/WaferCAD' && github.ref == 'refs/heads/audit/example-literature-fidelity-20261014' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preflight updated mask + scientific contracts
        run: |
          node --test site/tests/m3d-reconstruction-regression.test.mjs
          npx prettier --check scripts/m3d-kernel-full-replay.mjs site/tests/literature-large-stack-contracts.test.mjs site/tests/m3d-reconstruction-regression.test.mjs
      - name: Rebuild all 36 M3D History nodes and 27 bookmarks via Kernel
        run: node scripts/m3d-kernel-full-replay.mjs --write-repo
      - name: Update published asset, executable Recipe and read-only preview
        run: |
          cp examples/projects/m3d-selfpowered-2026-replay/M3D_selfpowered_full_replay.wafercad site/examples/m3d-selfpowered-full-replay.wafercad
          node scripts/maintenance/backfill-example-recipes.mjs --write --id=m3d-selfpowered-full-replay
          cp site/examples/m3d-selfpowered-full-replay.wafercad examples/projects/m3d-selfpowered-2026-replay/M3D_selfpowered_full_replay.wafercad
          node scripts/build-example-previews.mjs --id=m3d-selfpowered-heterogeneous-ic --write
      - name: Check physical power-via continuity in generated publication
        run: |
          node --test site/tests/literature-large-stack-contracts.test.mjs site/tests/m3d-bundled-example.test.mjs
      - name: Install Chromium and start static preview
        run: |
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory site > /tmp/wafercad-m3d-242.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wafercad-m3d-242.log
          exit 1
      - name: Regenerate actual Chromium M3D thumbnail and digest
        run: |
          node scripts/build-example-thumbnails.mjs --id=m3d-selfpowered-heterogeneous-ic
          node scripts/m3d-welcome-regression.mjs
      - name: Commit synchronized scientific assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/projects/m3d-selfpowered-2026-replay site/examples/m3d-selfpowered-full-replay.wafercad site/examples/previews/m3d-selfpowered-heterogeneous-ic.wafercad site/examples/thumbnails/m3d-selfpowered-heterogeneous-ic-three.webp tests/fixtures/project-io/example-thumbnails.json
          git diff --cached --quiet || git commit -m 'fix(science): rebuild M3D power vias without HfO2 isolation'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pr242-m3d-power-via-scientific-evidence
          path: |
            test-results/m3d/kernel-full-replay
            test-results/m3d/welcome
          if-no-files-found: warn
          retention-days: 14

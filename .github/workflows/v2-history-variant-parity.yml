name: V2 History Variant parity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-history-variant-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  history-variant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start production v2 Workstation
        shell: bash
        run: |
          node scripts/v2/serve-v2.mjs > serve-v2.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent --output /dev/null http://127.0.0.1:4182/app.html && exit 0
            sleep 1
          done
          cat serve-v2.log
          exit 1
      - name: Verify exact physical History and Variant copy-on-write
        env:
          WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
        run: node scripts/v2/check-history-variant-parity.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v2-history-variant-review
          path: |
            test-results/v2-history-branch/history-variant.png
            serve-v2.log
          if-no-files-found: ignore
          retention-days: 14

name: M3D precharge targeted acceptance

on:
  push:
    branches:
      - feat/m3d-precharge-geometry-20261017
    paths:
      - .github/workflows/m3d-precharge-targeted.yml

permissions:
  contents: read

jobs:
  scientific-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Replay source with real Kernel and check committed fixture
        run: |
          node scripts/build-m3d-lime-example.mjs --write-repo
          git diff --exit-code -- site/examples/m3d-lime-rram-cntfet.wafercad
      - name: Assert 15 CNTFET / 14 RRAM contact and native ALD science
        run: node --test site/tests/m3d-lime-builder.test.mjs site/tests/m3d-lime-ald45-regression.test.mjs
      - name: Install real Chromium
        run: npx playwright install --with-deps chromium
      - name: Start production v2 workstation
        shell: bash
        run: |
          node scripts/v2/serve-v2.mjs > /tmp/m3d-v2-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4182/app.html; then exit 0; fi
            sleep 1
          done
          cat /tmp/m3d-v2-server.log
          exit 1
      - name: Native Chromium Run All, Section, precharge 3D and export
        env:
          WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
        run: node scripts/v2/check-m3d-lime-project.mjs
      - name: Validate true GDSII and OASIS using KLayout
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir klayout==0.30.12
          python3 scripts/klayout-m3d-lime-verify.py test-results/m3d-lime/browser
      - name: Upload exact native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3d-precharge-scientific-${{ github.sha }}
          path: |
            test-results/m3d-lime/validation.json
            test-results/m3d-lime/klayout-m3d-lime.json
            test-results/m3d-lime/browser/
          if-no-files-found: warn
          retention-days: 14

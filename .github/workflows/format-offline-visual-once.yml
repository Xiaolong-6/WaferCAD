name: One-time read-only formatting extract
on:
  push:
    branches:
      - feat/offline-visual-kernel-20261017
    paths:
      - .github/workflows/format-offline-visual-once.yml
permissions:
  contents: read
jobs:
  formatting:
    if: startsWith(github.event.head_commit.message, 'chore(devtools): temporary read-only formatting extract')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Normalize only the reported formatting failures
        run: |
          ./node_modules/.bin/prettier --write \
            site/tests/offline-mask-svg.test.mjs \\
            site/tests/offline-source-revision.test.mjs \\
            site/tests/offline-three-mesh.test.mjs \\
            site/tests/offline-visual-svg.test.mjs \\
            site/tests/process-task-controller.test.mjs \\
            site/tests/visual-first-contract.test.mjs \\
            scripts/offline-chat-native-export.mjs \\
            scripts/offline-mask-svg.mjs \\
            scripts/offline-native-project-export.mjs \\
            scripts/offline-source-revision.mjs \\
            scripts/offline-three-capture.mjs \\
            scripts/offline-three-mesh.mjs \\
            scripts/offline-ui-capture.mjs \\
            scripts/offline-visual-kernel.mjs \\
            scripts/offline-visual-svg.mjs \\
            scripts/v2/capture-visual-first.mjs \\
            scripts/v2/visual-first-contract.mjs \\
            docs/CI.md \\
            docs/OFFLINE_CHAT_RUNTIME.md \\
            docs/OFFLINE_VISUAL_KERNEL.md
      - name: Emit changed source content as base64 for offline review
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const paths = ["site/tests/offline-mask-svg.test.mjs","site/tests/offline-source-revision.test.mjs","site/tests/offline-three-mesh.test.mjs","site/tests/offline-visual-svg.test.mjs","site/tests/process-task-controller.test.mjs","site/tests/visual-first-contract.test.mjs","scripts/offline-chat-native-export.mjs","scripts/offline-mask-svg.mjs","scripts/offline-native-project-export.mjs","scripts/offline-source-revision.mjs","scripts/offline-three-capture.mjs","scripts/offline-three-mesh.mjs","scripts/offline-ui-capture.mjs","scripts/offline-visual-kernel.mjs","scripts/offline-visual-svg.mjs","scripts/v2/capture-visual-first.mjs","scripts/v2/visual-first-contract.mjs","docs/CI.md","docs/OFFLINE_CHAT_RUNTIME.md","docs/OFFLINE_VISUAL_KERNEL.md"];
          for (const path of paths) {
            console.log('WAFERCAD_FORM_OUTPUT:' + JSON.stringify({path, contentBase64: readFileSync(path).toString('base64')}));
          }
          NODE

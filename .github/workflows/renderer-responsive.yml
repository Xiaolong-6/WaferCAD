name: Renderer responsive staging and preview

on:
  push:
    branches:
      - perf/renderer-v4-adaptive-tiles-20261010
    paths:
      - site/three-view.js
      - site/style.css
      - site/renderer-responsive-staging.js
      - site/renderer-responsive-budget.js
      - site/renderer-responsive-latency.js
      - site/renderer-responsive-jank.js
      - site/renderer-responsive-gpu-timer.js
      - site/tests/renderer-responsive-gpu-timer.test.mjs
      - site/tests/renderer-responsive-jank.test.mjs
      - site/tests/renderer-responsive-budget.test.mjs
      - site/tests/renderer-responsive-latency.test.mjs
      - site/renderer-v4-smooth-sidewall-data.js
      - site/renderer-v4-smooth-sidewall-worker.js
      - site/tests/renderer-v4-smooth-sidewall-data.test.mjs
      - site/tests/renderer-responsive-staging.test.mjs
      - scripts/renderer-responsive-browser.mjs
      - .github/workflows/renderer-responsive.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: renderer-responsive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Normalize new GPU probe sources once
        run: |
          npx prettier --write site/renderer-responsive-gpu-timer.js site/tests/renderer-responsive-gpu-timer.test.mjs
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add site/renderer-responsive-gpu-timer.js site/tests/renderer-responsive-gpu-timer.test.mjs
            git commit -m 'style(renderer): format GPU timer query experiment'
            git push origin HEAD:refs/heads/perf/renderer-v4-adaptive-tiles-20261010
          fi
      - name: Focused Node and source quality checks
        run: |
          node --test site/tests/renderer-responsive-staging.test.mjs site/tests/renderer-v4-smooth-sidewall-data.test.mjs site/tests/renderer-responsive-budget.test.mjs site/tests/renderer-responsive-latency.test.mjs site/tests/renderer-responsive-jank.test.mjs site/tests/renderer-responsive-gpu-timer.test.mjs
          npx eslint site/three-view.js site/renderer-responsive-staging.js site/renderer-v4-smooth-sidewall-data.js site/renderer-v4-smooth-sidewall-worker.js scripts/renderer-responsive-browser.mjs site/tests/renderer-responsive-staging.test.mjs site/tests/renderer-v4-smooth-sidewall-data.test.mjs site/renderer-responsive-budget.js site/renderer-responsive-latency.js site/tests/renderer-responsive-budget.test.mjs site/tests/renderer-responsive-latency.test.mjs site/renderer-responsive-jank.js site/tests/renderer-responsive-jank.test.mjs site/renderer-responsive-gpu-timer.js site/tests/renderer-responsive-gpu-timer.test.mjs
          npx prettier --check site/three-view.js site/style.css site/renderer-responsive-staging.js site/renderer-v4-smooth-sidewall-data.js site/renderer-v4-smooth-sidewall-worker.js site/tests/renderer-responsive-staging.test.mjs site/tests/renderer-v4-smooth-sidewall-data.test.mjs scripts/renderer-responsive-browser.mjs site/renderer-responsive-budget.js site/renderer-responsive-latency.js site/tests/renderer-responsive-budget.test.mjs site/tests/renderer-responsive-latency.test.mjs site/renderer-responsive-jank.js site/tests/renderer-responsive-jank.test.mjs site/renderer-responsive-gpu-timer.js site/tests/renderer-responsive-gpu-timer.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve WaferCAD
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-responsive.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/app.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wafercad-responsive.log
          exit 1
      - name: Transactional model staging browser acceptance
        run: node scripts/renderer-responsive-browser.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: renderer-responsive
          path: test-results/renderer-responsive/
          if-no-files-found: warn
          retention-days: 14

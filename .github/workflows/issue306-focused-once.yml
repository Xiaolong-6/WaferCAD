name: Issue 306 focused science and source bundle

on:
  push:
    branches:
      - fix/kernel-conformal-void-coverage-306-20261020
    paths:
      - .github/workflows/issue306-focused-once.yml

permissions:
  contents: read

jobs:
  issue306:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Verify old Main reproduces connected-Z bridge and patched HEAD fixes it
        shell: bash
        run: |
          set -euo pipefail
          cp site/model.js "${RUNNER_TEMP}/model-306-fixed.js"
          cp site/process-topology.js "${RUNNER_TEMP}/topology-306-fixed.js"
          git show 8acb64006ac52597b3bf1801fe9ff3ccab815422:site/model.js > site/model.js
          git show 8acb64006ac52597b3bf1801fe9ff3ccab815422:site/process-topology.js > site/process-topology.js
          if node --test site/tests/conformal-floating-gap.test.mjs > "${RUNNER_TEMP}/issue306-red.log" 2>&1; then
            cat "${RUNNER_TEMP}/issue306-red.log"
            echo "ERROR: old Main unexpectedly passed regression."
            exit 1
          fi
          cat "${RUNNER_TEMP}/issue306-red.log"
          grep -q 'false Z-spanning wall' "${RUNNER_TEMP}/issue306-red.log"
          cp "${RUNNER_TEMP}/model-306-fixed.js" site/model.js
          cp "${RUNNER_TEMP}/topology-306-fixed.js" site/process-topology.js
          node --test             site/tests/conformal-floating-gap.test.mjs             site/tests/conformal-crack-repair.test.mjs             site/tests/conformal-process.test.mjs             site/tests/process-topology.test.mjs             site/tests/process-topology-slab-coverage.test.mjs
      - name: Produce exact-SHA source-only ZIP with hash manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          paths = [os.fsdecode(p) for p in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0') if p]
          excluded = {'vendor/npm/three-0.179.1.tgz'}
          files = [p for p in paths if p not in excluded]
          manifest = {'schema': 'wafercad-source-only-v1', 'revision': sha,
                      'trackedFiles': len(paths), 'packagedFiles': len(files),
                      'excludedDependencyArchives': sorted(set(paths) & excluded), 'files': {}}
          with zipfile.ZipFile(f'wafercad-source-{sha}.zip', 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for p in files:
                  data = Path(p).read_bytes()
                  manifest['files'][p] = hashlib.sha256(data).hexdigest()
                  z.writestr(p, data)
              z.writestr('wafercad-source-manifest.json', json.dumps(manifest, indent=2, sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: wafercad-source-${{ github.sha }}
          path: wafercad-source-${{ github.sha }}.zip
          retention-days: 3
          compression-level: 0

name: Native Fig3 full replay acceptance

on:
  pull_request:
    paths:
      - "scripts/fig3-full-replay-acceptance.mjs"
      - "scripts/test-helpers/**"
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/native-fig3-full-replay.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-fig3-full-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start WaferCAD
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wafercad-http.log
          exit 1

      - name: Replay Native Fig3 from the initial state
        run: node scripts/fig3-full-replay-acceptance.mjs --verify-repo-examples

      - name: Run 625-site browser regression
        run: npm run test:ui:array

      - name: Refresh Native Fig3 Welcome preview
        run: |
          node scripts/build-example-previews.mjs --write --id=three-tier-silicon-jlfets
          node scripts/build-example-thumbnails.mjs --id=three-tier-silicon-jlfets

      - name: Commit refreshed Native Fig3 Welcome assets
        if: github.head_ref == 'test/native-fig3-full-replay-20261007'
        run: |
          if git diff --quiet --             site/examples/previews/three-tier-silicon-jlfets.wafercad             site/examples/thumbnails/three-tier-silicon-jlfets-three.webp             tests/fixtures/project-io/example-thumbnails.json; then
            echo "Native Fig3 Welcome assets already match the accepted formal example."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             site/examples/previews/three-tier-silicon-jlfets.wafercad             site/examples/thumbnails/three-tier-silicon-jlfets-three.webp             tests/fixtures/project-io/example-thumbnails.json
          git commit -m "examples: refresh Native Fig3 Welcome assets"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload full replay evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-fig3-full-replay
          path: test-results/native-fig3/full-replay/
          if-no-files-found: error
          retention-days: 14

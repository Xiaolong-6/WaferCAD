name: All Welcome Examples loading baseline

# Full nine-example Chromium benchmarking is intentionally opt-in.
# Routine PRs use the lean Quality and targeted scientific gates.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-baseline:
    name: Actual Chromium baseline shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run exactly three samples per Welcome project in headed Chromium
        env:
          WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
          WAFERCAD_V2_BASE: http://127.0.0.1:4173
          WAFERCAD_BENCH_HEADFUL: '1'
          WAFERCAD_PERF_REPEATS: '3'
          WAFERCAD_PERF_SHARD_INDEX: ${{ matrix.shard }}
          WAFERCAD_PERF_SHARD_COUNT: '3'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > /tmp/welcome-load-baseline-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          xvfb-run -a node scripts/perf-workstation-cold-open.mjs --welcome
      - name: Upload raw timings and real 3D/Section screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: welcome-baseline-shard-${{ matrix.shard }}
          path: test-results/welcome-load-baseline/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1

  summarize:
    name: Validate all project coverage and publish baseline
    needs: [browser-baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v6
        with:
          pattern: welcome-baseline-shard-*
          merge-multiple: true
          path: test-results/welcome-load-baseline/
      - name: Fail if any of nine Welcome projects or 27 samples are missing
        run: node scripts/summarize-welcome-loading.mjs test-results/welcome-load-baseline
      - uses: actions/upload-artifact@v6
        with:
          name: welcome-loading-baseline-all-nine-summary
          path: |
            test-results/welcome-load-baseline/summary.json
            test-results/welcome-load-baseline/summary.csv
            test-results/welcome-load-baseline/summary.md
          if-no-files-found: error
          retention-days: 30
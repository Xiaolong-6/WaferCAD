name: One-shot PERC GDS variant model rebaseline
on:
  push:
    branches:
      - audit/example-literature-fidelity-20261014
    paths:
      - .github/workflows/oneoff-perc-gds-fidelity-rebaseline.yml

concurrency:
  group: one-shot-perc-gds-variant-rebaseline
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair-gds:
    if: github.repository == 'Xiaolong-6/WaferCAD' && github.ref == 'refs/heads/audit/example-literature-fidelity-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Rebuild the PERC GDS Variant from its own 14-step Recipe
        env:
          WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > /tmp/perc-gds-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          node scripts/example-recipe-runall-acceptance.mjs --id=perc-point-contact-solar-cell --variant=branch-mutknd4v-hcdg7q --refresh-perc-gds-fixture
      - name: Sync source provenance and preview
        run: |
          node scripts/build-example-previews.mjs --write --id=perc-point-contact-solar-cell
          node scripts/maintenance/sync-example-recipe-previews.mjs --write
          node scripts/maintenance/backfill-example-recipes.mjs --id=perc-solar-cells-point-contacts
          git diff --check
      - name: Push exact scientific generated fixture to this PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/examples/perc-solar-cells-point-contacts.wafercad
          git add site/examples/previews/perc-point-contact-solar-cell.wafercad
          git add tests/fixtures/project-io/example-thumbnails.json
          git diff --cached --quiet && exit 1 || true
          git commit -m "fix(science): align PERC GDS silver contact Variant with current Kernel replay"
          git push origin HEAD:refs/heads/audit/example-literature-fidelity-20261014
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perc-gds-rebaseline-diagnostic
          path: |
            test-results/example-recipe-runall/
            /tmp/perc-gds-server.log
          if-no-files-found: ignore
          retention-days: 7

name: T-CMOS merged fixture drift diagnostic (temporary)

on:
  push:
    branches:
      - feat/tcmos-ternary-inverter-example-20261014
    paths:
      - .github/workflows/tcmos-merged-fixture-diff-once.yml

permissions:
  contents: read

jobs:
  inspect-fixture-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate exact candidate and enumerate every semantic change (no baseline rewrite)
        run: |
          node scripts/build-tcmos-inverter-example.mjs
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const base = 'examples/projects/tcmos-ternary-inverter-2019-candidate/tcmos-ternary-inverter-130nm.wafercad';
          const output = 'test-results/tcmos/tcmos-ternary-inverter-130nm.wafercad';
          const before = JSON.parse(readFileSync(base, 'utf8'));
          const after = JSON.parse(readFileSync(output, 'utf8'));
          const differences = [];
          const walk = (a, b, path) => {
            if (Object.is(a,b)) return;
            if (!a || !b || typeof a !== 'object' || typeof b !== 'object' || Array.isArray(a)!==Array.isArray(b)) {
              differences.push({path,from:JSON.stringify(a)?.slice(0,120),to:JSON.stringify(b)?.slice(0,120)});
              return;
            }
            for (const key of new Set([...Object.keys(a),...Object.keys(b)])) {
              if (!(key in a)||!(key in b)) {
                differences.push({path:path+'/'+key,from:key in a?JSON.stringify(a[key])?.slice(0,120):'<missing>',to:key in b?JSON.stringify(b[key])?.slice(0,120):'<missing>'});
              } else walk(a[key],b[key],path+'/'+key);
            }
          };
          walk(before, after, '');
          console.log('FIELD_DIFFERENCE_COUNT='+differences.length);
          const tally = {};
          for(const d of differences) {
            const category = d.path.replace(/\/\d+(?=\/|$)/g, '/#');
            tally[category] = (tally[category] || 0) + 1;
          }
          console.log('SEMANTIC_DIFFERENCES='+JSON.stringify(Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,75)));
          console.log('EXAMPLE_DIFFERENCES='+JSON.stringify(differences.slice(0,25)));
          JS

name: Renderer responsive rough assembly gate

on:
  push:
    branches:
      - perf/renderer-v4-adaptive-tiles-20261010
    paths:
      - site/three-view.js
      - site/renderer-responsive-budget.js
      - site/renderer-responsive-latency.js
      - scripts/renderer-responsive-rough-browser.mjs
      - .github/workflows/renderer-responsive-rough.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: renderer-responsive-rough-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rough-assembly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Normalize rough browser test formatting
        run: |
          npx prettier --write scripts/renderer-responsive-rough-browser.mjs
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add scripts/renderer-responsive-rough-browser.mjs
            git commit -m 'style(renderer): format cooperative rough acceptance'
            git push origin HEAD:refs/heads/perf/renderer-v4-adaptive-tiles-20261010
          fi
      - name: Check single regression file
        run: npx eslint scripts/renderer-responsive-rough-browser.mjs && npx prettier --check scripts/renderer-responsive-rough-browser.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve WaferCAD
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-responsive-rough.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/app.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wafercad-responsive-rough.log
          exit 1
      - name: Multi-layer rough mesh scheduling browser acceptance
        run: node scripts/renderer-responsive-rough-browser.mjs
      - name: Preserve rough assembly evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: renderer-responsive-rough
          path: test-results/renderer-responsive-rough/
          if-no-files-found: warn
          retention-days: 14

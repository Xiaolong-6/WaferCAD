name: Renderer responsive rough assembly gate

on:
  push:
    branches:
      - perf/renderer-v4-adaptive-tiles-20261010
    paths:
      - site/three-view.js
      - site/renderer-responsive-budget.js
      - site/renderer-responsive-gpu-prewarm.js
      - site/tests/renderer-responsive-gpu-prewarm.test.mjs
      - site/renderer-responsive-latency.js
      - scripts/renderer-responsive-rough-browser.mjs
      - .github/workflows/renderer-responsive-rough.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderer-responsive-rough-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rough-assembly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check GPU prewarm scheduler and rough browser script
        run: |
          node --test site/tests/renderer-responsive-gpu-prewarm.test.mjs
          npx eslint scripts/renderer-responsive-rough-browser.mjs site/renderer-responsive-gpu-prewarm.js site/tests/renderer-responsive-gpu-prewarm.test.mjs
          npx prettier --check scripts/renderer-responsive-rough-browser.mjs site/renderer-responsive-gpu-prewarm.js site/tests/renderer-responsive-gpu-prewarm.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve WaferCAD
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-responsive-rough.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/app.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wafercad-responsive-rough.log
          exit 1
      - name: Multi-layer rough mesh scheduling browser acceptance
        run: node scripts/renderer-responsive-rough-browser.mjs
      - name: Preserve rough assembly evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: renderer-responsive-rough
          path: test-results/renderer-responsive-rough/
          if-no-files-found: warn
          retention-days: 14

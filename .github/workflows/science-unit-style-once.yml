name: One-time physical science target tests and formatting

on:
  push:
    branches: [science/physical-facets-297]

permissions:
  contents: read

jobs:
  three-owners:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run precise owner tests and display formatter-only differences
        shell: bash
        run: |
          set -euo pipefail
          for branch in science/physical-facets-297 science/smooth-release-298 science/figure-provenance-299; do
            echo "::group::OWNER ${branch}"
            git fetch --depth=1 origin "refs/heads/${branch}"
            git checkout --force --detach FETCH_HEAD
            case "$branch" in
              science/physical-facets-297)
                node --test site/tests/physical-facet-math.test.mjs site/tests/physical-facet-owner.test.mjs
                files=(site/physical-facet-owner.js site/tests/physical-facet-owner.test.mjs docs/PHYSICAL_FACET_MODELING_2026-10-16.md)
                ;;
              science/smooth-release-298)
                node --test site/tests/isotropic-release-oracle.test.mjs
                files=(site/isotropic-release-oracle.js site/tests/isotropic-release-oracle.test.mjs docs/ISOTROPIC_RELEASE_ORACLE_2026-10-16.md)
                ;;
              science/figure-provenance-299)
                node --test site/tests/literature-provenance-matrix.test.mjs
                files=(scripts/example-literature-visual-evidence.mjs docs/SCIENCE_FIGURE_EVIDENCE_2026-10-16.md)
                ;;
            esac
            npx --no-install prettier --write "${files[@]}"
            git --no-pager diff -- "${files[@]}"
            echo "::endgroup::"
          done

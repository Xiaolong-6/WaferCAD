name: PR264 staged Assembly formatter (read-only)
on:
  pull_request:
    types: [synchronize]
    branches: [feat/example-gan-hemt-microchannel-20261014]
    paths:
      - .github/workflows/pr264-startup-format-once.yml
permissions:
  contents: read
jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format only the newly introduced startup/route files
        run: |
          npx prettier --write site/assembly-startup-routing.js site/welcome.js site/tests/assembly-startup-routing.test.mjs
          git diff --check
      - name: Display exact formatter patch without repository write
        run: |
          git diff --no-ext-diff -- site/assembly-startup-routing.js site/welcome.js site/tests/assembly-startup-routing.test.mjs

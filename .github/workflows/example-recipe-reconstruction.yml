name: Example Recipe Reconstruction

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'site/**'
      - 'scripts/maintenance/**'
      - 'scripts/example-recipe-runall-acceptance.mjs'
      - '.github/workflows/example-recipe-reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-check:
    # Full fixture/replay certification is deferred while the integration PR is Draft.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Verify committed Recipe and mask fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify regenerated project recipes without mutating repository
        run: |
          node scripts/maintenance/backfill-example-recipes.mjs
          node scripts/maintenance/rebuild-photodetectors.mjs
          node scripts/maintenance/sync-example-recipe-previews.mjs
          node --test site/tests/example-recipe-audit.test.mjs site/tests/example-mask-export.test.mjs
          git diff --exit-code
  replay:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Kernel Run All / ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: photodetector-literature
            options: '--id=photodetector-literature'
          - example: photodetector-ge-a
            options: '--id=photodetector-literature --variant=ge-fig15-a'
          - example: photodetector-ge-b
            options: '--id=photodetector-literature --variant=ge-fig15-b'
          - example: perc-point-contact-solar-cell
            options: '--id=perc-point-contact-solar-cell'
          - example: fully-textured-perovskite-silicon-tandem
            options: '--id=fully-textured-perovskite-silicon-tandem'
          - example: suspended-silica-microdisk
            options: '--id=suspended-silica-microdisk'
          - example: suspended-silica-keep-history
            options: '--id=suspended-silica-microdisk --history=keep'
          - example: m3d-selfpowered-heterogeneous-ic
            options: '--id=m3d-selfpowered-heterogeneous-ic'
          - example: three-tier-silicon-jlfets
            options: '--id=three-tier-silicon-jlfets'
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Rebuild from Base, inspect and export
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > /tmp/wafercad-example-replay.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          node scripts/example-recipe-runall-acceptance.mjs ${{ matrix.options }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: example-replay-${{ matrix.example }}
          path: test-results/example-recipe-runall/
          retention-days: 14
          if-no-files-found: ignore

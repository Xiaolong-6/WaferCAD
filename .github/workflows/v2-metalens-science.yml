name: V2 TiO2 Metalens nine-Step science

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-metalens-science-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-metalens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify focused browser script formatting
        shell: bash
        run: |
          set -euo pipefail
          npx prettier scripts/v2/check-metalens-recipe-science.mjs | diff -u scripts/v2/check-metalens-recipe-science.mjs -
      - run: npx playwright install --with-deps chromium
      - name: Start real v2 Workstation
        shell: bash
        run: |
          node scripts/v2/serve-v2.mjs > serve-v2.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent --output /dev/null http://127.0.0.1:4182/app.html && exit 0
            sleep 1
          done
          cat serve-v2.log
          exit 1
      - name: Replay native Metalens nine-Step Worker and scientific History
        timeout-minutes: 25
        env:
          WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
        run: node scripts/v2/check-metalens-recipe-science.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v2-metalens-nine-step-science
          path: |
            test-results/v2-metalens-science
            serve-v2.log
          if-no-files-found: ignore
          retention-days: 14

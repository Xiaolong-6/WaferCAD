name: T-CMOS source metal connectivity probe (temporary)

on:
  push:
    branches: [feat/tcmos-ternary-inverter-example-20261014]
    paths:
      - '.github/workflows/tcmos-interconnect-probe-once.yml'

permissions:
  contents: read

jobs:
  scientific-interconnect:
    if: github.repository == 'Xiaolong-6/WaferCAD'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run source SVG metal and native-array contracts
        run: node --test site/tests/tcmos-svg-metal-connectivity.test.mjs
      - name: Check new source formatting
        run: npx prettier --check site/tests/tcmos-svg-metal-connectivity.test.mjs

name: Bootstrap unassembled GaN native project assets

on:
  push:
    branches:
      - feat/example-gan-hemt-microchannel-20261014
    paths:
      - scripts/build-gan-hemt-unassembled-components.mjs
      - .github/workflows/gan-unassembled-asset-generation.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/feat/example-gan-hemt-microchannel-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate independent native Main histories
        run: node scripts/build-gan-hemt-unassembled-components.mjs --write-repo
      - name: Format generator and verify artifact names
        run: |
          npx --no-install prettier --write scripts/build-gan-hemt-unassembled-components.mjs
          test -s site/examples/gan-microchannel-interposer-2022.wafercad
          test -s site/examples/gan-hemt-die-2022.wafercad
          test -s site/examples/gan-gsg-left-die-2022.wafercad
          test -s site/examples/gan-gsg-right-die-2022.wafercad
          test -s site/examples/previews/gan-microchannel-interposer-2022.wafercad
          test -s site/examples/previews/gan-hemt-die-2022.wafercad
          test -s site/examples/previews/gan-gsg-left-die-2022.wafercad
          test -s site/examples/previews/gan-gsg-right-die-2022.wafercad
      - name: Commit native artifacts only to current feature branch
        run: |
          test "$GITHUB_REF_NAME" = 'feat/example-gan-hemt-microchannel-20261014'
          git add scripts/build-gan-hemt-unassembled-components.mjs
          git add site/examples/gan-*-die-2022.wafercad
          git add site/examples/gan-microchannel-interposer-2022.wafercad
          git add site/examples/gan-hemt-unassembled-components.json
          git add site/examples/previews/gan-*-die-2022.wafercad
          git add site/examples/previews/gan-microchannel-interposer-2022.wafercad
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'assets(gan): persist independent unassembled workpiece Mains [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

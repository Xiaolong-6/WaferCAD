name: One-time science formatting diagnostics

on:
  push:
    branches:
      - science/figure-provenance-299

permissions:
  contents: read

jobs:
  exact-prettier-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout and install repo formatter
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read-only exact formatting patches
        shell: bash
        run: |
          set -euo pipefail
          for branch in science/physical-facets-297 science/smooth-release-298 science/figure-provenance-299; do
            echo "::group::FORMAT_DIFF ${branch}"
            git fetch --depth=1 origin "refs/heads/${branch}"
            git checkout --force --detach FETCH_HEAD
            case "$branch" in
              science/physical-facets-297)
                files=(site/tests/physical-facet-math.test.mjs docs/PHYSICAL_FACET_MODELING_2026-10-16.md)
                ;;
              science/smooth-release-298)
                files=(docs/ISOTROPIC_RELEASE_ORACLE_2026-10-16.md)
                ;;
              science/figure-provenance-299)
                files=(site/tests/literature-provenance-matrix.test.mjs)
                ;;
            esac
            npx --no-install prettier --write "${files[@]}"
            git --no-pager diff -- "${files[@]}"
            echo "::endgroup::"
          done

name: Pages staged-artifact PR smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - '.github/workflows/pages-artifact-smoke.yml'
      - 'scripts/build-pages-artifact.mjs'
      - 'scripts/stamp-pages-assets.mjs'
      - 'scripts/smoke-pages-artifact.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Verify staged Pages before merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.1
      - run: npx playwright install --with-deps chromium
      - name: Stage the production tree with its exact revision
        run: |
          node scripts/build-pages-artifact.mjs
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > build/pages/build-info.json
          node scripts/stamp-pages-assets.mjs "$GITHUB_SHA" build/pages
      - name: Execute staged Pages browser and Worker smoke
        run: node scripts/smoke-pages-artifact.mjs

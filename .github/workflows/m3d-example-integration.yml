name: M3D welcome integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/bundled-examples.js'
      - 'site/examples/m3d-selfpowered-full-replay.wafercad'
      - 'site/examples/previews/m3d-selfpowered-heterogeneous-ic.wafercad'
      - 'site/three-view.js'
      - 'site/ui-v2/three-view.js'
      - 'site/ui-v2/workstation-workflow.js'
      - 'scripts/m3d-welcome-regression.mjs'
      - '.github/workflows/m3d-example-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Catalog, project IO and M3D browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start WaferCAD
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-m3d-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wafercad-m3d-http.log
          exit 1
      - name: Generate M3D final-state thumbnail and SHA manifest
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/build-example-thumbnails.mjs --id=m3d-selfpowered-heterogeneous-ic
      - name: M3D, History and 3D Border regression
        run: |
          node --check site/three-view.js
          node --test site/tests/m3d-bundled-example.test.mjs site/tests/m3d-reconstruction-regression.test.mjs site/tests/snapshots.test.mjs site/tests/process-topology.test.mjs site/tests/issue-11-3d-controls.test.mjs
      - name: Full Legacy M3D science and export acceptance (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/m3d-visual-acceptance.mjs
      - name: Welcome-card open and preview regression
        run: node scripts/m3d-welcome-regression.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: m3d-example-integration
          path: test-results/m3d/
          retention-days: 14
          if-no-files-found: warn

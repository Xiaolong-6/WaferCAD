name: T-CMOS 4x4 validated project sync (temporary)
# One-shot scoped Recovery / scientific acceptance and verified 4x4 project synchronization.

on:
  push:
    branches: [feat/tcmos-ternary-inverter-example-20261014]
    paths:
      - '.github/workflows/tcmos-recipe-science-probe-once.yml'

permissions: {}

jobs:
  recipe-science:
    if: github.repository == 'Xiaolong-6/WaferCAD'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Geometry and Recipe preflight only
        run: |
          node --test site/tests/tcmos-array-recipe-experiment.test.mjs site/tests/model-array.test.mjs site/tests/mask-instance-index.test.mjs
          node scripts/build-tcmos-array-recipe-experiment.mjs
      - name: Real Chromium 16-cell Recipe Run All and strict parity
        timeout-minutes: 30
        env:
          WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
          WAFERCAD_V2_BASE: http://127.0.0.1:4173
        run: |
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > /tmp/tcmos-array-recipe-probe.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          node scripts/tcmos-array-recipe-browser-acceptance.mjs
      - name: Commit only the verified 4x4 Recipe + History project
        env:
          TARGET_BRANCH: feat/tcmos-ternary-inverter-example-20261014
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test -s test-results/tcmos/tcmos-4x4-replayed.wafercad
          node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('test-results/tcmos/tcmos-4x4-replayed.wafercad'));if(p.model.kernel!=='vector-2.5d-array-v1'||p.layout.elements.length!==3712||p.processRecipe.steps.length!==23||p.snapshotBranches.nodes.length<23)throw Error('The generated file is not the full accepted Recipe+History');"
          cp test-results/tcmos/tcmos-4x4-replayed.wafercad examples/projects/tcmos-ternary-inverter-2019-candidate/tcmos-inverter-4x4-replayed.wafercad
          git add -- examples/projects/tcmos-ternary-inverter-2019-candidate/tcmos-inverter-4x4-replayed.wafercad
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "test(tcmos): persist accepted native 4x4 Recipe and Recovery geometry"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
      - name: Upload the exact experimental candidate
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tcmos-4x4-recipe-experiment-probe
          path: test-results/tcmos/
          retention-days: 7
          if-no-files-found: ignore

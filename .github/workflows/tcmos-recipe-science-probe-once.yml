name: T-CMOS 4x4 Recipe science probe (temporary)
# Iteration 5: canonicalize translated masks on existing CAD precision grid; keep strict Schema.

on:
  push:
    branches: [feat/tcmos-ternary-inverter-example-20261014]
    paths:
      - '.github/workflows/tcmos-recipe-science-probe-once.yml'

permissions:
  contents: read

jobs:
  recipe-science:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Geometry and Recipe preflight only
        run: |
          node --test site/tests/tcmos-array-recipe-experiment.test.mjs site/tests/model-array.test.mjs
          node scripts/build-tcmos-array-recipe-experiment.mjs
      - name: Real Chromium 16-cell Recipe Run All and strict parity
        timeout-minutes: 30
        env:
          WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
          WAFERCAD_V2_BASE: http://127.0.0.1:4173
        run: |
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > /tmp/tcmos-array-recipe-probe.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          node scripts/tcmos-array-recipe-browser-acceptance.mjs
      - name: Upload the exact experimental candidate
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tcmos-4x4-recipe-experiment-probe
          path: test-results/tcmos/
          retention-days: 7
          if-no-files-found: ignore

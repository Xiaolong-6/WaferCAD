name: Renderer R9 temporary format inspection
on:
  push:
    branches: [perf/renderer-v4-adaptive-tiles-20261010]
    paths: [.github/workflows/renderer-r9-temp-format-inspection.yml]
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print exact Prettier diffs
        shell: bash
        run: |
          for file in \
            scripts/renderer-electrical-same-context-ab.mjs \
            scripts/renderer-v4-pr177-default-smoke.mjs \
            docs/RENDERER_MAIN_ALIGNMENT_2026-10-12.md \
            docs/RENDERER_R9_HARDWARE_RUNBOOK_2026-10-12.md \
            docs/RENDERER_R9_INTEL_IRIS_XE_HARDWARE_2026-10-12.md \
            docs/RENDERER_R9_RTX3060_HARDWARE_2026-10-12.md \
            docs/RENDERER_V3_DITHER_DIAGNOSTIC_2026-10-12.md \
            docs/RENDERER_V3_V4_RTX3060_ACCEPTANCE_2026-10-12.md; do
            npx prettier "$file" | diff -u "$file" - || true
          done

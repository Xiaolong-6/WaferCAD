name: One-shot PR242 M2 source fixture rebase

on:
  push:
    branches:
      - audit/example-literature-fidelity-20261014
    paths:
      - '.github/workflows/one-shot-pr242-m2-fixture-rebase.yml'

permissions:
  contents: write

jobs:
  rebase-mock-reference:
    if: ${{ github.repository == 'Xiaolong-6/WaferCAD' && github.ref == 'refs/heads/audit/example-literature-fidelity-20261014' }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild source-derived M2 presentation fixtures from repaired M3D
        run: |
          node scripts/v2/build-a-prototype-fixtures.mjs --write
          node scripts/v2/build-m2-mock-data.mjs --write
          node scripts/v2/build-a-prototype-fixtures.mjs
          node scripts/v2/build-m2-mock-data.mjs
          git diff --stat -- site/ui-v2/prototypes/a-full/source/prototype-data.json site/ui-v2/mock-data.js
      - name: Install Chromium for independent M2 vs real browser checks
        run: npx playwright install --with-deps chromium
      - name: Start read-only WaferCAD browser server
        run: |
          python3 -m http.server 4182 --directory site > /tmp/wafercad-pr242-m2.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4182/app-v2-main.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wafercad-pr242-m2.log
          exit 1
      - name: Verify real Main/M2 parity and save screenshots
        run: node scripts/v2/check-main-view.mjs
      - name: Verify real Mask/M2 parity and save screenshots
        run: node scripts/v2/check-mask-view.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pr242-repaired-m3d-m2-parity
          path: |
            test-results/ui-v2-main-review/
            test-results/ui-v2-mask-review/
            /tmp/wafercad-pr242-m2.log
          retention-days: 14
          if-no-files-found: warn
      - name: Commit ONLY verified source-derived M2 fixture files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/ui-v2/prototypes/a-full/source/prototype-data.json site/ui-v2/mock-data.js
          git diff --cached --quiet && { echo "No source fixture change"; exit 1; }
          git commit -m "fix(ui-contract): regenerate M2 source fixture after verified M3D power via rebuild"
          git push origin HEAD:audit/example-literature-fidelity-20261014

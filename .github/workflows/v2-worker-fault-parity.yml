name: V2 Process Worker fault parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v2/check-worker-fault-parity.mjs'
      - 'site/process-worker.js'
      - 'site/controllers/process-task-controller.js'
      - 'site/controllers/process-panel-controller.js'
      - 'site/ui-v2/workstation-workflow.js'
      - '.github/workflows/v2-worker-fault-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-worker-fault-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  worker-fault-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Temporary, read-only formatting diff while local source checkout is unavailable.
      # Remove after both Draft branches match the repository formatter.
      - name: One-shot formatter diff for parallel Draft owners
        shell: bash
        run: |
          npx prettier scripts/v2/check-worker-fault-parity.mjs > /tmp/worker-formatted.mjs
          diff -u scripts/v2/check-worker-fault-parity.mjs /tmp/worker-formatted.mjs || true
          git fetch --no-tags --depth=1 origin retire/legacy-d1-source-audit-20261015
          for path in scripts/legacy-retirement-owner-audit.mjs site/tests/legacy-retirement-owner-audit.test.mjs; do
            original="/tmp/$(basename "${path}").original"
            formatted="/tmp/$(basename "${path}").formatted"
            git show "FETCH_HEAD:${path}" > "${original}"
            npx prettier --stdin-filepath "${path}" < "${original}" > "${formatted}"
            diff -u "${original}" "${formatted}" || true
          done
      - run: npx playwright install --with-deps chromium
      - name: Start real v2 Workstation
        shell: bash
        run: |
          node scripts/v2/serve-v2.mjs > serve-v2.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent --output /dev/null http://127.0.0.1:4182/app.html && exit 0
            sleep 1
          done
          cat serve-v2.log
          exit 1
      - name: Verify strict rejection, Abort and successful retry against real Worker
        env:
          WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
        run: node scripts/v2/check-worker-fault-parity.mjs
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: v2-worker-fault-parity-failure
          path: serve-v2.log
          retention-days: 14

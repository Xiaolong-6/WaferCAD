name: PR264 focused formatter diff (read-only)
on:
  pull_request:
    types: [synchronize]
    branches: [feat/example-gan-hemt-microchannel-20261014]
    paths:
      - .github/workflows/pr264-format-diff-once.yml
permissions:
  contents: read
jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format only the current four disputed files
        run: |
          npx prettier --write \
            site/wafer-assembly-workspace-file.js \
            site/tests/wafer-assembly-workspace-file.test.mjs \
            site/tests/gan-hemt-microchannel-reconstruction.test.mjs \
            docs/GAN_HEMT_MICROCHANNEL_RECONSTRUCTION_2026-10-14.md
          git diff --check
      - name: Display exact formatter patch for review (no remote write)
        run: |
          git diff --no-ext-diff -- \
            site/wafer-assembly-workspace-file.js \
            site/tests/wafer-assembly-workspace-file.test.mjs \
            site/tests/gan-hemt-microchannel-reconstruction.test.mjs \
            docs/GAN_HEMT_MICROCHANNEL_RECONSTRUCTION_2026-10-14.md

name: MAGIC-1000 v2 visual acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/bundled-examples.js'
      - 'site/examples/previews/magic-1000-mos2-beol.wafercad'
      - 'site/ui-v2/three-view.js'
      - 'site/ui-v2/section-view.js'
      - 'site/ui-v2/workstation-preview.css'
      - 'scripts/magic1000-visual-acceptance.mjs'
      - '.github/workflows/magic1000-candidate.yml'
  workflow_dispatch:

concurrency:
  group: magic1000-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Read-only Section and 3D physical view
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WAFERCAD_THREE_DIR: ${{ github.workspace }}/node_modules/three
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.1
      - run: npx playwright install --with-deps chromium
      - name: Start read-only v2 preview server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > magic1000-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/app.html; then
              exit 0
            fi
            sleep 1
          done
          cat magic1000-server.log
          exit 1
      - name: Verify real v2 Section and 3D previews
        run: node scripts/magic1000-visual-acceptance.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: magic1000-v2-visual-${{ github.sha }}
          path: |
            test-results/magic1000/
            magic1000-server.log
          retention-days: 14
          if-no-files-found: warn

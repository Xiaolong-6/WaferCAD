name: KLayout format compatibility

on:
  workflow_call:
    inputs:
      scope:
        required: false
        type: string
        default: all
  workflow_dispatch:
    inputs:
      scope:
        description: Corpus scope
        required: true
        default: all
        type: choice
        options:
          - core
          - all
concurrency:
  group: klayout-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parser-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout WaferCAD
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Checkout pinned KLayout testdata
        uses: actions/checkout@v6
        with:
          repository: KLayout/klayout
          ref: 5fa733e1680212e4ceda532ca5fa6ea707c654de
          path: _klayout
          sparse-checkout: testdata

      - name: Sweep parser and flatten pipeline
        run: node scripts/klayout-compat.mjs --root _klayout/testdata --scope "${{ inputs.scope || 'all' }}" --report klayout-compat.json

      - name: Verify WaferCAD exports with KLayout
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir klayout==0.30.12
          node scripts/klayout-export-fixtures.mjs test-results/klayout-export
          python3 scripts/klayout-export-verify.py test-results/klayout-export

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: klayout-compat
          path: klayout-compat.json

  ui-import-sweep:
    needs: parser-sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout WaferCAD
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.1

      - name: Install project and browser test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Checkout pinned KLayout core format testdata
        uses: actions/checkout@v6
        with:
          repository: KLayout/klayout
          ref: 5fa733e1680212e4ceda532ca5fa6ea707c654de
          path: _klayout
          sparse-checkout: |
            testdata/gds
            testdata/oasis
            testdata/lstream

      - name: Start WaferCAD
        run: |
          python3 -m http.server 4173 --directory site > /tmp/wafercad-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wafercad-http.log
          exit 1

      - name: Real v2 GDS/OAS Mask import and masked Process Worker
        env:
          WAFERCAD_V2_BASE: http://127.0.0.1:4173
        run: node scripts/v2/check-klayout-mask-process.mjs

      - name: Sweep pinned KLayout core corpus through native v2 Mask UI
        env:
          WAFERCAD_V2_BASE: http://127.0.0.1:4173
        run: node scripts/v2/check-klayout-core-corpus.mjs

      - name: Sweep actual browser import path
        run: node scripts/klayout-ui-compat.mjs --root _klayout/testdata --url http://127.0.0.1:4173 --report klayout-ui-compat.json --failure-dir ui-failures

      - name: Upload UI compatibility report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: klayout-ui-compat
          path: |
            klayout-ui-compat.json
            test-results/klayout-v2-corpus/
            test-results/klayout-v2/
            ui-failures
          if-no-files-found: ignore

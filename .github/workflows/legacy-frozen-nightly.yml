name: Archived Legacy science (nightly)

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pre-sunset source snapshot
        uses: actions/checkout@v6
        with:
          ref: archive/legacy-frozen-20261016
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify archived Legacy source-only contracts
        run: npm test

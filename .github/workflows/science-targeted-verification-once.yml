name: Temporary targeted science verification

on:
  push:
    branches: [science/figure-provenance-299]

permissions:
  contents: read

jobs:
  science-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run three targeted tests and show exact formatter patches
        shell: bash
        run: |
          set -euo pipefail
          for branch in science/physical-facets-297 science/smooth-release-298 science/figure-provenance-299; do
            echo "::group::SCIENCE ${branch}"
            git fetch --depth=1 origin "refs/heads/${branch}"
            git checkout --force --detach FETCH_HEAD
            case "$branch" in
              science/physical-facets-297)
                testfile=site/tests/physical-facet-math.test.mjs
                files=(site/physical-facet-math.js site/tests/physical-facet-math.test.mjs docs/PHYSICAL_FACET_MODELING_2026-10-16.md)
                ;;
              science/smooth-release-298)
                testfile=site/tests/isotropic-release-oracle.test.mjs
                files=(site/isotropic-release-oracle.js site/tests/isotropic-release-oracle.test.mjs docs/ISOTROPIC_RELEASE_ORACLE_2026-10-16.md)
                ;;
              science/figure-provenance-299)
                testfile=site/tests/literature-provenance-matrix.test.mjs
                files=()
                ;;
            esac
            node --test "$testfile"
            if (( ${#files[@]} > 0 )); then
              npx --no-install prettier --write "${files[@]}"
              git --no-pager diff -- "${files[@]}"
            fi
            echo "::endgroup::"
          done
